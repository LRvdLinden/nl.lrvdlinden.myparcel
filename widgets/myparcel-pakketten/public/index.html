<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>

const CFG={
 carrier:'',logo:'',
 fields:[['sender',p=>p.sender],['receiver',p=>p.receiver],['reference',p=>p.reference],['account',p=>p.account],['service',p=>p.service],['deliveryPoint',p=>p.deliveryPoint],['accessPoint',p=>p.accessPoint],['product',p=>p.product],['weight',p=>p.weight],['dimensions',p=>p.dimensions],['partner',p=>p.partner],['shipmentType',p=>p.shipmentType],['direction',p=>p.direction],['from',p=>p.shipFrom],['to',p=>p.shipTo],['lastEvent',p=>p.lastEvent||p.status],['eventTime',p=>fmtDateTime(p.lastEventAt||p.eventAt)],['carrierState',p=>p.carrierState],['carrierResolution',p=>p.carrierResolution],['created',p=>fmtDateTime(p.createdAt)],['updated',p=>fmtDateTime(p.updatedAt)]],
 all:true,ids:[],
 async load(Homey){this.ids=Homey.getDeviceIds()||[];try{const st=Homey.getSettings()||{};this.all=st.all_carriers!==false}catch(_){}return Homey.api('GET','/?deviceIds='+encodeURIComponent(this.ids.join(','))+(this.all?'&all=1':''),{})},
 check(x){return !this.all&&(!this.ids.length||!x.selectedDeviceCount)?tr('select'):''}
};
function onHomeyReady(Homey){
 const c=document.getElementById('c'),modal=document.getElementById('modal'),dialog=document.getElementById('dialog'),dialogContent=document.getElementById('dialogContent'),closeButton=document.getElementById('close');
 let packages=[];
 const el=(tag,cls,value)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n};
 const carrierOf=p=>CFG.carrier||txt(p.carrier);
 const logoOf=p=>CFG.logo||p.carrierLogo||'icon.svg';
 const nameOf=p=>txt(p.sender||p.title||p.tracking||carrierOf(p));
 function state(message){const s=el('div','state',message);c.replaceChildren(s)}
 function showDetailRow(list,label,value){value=txt(value);if(!value)return;const row=el('div','detail-row');row.append(el('span','detail-label',label),el('strong','detail-value',value));list.append(row)}
 function stat(label,value){value=txt(value);if(!value)return null;const n=el('div','stat');n.append(el('span','',label),el('strong','',value));return n}
 function closePopup(){modal.classList.remove('open');dialogContent.replaceChildren()}
 function openPopup(p){
  try{Homey.hapticFeedback?.()}catch(_){}
  const hero=el('div','popup-hero'),logo=el('div','popup-logo'),img=document.createElement('img');img.src=logoOf(p);img.alt=carrierOf(p);logo.append(img);hero.append(logo);
  const identity=el('div','identity');const pn=el('strong','popup-name',nameOf(p)||tr('status'));pn.dir='auto';identity.append(pn,el('span','carrier-chip',carrierOf(p)));hero.append(identity);
  const status=el('div','popup-status');status.append(el('span','status-label',tr('status')),el('p','status-value',txt(p.status)||'—'));if(p.tracking)status.append(el('p','tracking-sub',tr('trackingValue',{value:p.tracking})));
  const stats=el('div','stats');const sd=stat(tr('deliveryDate'),fmtDate(p.deliveryDate||p.deliveryWindowFrom||p.eventAt||p.updatedAt,{dateStyle:'medium'})),sw=stat(tr('deliveryWindow'),p.deliveryWindow);if(sd)stats.append(sd);if(sw)stats.append(sw);
  const list=el('div','detail-list');for(const[key,get]of CFG.fields)showDetailRow(list,tr(key),get(p));
  dialogContent.replaceChildren(hero,status);if(stats.children.length)dialogContent.append(stats);if(list.children.length)dialogContent.append(list);dialog.scrollTop=0;modal.classList.add('open');closeButton.focus?.();
 }
 function rowSummary(p){
  const win=txt(p.deliveryWindow);
  const short={day:'numeric',month:'short'};
  const deliveryDay=fmtDate(p.deliveryDate||p.deliveryWindowFrom||p.updatedAt,short);
  const eventValue=p.lastEventAt||p.eventAt||(p.delivered?p.deliveryDate:'')||p.updatedAt||p.createdAt||p.deliveryDate;
  const eventDay=fmtDate(eventValue||p.deliveryDate,short)||deliveryDay;
  const eventTime=fmtTime(eventValue);
  if(!p.delivered&&win&&win!=='-')return [deliveryDay,win].filter(Boolean).join(' · ');
  const event=[eventDay,eventTime].filter(Boolean).join(' · ');
  return event||[deliveryDay,win&&win!=='-'?win:''].filter(Boolean).join(' · ')||txt(p.tracking);
 }
 function render(){
  if(!packages.length){state(tr('empty'));return}
  const list=el('div','list');list.setAttribute('role','list');list.setAttribute('aria-label',trCount('parcelCount',packages.length));
  for(const p of packages){const row=el('article','p');row.tabIndex=0;row.setAttribute('role','button');row.setAttribute('aria-label',`${nameOf(p)} – ${txt(p.status)}`);const carrier=el('div','carrier'),img=document.createElement('img');img.src=logoOf(p);img.alt=carrierOf(p);carrier.append(img);const meta=el('div','meta');const snd=el('div','sender',nameOf(p));snd.dir='auto';meta.append(snd,el('div','carriername',carrierOf(p)),el('div','detail',rowSummary(p)));const badge=el('div','badge',txt(p.status)||'—');badge.title=txt(p.status);row.append(carrier,meta,badge);row.addEventListener('click',()=>openPopup(p));row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPopup(p)}});list.append(row)}
  c.replaceChildren(list);
 }
 (async()=>{try{const x=await CFG.load(Homey);setLang(x.locale,x.timeZone||'UTC');const msg=CFG.check(x);if(msg){state(msg);return}packages=Array.isArray(x.packages)?x.packages:[];render()}catch(e){state(e&&e.message?e.message:String(e))}})();
 closeButton.onclick=closePopup;modal.onclick=e=>{if(e.target===modal)closePopup()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()});
 Homey.ready();
}
</script></body></html>
