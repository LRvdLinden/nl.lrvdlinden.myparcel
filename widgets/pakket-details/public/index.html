<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;--orange:#FB6200;--primary:#232323;--secondary:#747378;--muted:#97969b;--card:#f4f4f5;--header:#fafafa;--border:#dedee0;--panel:#fff;--line:#777b9c;--pill:#fff0e6;--dialog:#fff;--stat:#fff6f0}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.card{display:grid;grid-template-rows:52px minmax(0,1fr);width:100%;height:100%;overflow:hidden;border-radius:17px;background:var(--card)}header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}.app-icon{width:36px;height:36px;object-fit:contain}h1{margin:0 0 0 auto;color:#77767b;font-size:18px;font-weight:600;white-space:nowrap}#content{min-width:0;min-height:0;padding:10px 12px;overflow:auto}.package{height:100%;min-height:0;overflow:hidden;border-radius:12px;background:var(--panel);padding:12px 12px 10px;display:flex;flex-direction:column}.package-top{display:flex;align-items:center;gap:9px;min-height:28px}.mini-logo{width:38px;height:38px;object-fit:contain;flex:0 0 auto}.sender{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.status{color:var(--secondary);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42%}.headline{font-size:13px;font-weight:650;margin:9px 0 1px}.tracking{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vanwrap{flex:1;min-height:82px;display:grid;place-items:center;padding:4px 0}.van{display:block;max-width:260px;max-height:145px;object-fit:contain}.van.animated-van{width:240px;height:auto;max-width:100%;max-height:none}.timeline{position:relative;height:58px}.track{position:absolute;left:0;right:0;top:20px;height:3px;background:var(--line)}.elapsed{position:absolute;left:0;top:20px;height:3px;background:var(--orange);width:0}.dot{position:absolute;top:12px;width:18px;height:18px;margin-left:-9px;border:4px solid var(--orange);border-radius:50%;background:var(--panel);left:0}.actual-start,.actual-end{position:absolute;top:11px;width:3px;height:21px;background:#cfcfd5;border-radius:2px}.times{position:absolute;left:0;right:0;top:33px;display:grid;grid-template-columns:1fr 1fr 1fr;color:var(--muted);font-size:10px}.times span:nth-child(2){text-align:center}.times span:nth-child(3){text-align:right}.hidden{display:none!important}.state{display:grid;place-items:center;height:100%;padding:16px;text-align:center;color:var(--primary)}.state-inner{display:grid;place-items:center;gap:12px}.state .van{width:min(88%,290px);max-height:170px}.state p{margin:0;font-size:17px;font-weight:700}
.multi-head{padding:3px 4px 10px;font-weight:800;font-size:15px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:42px minmax(0,1fr) minmax(88px,130px);gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--border);border-radius:12px;background:var(--panel);cursor:pointer}.row img{width:38px;height:38px;object-fit:contain}.rmeta{min-width:0}.rsender{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rsub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{padding:6px 8px;border-radius:14px;background:var(--pill);color:#9a3f00;font-size:10px;font-weight:800;text-align:center;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:18px;background:#000c}.modal.open{display:grid}.dialog{position:relative;width:min(380px,100%);max-height:calc(100vh - 28px);overflow:auto;border-radius:22px;background:var(--dialog);box-shadow:0 18px 50px #0004}.close{position:absolute;right:10px;top:10px;width:34px;height:34px;border:0;border-radius:50%;font-size:22px;cursor:pointer}.hero{padding:18px 54px 14px 18px;background:linear-gradient(140deg,#ffe4d0,#fff9f5)}.hero strong{font-size:20px}.hero small{display:block;color:var(--secondary);margin-top:5px}.details{padding:8px 18px 14px}.drow{display:grid;grid-template-columns:minmax(105px,40%) minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--border)}.drow span{color:var(--secondary);font-size:10px}.drow b{font-size:12px;text-align:right;overflow-wrap:anywhere;white-space:pre-line}
@media(prefers-color-scheme:dark){:root{--primary:#f4f4f5;--secondary:#c4c3c7;--muted:#aaa9ad;--card:#202022;--header:#29292b;--border:#424244;--panel:#343436;--line:#71748e;--pill:#5a341d;--dialog:#292b2a;--stat:#3a302a}h1{color:#aaa9ad}.dot{background:var(--panel)}.badge{color:#ffd2b3}.hero{background:linear-gradient(140deg,#5a321b,#342a25)}}
</style></head><body><main class="card"><header><img class="app-icon" src="icon.svg"><h1 id="title">Mijn Bezorging</h1></header><section id="content"><div class="state">Pakket ophalen…</div></section></main><div id="modal" class="modal"><section class="dialog"><button id="close" class="close">×</button><div id="dialogContent"></div></section></div><script>
const I={nl:{title:'Mijn Bezorging',empty:'Er is geen pakket onderweg',multi:'Pakketten onderweg',today:'Vandaag tussen {from} en {to}',tomorrow:'Morgen tussen {from} en {to}',date:'{date} tussen {from} en {to}',tracking:'Tracking',status:'Status',sender:'Afzender',receiver:'Ontvanger',window:'Bezorgvenster',weight:'Gewicht',dimensions:'Afmetingen',canonical:'Canonieke status',observation:'Observation code',pickup:'PostNL-punt',history:'Status-history',yes:'Ja',no:'Nee'},en:{title:'My Delivery',empty:'There is currently no parcel on the way',multi:'Parcels on the way',today:'Today between {from} and {to}',tomorrow:'Tomorrow between {from} and {to}',date:'{date} between {from} and {to}',tracking:'Tracking',status:'Status',sender:'Sender',receiver:'Receiver',window:'Delivery window',weight:'Weight',dimensions:'Dimensions',canonical:'Canonical status',observation:'Observation code',pickup:'PostNL Point',history:'Status history',yes:'Yes',no:'No'}};
function L(v){return String(v||'en').split('-')[0]==='nl'?'nl':'en'}function T(v){return String(v??'').trim()}function E(v){return T(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function P(v,tz){const r=T(v);if(!r)return null;const d=new Date(r);if(Number.isNaN(d.getTime()))return null;const a=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),g=t=>a.find(x=>x.type===t)?.value||'';return{date:`${g('year')}-${g('month')}-${g('day')}`,mins:+g('hour')*60+ +g('minute'),time:`${g('hour')}:${g('minute')}`}}function now(tz){const d=new Date(),a=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d),g=t=>a.find(x=>x.type===t)?.value||'';return{date:`${g('year')}-${g('month')}-${g('day')}`,secs:+g('hour')*3600+ +g('minute')*60+ +g('second')}}function day(k,n){const[y,m,d]=k.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d+n,12));return x.toISOString().slice(0,10)}function dmy(k){if(!k)return'';const[y,m,d]=k.split('-');return`${d}-${m}-${y}`}function F(s,o){return Object.entries(o).reduce((a,[k,v])=>a.replace(`{${k}}`,v),s)}
function onHomeyReady(Homey){const host=document.getElementById('content'),title=document.getElementById('title'),modal=document.getElementById('modal'),dc=document.getElementById('dialogContent');let data,lab=I.en,timer;
function empty(){host.innerHTML=`<div class="state"><div class="state-inner"><img class="van" src="van-1.svg"><p>${E(lab.empty)}</p></div></div>`}
function summary(p){const a=P(p.deliveryWindowFrom,data.timeZone),b=P(p.deliveryWindowTo,data.timeZone);return [a?.date?dmy(a.date):'',p.deliveryWindow||(a&&b?`${a.time} - ${b.time}`:'')].filter(Boolean).join(' · ')}
function drow(k,v){if(v===undefined||v===null||T(v)==='')return'';return `<div class="drow"><span>${E(k)}</span><b>${E(v)}</b></div>`}
function popup(p){const hist=Array.isArray(p.statusHistory)?p.statusHistory.slice().reverse().map(x=>{const d=new Date(x.timestamp);const w=Number.isNaN(d.getTime())?T(x.timestamp):d.toLocaleString(data.locale==='nl'?'nl-NL':'en-GB');return [w,T(x.raw_status||x.rawStatus||x.description||x.status),T(x.observation_code||x.observationCode)].filter(Boolean).join(' · ')}).join('\n'):'';dc.innerHTML=`<div class="hero"><strong>${E(p.sender||'PostNL')}</strong><small>${E(p.tracking)}</small></div><div class="details">${drow(lab.status,p.status)}${drow(lab.receiver,p.receiver)}${drow(lab.window,p.deliveryWindow)}${drow(lab.weight,p.weight)}${drow(lab.dimensions,p.dimensions)}${drow(lab.canonical,p.canonicalStatus)}${drow(lab.observation,p.observationCode)}${drow(lab.pickup,p.pickup?(p.pickupPoint||lab.yes):lab.no)}${drow(lab.history,hist)}</div>`;modal.classList.add('open')}
function single(p){const a=P(p.deliveryWindowFrom,data.timeZone),b=P(p.deliveryWindowTo,data.timeZone),n=now(data.timeZone),date=a?.date||P(p.deliveryDate,data.timeZone)?.date||'';let h=T(p.status);if(a&&b){h=F(date===n.date?lab.today:date===day(n.date,1)?lab.tomorrow:lab.date,{from:a.time,to:b.time,date:dmy(date)})}host.innerHTML=`<section class="package"><div class="package-top"><img class="mini-logo" src="package.svg"><div class="sender">${E(p.sender||'PostNL')}</div><div class="status">${E(p.status)}</div></div><div class="headline">${E(h)}</div><div class="tracking">${p.tracking?E(lab.tracking+': '+p.tracking):''}</div><div class="vanwrap"><img class="van animated-van" src="postnl-van.gif"></div><div class="timeline ${a&&b?'':'hidden'}"><div class="track"></div><div class="elapsed"></div><div class="dot"></div><i class="actual-start"></i><i class="actual-end"></i><div class="times"><span></span><span></span><span></span></div></div></section>`;update();clearInterval(timer);timer=setInterval(update,1000)}
function multi(list){clearInterval(timer);host.innerHTML='';const head=document.createElement('div');head.className='multi-head';head.textContent=`${lab.multi} · ${list.length}`;const box=document.createElement('div');box.className='list';for(const p of list){const r=document.createElement('div');r.className='row';r.innerHTML=`<img src="package.svg"><div class="rmeta"><div class="rsender">${E(p.sender||p.tracking||'PostNL')}</div><div class="rsub">${E(summary(p)||p.tracking)}</div></div><div class="badge">${E(p.status||'—')}</div>`;r.onclick=()=>popup(p);box.append(r)}host.append(head,box)}
function update(){const p=data?.parcel,a=P(p?.deliveryWindowFrom,data.timeZone),b=P(p?.deliveryWindowTo,data.timeZone);if(!p||!a||!b)return;const n=now(data.timeZone),ds=a.mins-60,de=b.mins+60,span=Math.max(1,(de-ds)*60),pct=n.date>a.date?100:n.date<a.date?0:Math.max(0,Math.min(100,(n.secs-ds*60)/span*100));const q=s=>host.querySelector(s);if(q('.elapsed'))q('.elapsed').style.width=pct+'%';if(q('.dot'))q('.dot').style.left=pct+'%';const sp=((a.mins-ds)/(de-ds))*100,ep=((b.mins-ds)/(de-ds))*100;if(q('.actual-start'))q('.actual-start').style.left=sp+'%';if(q('.actual-end'))q('.actual-end').style.left=ep+'%';const vals=[`${String(Math.floor(((ds%1440)+1440)%1440/60)).padStart(2,'0')}:${String(((ds%60)+60)%60).padStart(2,'0')}`,`${String(Math.floor((((ds+de)/2)%1440+1440)%1440)/60).padStart(2,'0')}`,`${String(Math.floor(((de%1440)+1440)%1440/60)).padStart(2,'0')}`];const ss=host.querySelectorAll('.times span');if(ss[0])ss[0].textContent=vals[0];if(ss[2])ss[2].textContent=vals[2]}
(async()=>{try{const id=(Homey.getDeviceIds()||[])[0]||'';data=await Homey.api('GET','/?deviceId='+encodeURIComponent(id),{});lab=I[L(data.locale)];title.textContent=lab.title;if(!data.authenticated||!Array.isArray(data.parcels)||!data.parcels.length)empty();else if(data.parcels.length===1)single(data.parcels[0]);else multi(data.parcels)}catch(e){host.innerHTML='<div class="state">'+E(e.message||e)+'</div>'}Homey.ready()})();document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')}
}</script></body></html>
