<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;color:#1b2520}.card{height:100%;min-height:410px;border-radius:22px;background:#eef4f1;overflow:hidden;display:flex;flex-direction:column}.header{height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid rgba(16,89,69,.18)}.header img{width:34px;height:34px}.header h1{font-size:19px;margin:0;font-weight:800}.list{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}.delivery{background:#fff;border:1px solid rgba(16,89,69,.16);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}.top{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px}.logo{width:40px;height:30px;object-fit:contain}.sender{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.carrier{font-size:12px;color:#66736d;margin-top:2px}.badge{background:#105945;color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;max-width:125px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.when{font-size:17px;font-weight:750;margin:14px 0 11px}.route{position:relative;height:42px}.line{position:absolute;left:3px;right:3px;top:13px;height:4px;background:#c9d7d1;border-radius:4px}.fill{position:absolute;left:3px;top:13px;height:4px;background:#105945;border-radius:4px}.dots{position:absolute;left:0;right:0;top:4px;display:flex;justify-content:space-between}.dot{width:22px;height:22px;border-radius:50%;border:4px solid #aabdb5;background:#fff}.dot.on{border-color:#105945}.labels{display:flex;justify-content:space-between;font-size:10px;color:#6c7b75;margin-top:-4px}.meta{font-size:11px;color:#6c7b75;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px}.empty img{width:165px;max-width:55%;margin-bottom:18px}.empty strong{font-size:20px}.empty span{margin-top:7px;color:#6c7b75;font-size:13px}@media(prefers-color-scheme:dark){body{color:#f4f6f5}.card{background:#1f2925}.header{border-color:#31453c}.delivery{background:#27332e;border-color:#344b41}.carrier,.meta,.labels,.empty span{color:#b4c2bc}.line{background:#4d6259}.dot{background:#27332e;border-color:#60756c}.dot.on{border-color:#5ec49c}.fill{background:#5ec49c}.badge{background:#105945}}
</style></head><body><main class="card"><header class="header"><img src="icon.svg"><h1 id="title">MyParcel Delivery</h1></header><section class="list" id="list"><div class="empty"><strong>Loading…</strong></div></section></main><script>
const I={

 de:{title:'MyParcel Zustellung',empty:'Keine Zustellung unterwegs',hint:'Wähle alle oder nur die gewünschten Paketdienste für dieses Widget.',today:'Heute',between:'zwischen',and:'und',registered:'Angekündigt',sorting:'Sortierung',underway:'Unterwegs',delivered:'Zugestellt',updated:'Aktualisiert'},

 no:{title:'MyParcel Levering',empty:'Ingen levering er på vei',hint:'Velg alle transportører eller bare de du vil vise.',today:'I dag',between:'mellom',and:'og',registered:'Registrert',sorting:'Sortering',underway:'På vei',delivered:'Levert',updated:'Oppdatert'},
 es:{title:'Entrega MyParcel',empty:'No hay ninguna entrega en camino',hint:'Selecciona todos los transportistas o solo los que quieras mostrar.',today:'Hoy',between:'entre',and:'y',registered:'Registrado',sorting:'Clasificación',underway:'En camino',delivered:'Entregado',updated:'Actualizado'},

 ru:{title:'Доставка MyParcel',empty:'Нет активной доставки',hint:'Выберите всех перевозчиков или только нужных.',today:'Сегодня',between:'между',and:'и',registered:'Зарегистрировано',sorting:'Сортировка',underway:'В пути',delivered:'Доставлено',updated:'Обновлено'},
 pl:{title:'Dostawa MyParcel',empty:'Brak dostawy w drodze',hint:'Wybierz wszystkich przewoźników lub tylko tych, których chcesz pokazać.',today:'Dzisiaj',between:'między',and:'a',registered:'Zarejestrowano',sorting:'Sortowanie',underway:'W drodze',delivered:'Doręczono',updated:'Zaktualizowano'},
 ko:{title:'MyParcel 배송',empty:'배송 중인 항목이 없습니다',hint:'모든 배송사 또는 이 위젯에 표시할 배송사만 선택하세요.',today:'오늘',between:'사이',and:'~',registered:'접수',sorting:'분류',underway:'배송 중',delivered:'배송 완료',updated:'업데이트'},

};
let cfg={locale:'en',timeZone:'UTC'},deviceIds=[];const list=document.getElementById('list'),title=document.getElementById('title');
const text=v=>v==null?'':String(v);const esc=v=>text(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hm(v){const s=text(v),m=s.match(/T(\d{2}):(\d{2})/);if(m)return m[1]+':'+m[2];const m2=s.match(/\b(\d{1,2}:\d{2})\b/);return m2?m2[1]:''}
function dateKey(v){const s=text(v),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:''}
function todayKey(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:cfg.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),g=t=>p.find(x=>x.type===t)?.value||'';return g('year')+'-'+g('month')+'-'+g('day')}
function phase(p){if(p.delivered)return 4;const s=(text(p.status)+' '+text(p.lastEvent)).toLowerCase();if(/out for delivery|onderweg naar|bezorger|delivery|courier|en route|in consegna|unterwegs/.test(s)||p.deliveryWindowFrom||p.deliveryWindowTo)return 3;if(/sort|region|depot|hub|centrum|center/.test(s))return 2;return 1}
function when(p,L){const a=hm(p.deliveryWindowFrom),b=hm(p.deliveryWindowTo);if(a||b){const day=dateKey(p.deliveryWindowFrom||p.deliveryDate),prefix=day===todayKey()?L.today:'';return [prefix,L.between,[a,b].filter(Boolean).join(' '+L.and+' ')].filter(Boolean).join(' ')}if(p.deliveryWindow)return (dateKey(p.deliveryDate)===todayKey()?L.today+' ':'')+text(p.deliveryWindow);return text(p.status)||L.underway}
function render(data){const L=I[cfg.locale]||I.en;title.textContent=L.title;const rows=Array.isArray(data?.deliveries)?data.deliveries:[];if(!rows.length){list.innerHTML='<div class="empty"><img src="van.svg"><strong>'+esc(L.empty)+'</strong><span>'+esc(L.hint)+'</span></div>';return}list.innerHTML=rows.map(p=>{const ph=phase(p),pct=[0,0,33,66,100][ph],labels=[L.registered,L.sorting,L.underway,L.delivered];return '<article class="delivery"><div class="top"><img class="logo" src="'+esc(p.carrierLogo||'icon.svg')+'"><div><div class="sender">'+esc(p.sender||p.title||p.tracking||p.carrier)+'</div><div class="carrier">'+esc(p.carrier)+'</div></div><div class="badge">'+esc(p.status||L.underway)+'</div></div><div class="when">'+esc(when(p,L))+'</div><div class="route"><div class="line"></div><div class="fill" style="width:'+pct+'%"></div><div class="dots">'+labels.map((_,i)=>'<span class="dot '+(i+1<=ph?'on':'')+'"></span>').join('')+'</div></div><div class="labels">'+labels.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div><div class="meta">'+esc([p.tracking,p.updatedAt?L.updated+': '+p.updatedAt:''].filter(Boolean).join(' · '))+'</div></article>'}).join('')}
async function load(force=false){try{if(force)await Homey.api('POST','/refresh',{deviceIds});const q='/?deviceIds='+encodeURIComponent(deviceIds.join(','));const d=await Homey.api('GET',q,{});cfg.locale=d.locale||'en';cfg.timeZone=d.timeZone||'UTC';document.documentElement.dir=cfg.locale==='ar'?'rtl':'ltr';render(d)}catch(e){const L=I[cfg.locale]||I.en;list.innerHTML='<div class="empty"><img src="van.svg"><strong>'+esc(e?.message||L.empty)+'</strong></div>'}}
Homey.ready();(async()=>{deviceIds=typeof Homey.getDeviceIds==='function'?(Homey.getDeviceIds()||[]):[];await load(false);setInterval(()=>load(false),30000);setInterval(()=>load(true),120000)})();
</script></body></html>
