<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark;--brand:#105945;--card:#f4f4f5;--header:#fafafa;--border:#dedee0;--row:#fff;--carrier:#f3f3f4;--primary:#232323;--secondary:#747378;--muted:#97969b;--title:#77767b;--pill:#e8f5ea;--pill-text:#1f3023;--timeline:#cfd6d3}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;height:100%;margin:0;overflow:hidden;overflow-x:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{display:grid;grid-template-rows:52px minmax(0,1fr);width:100%;max-width:100%;min-width:0;height:100%;border-radius:17px;overflow:hidden;background:var(--card);color:var(--primary)}
.header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}
.header img{width:36px;height:36px;object-fit:contain}
.header h1{margin:0 0 0 auto;color:var(--title);font-size:18px;font-weight:600;white-space:nowrap}
.list{width:100%;max-width:100%;min-width:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px;color:var(--primary);display:grid;gap:8px;align-content:start}
.delivery{width:100%;max-width:100%;min-width:0;overflow:hidden;padding:11px 12px;border:1px solid var(--border);border-radius:11px;background:var(--row);color:var(--primary)}
.top{display:grid;grid-template-columns:54px minmax(0,1fr) minmax(70px,120px);gap:10px;align-items:center;min-width:0;max-width:100%}.logo{display:block;max-width:44px;max-height:30px;object-fit:contain;margin:auto}.top>img.logo{width:54px;height:42px;padding:6px;border-radius:9px;background:var(--carrier)}
.sender{color:var(--primary);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.carrier{color:var(--secondary);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:block;max-width:120px;padding:5px 8px;border-radius:999px;background:var(--pill);color:var(--pill-text);font-size:10px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.when{margin:12px 0 8px;color:var(--primary);font-size:16px;font-weight:750}.route{position:relative;height:36px}.line{position:absolute;left:3px;right:3px;top:12px;height:4px;background:var(--timeline);border-radius:4px}.fill{position:absolute;left:3px;top:12px;height:4px;background:var(--brand);border-radius:4px}.dots{position:absolute;left:0;right:0;top:3px;display:flex;justify-content:space-between}.dot{width:22px;height:22px;border-radius:50%;border:4px solid #b9c1bd;background:var(--row)}.dot.on{border-color:var(--brand)}.labels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:100%;min-width:0;margin-top:-3px;color:var(--secondary);font-size:10px}.labels span{min-width:0;text-align:center;white-space:normal;overflow-wrap:anywhere}.meta{margin-top:8px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{display:flex;min-height:100%;height:100%;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--primary)}.empty img{width:190px;max-width:58%;margin-bottom:20px}.empty strong{font-size:20px;font-weight:800}.empty span{display:none}
@media(prefers-color-scheme:dark){:root{--card:#202022;--header:#29292b;--border:#424244;--row:#343436;--carrier:#252527;--primary:#f4f4f5;--secondary:#c4c3c7;--muted:#aaa9ad;--title:#aaa9ad;--pill:#23432b;--pill-text:#eef8f0;--timeline:#4d5551}.dot{border-color:#60706a}}

function text(v){return v==null?'':String(v)}
function esc(v){return text(v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function onHomeyReady(Homey){
 const list=document.getElementById('list');
 const title=document.getElementById('title');
 let cfg={locale:'en',timeZone:'UTC'};
 let deviceIds=[];
 function labels(){return I[cfg.locale]||I.en}
 function hm(v){const s=text(v),m=s.match(/T(\d{2}):(\d{2})/);if(m)return m[1]+':'+m[2];const m2=s.match(/\b(\d{1,2}:\d{2})\b/);return m2?m2[1]:''}
 function dateKey(v){const s=text(v),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:''}
 function todayKey(){try{const p=new Intl.DateTimeFormat('en-CA',{timeZone:cfg.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()),g=t=>{const x=p.find(y=>y.type===t);return x?x.value:''};return g('year')+'-'+g('month')+'-'+g('day')}catch(_){return''}}
 function phase(p){if(p.delivered)return 4;const st=(text(p.status)+' '+text(p.lastEvent)).toLowerCase();if(/out for delivery|onderweg naar|bezorger|courier|en route|in consegna|unterwegs/.test(st)||p.deliveryWindowFrom||p.deliveryWindowTo)return 3;if(/sort|region|depot|hub|centrum|center/.test(st))return 2;return 1}
 function when(p,L){const a=hm(p.deliveryWindowFrom),b=hm(p.deliveryWindowTo);if(a||b){const day=dateKey(p.deliveryWindowFrom||p.deliveryDate),prefix=day===todayKey()?L.today:'';return [prefix,L.between,[a,b].filter(Boolean).join(' '+L.and+' ')].filter(Boolean).join(' ')}if(p.deliveryWindow)return (dateKey(p.deliveryDate)===todayKey()?L.today+' ':'')+text(p.deliveryWindow);return text(p.status)||L.underway}
 function render(data){const L=labels();title.textContent=L.title;const rows=Array.isArray(data&&data.deliveries)?data.deliveries:[];if(!deviceIds.length||!data||!data.selectedDeviceCount){list.innerHTML='<div class="empty"><img src="van.svg"><strong>'+esc(L.select)+'</strong></div>';return}if(!rows.length){list.innerHTML='<div class="empty"><img src="van.svg"><strong>'+esc(L.empty)+'</strong></div>';return}list.innerHTML=rows.map(function(p){const ph=phase(p),pct=[0,0,33,66,100][ph],labs=[L.registered,L.sorting,L.underway,L.delivered];return '<article class="delivery"><div class="top"><img class="logo" src="'+esc(p.carrierLogo||'icon.svg')+'"><div><div class="sender">'+esc(p.sender||p.title||p.tracking||p.carrier)+'</div><div class="carrier">'+esc(p.carrier)+'</div></div><div class="badge">'+esc(p.status||L.underway)+'</div></div><div class="when">'+esc(when(p,L))+'</div><div class="route"><div class="line"></div><div class="fill" style="width:'+pct+'%"></div><div class="dots">'+labs.map(function(_,i){return '<span class="dot '+(i+1<=ph?'on':'')+'"></span>'}).join('')+'</div></div><div class="labels">'+labs.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div><div class="meta">'+esc([p.tracking,p.updatedAt?L.updated+': '+p.updatedAt:''].filter(Boolean).join(' · '))+'</div></article>'}).join('')}
 async function load(force){try{if(force)await Homey.api('POST','/refresh',{deviceIds:deviceIds});const q='/?deviceIds='+encodeURIComponent(deviceIds.join(','));const d=await Homey.api('GET',q,{});cfg.locale=d&&d.locale?String(d.locale).split('-')[0]:'en';cfg.timeZone=d&&d.timeZone?d.timeZone:'UTC';document.documentElement.dir=cfg.locale==='ar'?'rtl':'ltr';render(d)}catch(e){const L=labels();list.innerHTML='<div class="empty"><img src="van.svg"><strong>'+esc(e&&e.message?e.message:L.empty)+'</strong></div>'}}
 try{deviceIds=Homey.getDeviceIds()||[];if(!Array.isArray(deviceIds))deviceIds=[];}catch(_){deviceIds=[]}

 load(false);
 setInterval(function(){load(false)},30000);
 setInterval(function(){load(true)},300000);
