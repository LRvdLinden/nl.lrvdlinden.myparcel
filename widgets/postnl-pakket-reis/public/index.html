<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark;--orange:#FB6200;--primary:#232323;--secondary:#747378;--muted:#97969b;--bg:#f4f4f5;--header:#fafafa;--border:#dedee0;--panel:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr);border-radius:17px;overflow:hidden;background:var(--bg)}header{display:flex;align-items:center;gap:10px;min-width:0;padding:0 18px;background:var(--header);border-bottom:1px solid var(--border)}header img{flex:0 0 auto;width:36px;height:36px}h1{min-width:0;margin:0;margin-inline-start:auto;color:#77767b;font-size:clamp(14px,5vw,18px);line-height:1.1;font-weight:600;text-align:end;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.body{min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior-y:contain;padding:15px 16px 18px;scrollbar-gutter:stable}.summary{padding:0 2px 13px;border-bottom:1px solid var(--border)}.sender{font-size:16px;font-weight:800;overflow-wrap:anywhere}html[dir=rtl] .sender{text-align:right}.tracking,.physical{color:var(--secondary);font-size:11px;margin-top:3px;overflow-wrap:anywhere}.status{display:flex;align-items:flex-start;gap:9px;font-size:18px;font-weight:850;margin-top:8px;overflow-wrap:anywhere}.current{flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:14px}.journey{position:relative;padding-block-start:13px;padding-inline-start:42px}.journey:before{content:"";position:absolute;inset-inline-start:17px;top:24px;bottom:18px;width:3px;background:var(--orange)}.event{position:relative;padding:0 0 18px;min-height:55px}.dot{position:absolute;inset-inline-start:-39px;top:2px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:17px;font-weight:900}.when{font-weight:750;font-size:12px}.msg{font-size:14px;margin-top:4px;overflow-wrap:anywhere}.location{font-size:11px;color:var(--secondary);margin-top:3px}.state{height:100%;display:grid;place-items:center;text-align:center;padding:25px;color:var(--muted);overflow-wrap:anywhere}.state img{width:min(88%,290px);max-height:170px;margin-bottom:14px}.state strong{display:block;font-size:17px;color:inherit;font-weight:700}@media(prefers-color-scheme:dark){:root{--primary:#f4f4f5;--secondary:#c4c3c7;--muted:#aaa9ad;--bg:#202022;--header:#29292b;--border:#424244;--panel:#343436}h1{color:#aaa9ad}.state{color:#aaa9ad}}</style></head><body><main class="card"><header><img src="icon.svg" alt="PostNL"><h1 id="title" data-t="title"></h1></header><section id="body" class="body" aria-live="polite"><div class="state" data-t="loading"></div></section></main><script>
const I18N={"en":{"currentStatus":"Current status","dimensionsValue":"Dimensions: {value}","empty":"There is currently no parcel journey.","eventDone":"Completed step","loading":"Loading parcel journey…","login":"Connect your PostNL account first.","title":"Parcel Journey","trackingValue":"Tracking number: {value}","weightValue":"Weight: {value}"},"nl":{"currentStatus":"Huidige status","dimensionsValue":"Afmetingen: {value}","empty":"Er is momenteel geen pakketreis.","eventDone":"Afgeronde stap","loading":"Pakketreis ophalen…","login":"Koppel eerst je PostNL-account.","title":"Reis van je pakket","trackingValue":"Trackingnummer: {value}","weightValue":"Gewicht: {value}"},"de":{"currentStatus":"Aktueller Status","dimensionsValue":"Abmessungen: {value}","empty":"Zurzeit gibt es keine Paketreise.","eventDone":"Abgeschlossener Schritt","loading":"Paketreise wird geladen…","login":"Verbinde zuerst dein PostNL-Konto.","title":"Paketreise","trackingValue":"Sendungsnummer: {value}","weightValue":"Gewicht: {value}"},"fr":{"currentStatus":"Statut actuel","dimensionsValue":"Dimensions : {value}","empty":"Aucun parcours de colis pour le moment.","eventDone":"Étape terminée","loading":"Chargement du parcours du colis…","login":"Connectez d’abord votre compte PostNL.","title":"Parcours du colis","trackingValue":"Numéro de suivi : {value}","weightValue":"Poids : {value}"},"it":{"currentStatus":"Stato attuale","dimensionsValue":"Dimensioni: {value}","empty":"Al momento non c’è nessun viaggio del pacco.","eventDone":"Passaggio completato","loading":"Caricamento del viaggio del pacco…","login":"Collega prima il tuo account PostNL.","title":"Viaggio del pacco","trackingValue":"Numero di tracciamento: {value}","weightValue":"Peso: {value}"},"sv":{"currentStatus":"Aktuell status","dimensionsValue":"Mått: {value}","empty":"Det finns för närvarande ingen paketresa.","eventDone":"Slutfört steg","loading":"Hämtar paketets resa…","login":"Anslut först ditt PostNL-konto.","title":"Paketets resa","trackingValue":"Spårningsnummer: {value}","weightValue":"Vikt: {value}"},"no":{"currentStatus":"Nåværende status","dimensionsValue":"Mål: {value}","empty":"Det er ingen pakkereise akkurat nå.","eventDone":"Fullført trinn","loading":"Henter pakkens reise…","login":"Koble til PostNL-kontoen din først.","title":"Pakkens reise","trackingValue":"Sporingsnummer: {value}","weightValue":"Vekt: {value}"},"es":{"currentStatus":"Estado actual","dimensionsValue":"Dimensiones: {value}","empty":"Actualmente no hay ningún viaje de paquete.","eventDone":"Paso completado","loading":"Cargando el viaje del paquete…","login":"Conecta primero tu cuenta de PostNL.","title":"Viaje del paquete","trackingValue":"Número de seguimiento: {value}","weightValue":"Peso: {value}"},"da":{"currentStatus":"Aktuel status","dimensionsValue":"Mål: {value}","empty":"Der er i øjeblikket ingen pakkerejse.","eventDone":"Fuldført trin","loading":"Henter pakkens rejse…","login":"Forbind først din PostNL-konto.","title":"Pakkens rejse","trackingValue":"Sporingsnummer: {value}","weightValue":"Vægt: {value}"},"ru":{"currentStatus":"Текущий статус","dimensionsValue":"Размеры: {value}","empty":"Сейчас нет пути посылки для отображения.","eventDone":"Завершённый этап","loading":"Загрузка пути посылки…","login":"Сначала подключите аккаунт PostNL.","title":"Путь посылки","trackingValue":"Номер отслеживания: {value}","weightValue":"Вес: {value}"},"pl":{"currentStatus":"Aktualny status","dimensionsValue":"Wymiary: {value}","empty":"Obecnie nie ma drogi paczki do wyświetlenia.","eventDone":"Ukończony etap","loading":"Wczytywanie drogi paczki…","login":"Najpierw połącz konto PostNL.","title":"Droga paczki","trackingValue":"Numer przesyłki: {value}","weightValue":"Waga: {value}"},"ko":{"currentStatus":"현재 상태","dimensionsValue":"크기: {value}","empty":"현재 표시할 택배 여정이 없습니다.","eventDone":"완료된 단계","loading":"택배 여정 불러오는 중…","login":"먼저 PostNL 계정을 연결하세요.","title":"택배 여정","trackingValue":"운송장 번호: {value}","weightValue":"무게: {value}"},"ar":{"currentStatus":"الحالة الحالية","dimensionsValue":"الأبعاد: {value}","empty":"لا توجد حاليًا رحلة طرد.","eventDone":"خطوة مكتملة","loading":"جارٍ تحميل رحلة الطرد…","login":"اربط حساب PostNL أولًا.","title":"رحلة الطرد","trackingValue":"رقم التتبع: {value}","weightValue":"الوزن: {value}"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function langOf(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:'en'}
let LANG='en',LOC='en-GB',TZ='UTC',W=I18N.en;
function fill(s,v){return String(s==null?'':s).replace(/\{(\w+)\}/g,(m,k)=>v&&v[k]!=null?(LANG==='ar'?'\u2068'+v[k]+'\u2069':String(v[k])):m)}
function tr(k,v){return fill(W[k]!=null?W[k]:I18N.en[k],v)}
function fmtNum(n){try{return new Intl.NumberFormat(LOC).format(n)}catch(_){return String(n)}}
function trCount(k,n,v){const e=(W[k]!=null?W[k]:I18N.en[k])||{};let c='other';try{c=new Intl.PluralRules(LOC).select(n)}catch(_){}return fill(e[c]!=null?e[c]:e.other,Object.assign({count:fmtNum(n)},v))}
function setLang(l,tz){LANG=langOf(l);LOC=LOCALES[LANG];if(tz)TZ=tz;W=Object.assign({},I18N.en,I18N[LANG]);const h=document.documentElement;h.lang=LOC;h.dir=LANG==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=tr(e.dataset.t)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',tr(e.dataset.al))});document.querySelectorAll('[data-alt]').forEach(e=>{e.alt=tr(e.dataset.alt)})}
setLang(navigator.language);
function txt(v){return String(v??'').trim()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function zoned(r){return/(?:Z|[+-]\d{2}:?\d{2})$/i.test(r)}
function toDate(value){const raw=txt(value);if(!raw)return null;let m=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return{d:new Date(Date.UTC(+m[1],m[2]-1,+m[3],12)),tz:'UTC',dateOnly:true};m=raw.match(/^(\d{2})[-/.](\d{2})[-/.](\d{4})$/);if(m)return{d:new Date(Date.UTC(+m[3],m[2]-1,+m[1],12)),tz:'UTC',dateOnly:true};m=raw.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})(?::(\d{2}))?/);if(m&&!zoned(raw))return{d:new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))),tz:'UTC'};const d=new Date(raw);return Number.isNaN(d.getTime())?null:{d,tz:TZ}}
function fmtDate(value,opts){const x=toDate(value);if(!x)return txt(value);try{return new Intl.DateTimeFormat(LOC,Object.assign({},opts,{timeZone:x.tz})).format(x.d)}catch(_){return txt(value)}}
function fmtDateTime(value){const x=toDate(value);if(!x)return txt(value);return fmtDate(value,x.dateOnly?{dateStyle:'medium'}:{dateStyle:'medium',timeStyle:'short'})}
function fmtTime(value){const x=toDate(value);if(!x||x.dateOnly)return'';try{return new Intl.DateTimeFormat(LOC,{hour:'numeric',minute:'2-digit',timeZone:x.tz}).format(x.d)}catch(_){return''}}
function fmtMinutes(mins){mins=((Math.round(mins)%1440)+1440)%1440;try{return new Intl.DateTimeFormat(LOC,{hour:'numeric',minute:'2-digit',timeZone:'UTC'}).format(new Date(Date.UTC(2000,0,1,0,mins)))}catch(_){return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}}
function keyOf(d,tz){try{const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),g=t=>(p.find(y=>y.type===t)||{}).value||'';return g('year')+'-'+g('month')+'-'+g('day')}catch(_){return d.toISOString().slice(0,10)}}
function dayKey(value){const x=toDate(value);return x?keyOf(x.d,x.tz):''}
function todayKey(offsetDays){return keyOf(new Date(Date.now()+(offsetDays||0)*864e5),TZ)}
function fmtRelative(value){const t=Date.parse(txt(value));if(!Number.isFinite(t))return'';const s=Math.round((t-Date.now())/1000);const units=[['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60],['second',1]];for(const[u,n]of units){if(Math.abs(s)>=n||u==='second'){try{return new Intl.RelativeTimeFormat(LOC,{numeric:'auto'}).format(Math.round(s/n),u)}catch(_){return fmtDateTime(value)}}}return''}
function norm(v){return String(v||'').trim().toLocaleLowerCase()}
function onHomeyReady(Homey){const body=document.getElementById('body');let id=(Homey.getDeviceIds()||[])[0]||'';
async function get(){return Homey.api('GET','/?deviceId='+encodeURIComponent(id),{})}
function render(x){setLang(x.locale,x.timeZone||'UTC');if(!x.authenticated){body.innerHTML='<div class="state">'+esc(tr('login'))+'</div>';return}const p=x.parcel;if(!p){body.innerHTML='<div class="state"><div><img src="van-1.svg" alt=""><strong>'+esc(tr('empty'))+'</strong></div></div>';return}
const physical=[p.weight?tr('weightValue',{value:p.weight}):'',p.dimensions?tr('dimensionsValue',{value:p.dimensions}):''].filter(Boolean).join(' · ');
let events=[...(p.events||[])].sort((a,b)=>(Date.parse(b.timestamp||'')||0)-(Date.parse(a.timestamp||'')||0));const current=norm(p.status);if(events.length&&current&&norm(events[0].description)===current)events=events.slice(1);
let h='<section class="summary"><div class="sender" dir="auto">'+esc(p.sender||'PostNL')+'</div><div class="tracking">'+esc(tr('trackingValue',{value:p.tracking}))+'</div>'+(physical?'<div class="physical">'+esc(physical)+'</div>':'')+'<div class="status"><span class="current" role="img" aria-label="'+esc(tr('currentStatus'))+'">▣</span><span>'+esc(p.status||'')+'</span></div></section>';
h+='<div class="journey" role="list">'+events.map(e=>'<article class="event" role="listitem"><span class="dot" role="img" aria-label="'+esc(tr('eventDone'))+'">✓</span><div class="when">'+esc(fmtDate(e.timestamp,{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'}))+'</div><div class="msg">'+esc(e.description||'')+'</div>'+(e.location?'<div class="location">'+esc(e.location)+'</div>':'')+'</article>').join('')+'</div>';body.innerHTML=h}
async function load(show=true){if(show)body.innerHTML='<div class="state">'+esc(tr('loading'))+'</div>';try{render(await get())}catch(e){body.innerHTML='<div class="state">'+esc(e.message||e)+'</div>'}}
async function refresh(){await load(false)}
(async()=>{await load(true);Homey.ready();setInterval(refresh,60000)})()}
</script></body></html>
