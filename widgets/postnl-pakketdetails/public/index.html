<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222438;background:transparent}.card{height:100%;min-height:350px;padding:20px;border-radius:24px;background:#f2f2f4;overflow:hidden}.head{display:flex;align-items:center;gap:12px}.head img{width:44px;height:28px;object-fit:contain}.sender{font-weight:750;font-size:23px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.when{font-size:22px;margin:24px 0 4px}.truckwrap{height:125px;display:flex;align-items:flex-end;justify-content:flex-start;padding-left:48px}.truck{height:120px;max-width:55%;object-fit:contain}.track{position:relative;height:42px;margin:0 5px}.line{position:absolute;left:0;right:0;top:17px;height:4px;background:#a9abb7;border-radius:4px}.progress{position:absolute;left:0;top:17px;height:4px;background:#ed5b0b;border-radius:4px}.dots{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:space-between}.dot{width:22px;height:22px;border-radius:50%;background:#f2f2f4;border:4px solid #a9abb7}.dot.done,.dot.active{border-color:#ed5b0b}.dot.active{box-shadow:0 0 0 5px #f2f2f4}.labels{display:flex;justify-content:space-between;font-size:12px;color:#777b8c;margin-top:-2px}.status{margin-top:17px;font-weight:700;font-size:18px;color:#ed5b0b}.sub{margin-top:5px;font-size:12px;color:#777b8c}.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.empty img{width:220px;max-width:70%;margin-bottom:10px}.empty strong{font-size:20px}@media(prefers-color-scheme:dark){body{color:#f7f7fb}.card{background:#25262d}.line{background:#666979}.dot{background:#25262d;border-color:#777a89}.dot.active{box-shadow:0 0 0 5px #25262d}.labels,.sub{color:#c0c2cc}}
</style></head><body><main class="card" id="card"><div class="empty"><img src="postnl.svg"><strong>Loading…</strong></div></main>
<script>
const T={
 nl:{today:'Vandaag tussen',between:'tussen',and:'en',registered:'Aangemeld',sorting:'Sorteren',underway:'Onderweg',delivered:'Bezorgd',empty:'Geen PostNL-pakket onderweg',updated:'Laatste update'},
 en:{today:'Today between',between:'between',and:'and',registered:'Registered',sorting:'Sorting',underway:'On the way',delivered:'Delivered',empty:'No PostNL package underway',updated:'Last update'},
 de:{today:'Heute zwischen',between:'zwischen',and:'und',registered:'Angekündigt',sorting:'Sortierung',underway:'Unterwegs',delivered:'Zugestellt',empty:'Kein PostNL-Paket unterwegs',updated:'Letzte Aktualisierung'},
 fr:{today:"Aujourd’hui entre",between:'entre',and:'et',registered:'Annoncé',sorting:'Tri',underway:'En route',delivered:'Livré',empty:'Aucun colis PostNL en route',updated:'Dernière mise à jour'},
 it:{today:'Oggi tra',between:'tra',and:'e',registered:'Registrato',sorting:'Smistamento',underway:'In viaggio',delivered:'Consegnato',empty:'Nessun pacco PostNL in viaggio',updated:'Ultimo aggiornamento'},
 sv:{today:'Idag mellan',between:'mellan',and:'och',registered:'Registrerad',sorting:'Sortering',underway:'På väg',delivered:'Levererad',empty:'Inget PostNL-paket på väg',updated:'Senast uppdaterad'},
 no:{today:'I dag mellom',between:'mellom',and:'og',registered:'Registrert',sorting:'Sortering',underway:'På vei',delivered:'Levert',empty:'Ingen PostNL-pakke på vei',updated:'Sist oppdatert'},
 es:{today:'Hoy entre',between:'entre',and:'y',registered:'Registrado',sorting:'Clasificación',underway:'En camino',delivered:'Entregado',empty:'No hay ningún paquete PostNL en camino',updated:'Última actualización'},
 da:{today:'I dag mellem',between:'mellem',and:'og',registered:'Registreret',sorting:'Sortering',underway:'På vej',delivered:'Leveret',empty:'Ingen PostNL-pakke på vej',updated:'Sidst opdateret'},
 ru:{today:'Сегодня между',between:'между',and:'и',registered:'Зарегистрировано',sorting:'Сортировка',underway:'В пути',delivered:'Доставлено',empty:'Нет посылок PostNL в пути',updated:'Последнее обновление'},
 pl:{today:'Dzisiaj między',between:'między',and:'a',registered:'Zarejestrowano',sorting:'Sortowanie',underway:'W drodze',delivered:'Doręczono',empty:'Brak paczki PostNL w drodze',updated:'Ostatnia aktualizacja'},
 ko:{today:'오늘 배송 예정',between:'사이',and:'~',registered:'접수',sorting:'분류',underway:'배송 중',delivered:'배송 완료',empty:'배송 중인 PostNL 택배가 없습니다',updated:'최근 업데이트'},
 ar:{today:'اليوم بين',between:'بين',and:'و',registered:'مسجل',sorting:'الفرز',underway:'في الطريق',delivered:'تم التسليم',empty:'لا توجد طرد PostNL في الطريق',updated:'آخر تحديث'}
};
let cfg={locale:'en',timeZone:'UTC'};
let deviceId='';
const vanDataUri='postnl-van.gif';
const card=document.getElementById('card');
function txt(v){return v==null?'':String(v)}
function esc(v){return txt(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function wallTime(v){const m=txt(v).match(/T(\d{2}):(\d{2})/);return m?m[1]+':'+m[2]:''}
function wallDate(v){const m=txt(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:''}
function todayKey(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:cfg.timeZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const g=x=>parts.find(p=>p.type===x)?.value||'';return g('year')+'-'+g('month')+'-'+g('day')}
function updated(v){if(!v)return '';try{return new Intl.DateTimeFormat(cfg.locale==='nl'?'nl-NL':cfg.locale,{timeZone:cfg.timeZone,dateStyle:'short',timeStyle:'short'}).format(new Date(v))}catch(_){return ''}}
function phase(p){if(p.delivered)return 4;if(p.deliveryWindowFrom||p.deliveryWindowTo)return 3;const st=txt(p.status).toLowerCase();if(st.includes('sorte'))return 2;return 1}
function render(data){
 const L=T[cfg.locale]||T.en;
 const p=data&&data.package;
 if(!p){card.innerHTML='<div class="empty"><img src="'+vanDataUri+'"><strong>'+esc(L.empty)+'</strong></div>';return}
 const from=wallTime(p.deliveryWindowFrom),to=wallTime(p.deliveryWindowTo),day=wallDate(p.deliveryWindowFrom||p.deliveryDate);
 let when='';
 if(from||to){const w=[from,to].filter(Boolean).join(' '+L.and+' ');when=(day===todayKey()?L.today:L.between)+' '+w}else when=txt(p.status)||L.underway;
 const ph=phase(p),pct=[0,0,33,66,100][ph],labels=[L.registered,L.sorting,L.underway,L.delivered];
 card.innerHTML='<div class="head"><img src="postnl.svg"><div class="sender">'+esc(p.sender||p.title||p.barcode||'PostNL')+'</div></div>'+
  '<div class="when">'+esc(when)+'</div><div class="truckwrap"><img class="truck" src="'+vanDataUri+'"></div>'+
  '<div class="track"><div class="line"></div><div class="progress" style="width:'+pct+'%"></div><div class="dots">'+labels.map((_,i)=>'<span class="dot '+(i+1<ph?'done':i+1===ph?'active':'')+'"></span>').join('')+'</div></div>'+
  '<div class="labels">'+labels.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div><div class="status">'+esc(p.status||L.underway)+'</div>'+
  '<div class="sub">'+esc(p.barcode||'')+(data.updatedAt?' · '+esc(L.updated)+': '+esc(updated(data.updatedAt)):'')+'</div>';
}
async function fetchData(force){
 try{
  return force
   ? await Homey.api('POST','/refresh',{deviceId})
   : await Homey.api('GET','/?deviceId='+encodeURIComponent(deviceId),{});
 }catch(e){
  const L=T[cfg.locale]||T.en;
  card.innerHTML='<div class="empty"><img src="postnl.svg"><strong>'+esc(e&&e.message?e.message:L.empty)+'</strong></div>';
  return null;
 }
}
async function init(){
 const ids=typeof Homey.getDeviceIds==='function'?Homey.getDeviceIds():[];
 deviceId=Array.isArray(ids)&&ids.length?ids[0]:'';
 const data=await fetchData(false);
 if(!data)return;
 cfg.locale=data.locale||'en';cfg.timeZone=data.timeZone||'UTC';document.documentElement.dir=cfg.locale==='ar'?'rtl':'ltr';render(data);
 setInterval(async()=>{const next=await fetchData(false);if(next)render(next)},30000);
 setInterval(async()=>{await fetchData(true);const next=await fetchData(false);if(next)render(next)},60000);
}
Homey.ready();
init();
</script></body></html>
