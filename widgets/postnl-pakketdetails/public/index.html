<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--orange:#FB6200;--primary:#232323;--secondary:#747378;--muted:#97969b;--card:#f4f4f5;--header:#fafafa;--border:#dedee0;--panel:#fff;--line:#777b9c}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{display:grid;grid-template-rows:52px minmax(0,1fr);width:100%;height:100%;overflow:hidden;border-radius:17px;background:var(--card)}
header{display:flex;align-items:center;gap:10px;min-width:0;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}
.app-icon{display:block;flex:0 0 auto;width:36px;height:36px;object-fit:contain}
h1{min-width:0;margin:0;margin-inline-start:auto;color:#77767b;font-size:clamp(14px,5vw,18px);line-height:1.1;font-weight:600;text-align:end;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#content{min-width:0;min-height:0;padding:10px 12px;overflow:hidden}
.package{height:100%;min-height:0;overflow:hidden;border-radius:12px;background:var(--panel);padding:12px 12px 10px;display:flex;flex-direction:column}
html[dir=rtl] .sender{text-align:right}.package-top{display:flex;align-items:center;gap:9px;min-height:28px}.mini-logo{width:38px;height:38px;object-fit:contain;flex:0 0 auto}.sender{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.status{color:var(--secondary);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.headline{font-size:13px;font-weight:650;margin:9px 0 1px;min-height:17px;overflow-wrap:anywhere}.tracking{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:13px}
.vanwrap{flex:1;min-height:82px;display:grid;place-items:center;padding:4px 0}.van{display:block;max-width:260px;max-height:145px;object-fit:contain}.van.animated-van{width:240px;height:auto;max-width:100%;max-height:none;object-fit:contain}
.timeline{position:relative;height:58px;margin-top:0}.track{position:absolute;inset-inline:0;top:20px;height:3px;background:var(--line)}.elapsed{position:absolute;inset-inline-start:0;top:20px;height:3px;background:var(--orange);width:0}.dot{position:absolute;top:12px;width:18px;height:18px;margin-inline-start:-9px;border:4px solid var(--orange);border-radius:50%;background:var(--panel);inset-inline-start:0}.tick{position:absolute;top:15px;width:1px;height:13px;background:#9d9fac}.actual-start,.actual-end{position:absolute;top:11px;width:3px;height:21px;background:#cfcfd5;border-radius:2px}.times{position:absolute;inset-inline:0;top:33px;display:grid;grid-template-columns:1fr 1fr 1fr;color:var(--muted);font-size:10px}.times span:nth-child(1){text-align:start}.times span:nth-child(2){text-align:center}.times span:nth-child(3){text-align:end}.hidden{display:none!important}
.state{display:grid;place-items:center;height:100%;padding:16px;text-align:center;color:var(--primary);overflow-wrap:anywhere}.state-inner{display:grid;place-items:center;gap:12px}.state .van{width:min(88%,290px);max-height:170px}.state p{margin:0;font-size:17px;font-weight:700}
@media(prefers-color-scheme:dark){:root{--primary:#f4f4f5;--secondary:#c4c3c7;--muted:#aaa9ad;--card:#202022;--header:#29292b;--border:#424244;--panel:#343436;--line:#71748e}h1{color:#aaa9ad}.dot{background:var(--panel)}.state{color:#aaa9ad}}
</style>
</head>
<body>
<main class="card">
  <header><img class="app-icon" src="icon.svg" alt="PostNL"><h1 id="title" data-t="title"></h1></header>
  <section id="content" aria-live="polite"><div class="state" data-t="loading"></div></section>
</main>
<script>
const I18N={"en":{"dateBetween":"{date} between {from} and {to}","empty":"There is currently no parcel on the way","loading":"Loading parcel…","packageAlt":"Parcel","progress":"Delivery progress","title":"My Delivery","todayBetween":"Today between {from} and {to}","tomorrowBetween":"Tomorrow between {from} and {to}","trackingValue":"Tracking number: {value}"},"nl":{"dateBetween":"{date} tussen {from} en {to}","empty":"Er is momenteel geen pakket onderweg","loading":"Pakket ophalen…","packageAlt":"Pakket","progress":"Voortgang van de bezorging","title":"Mijn Bezorging","todayBetween":"Vandaag tussen {from} en {to}","tomorrowBetween":"Morgen tussen {from} en {to}","trackingValue":"Trackingnummer: {value}"},"de":{"dateBetween":"{date} zwischen {from} und {to}","empty":"Zurzeit ist kein Paket unterwegs","loading":"Paket wird geladen…","packageAlt":"Paket","progress":"Zustellfortschritt","title":"Meine Zustellung","todayBetween":"Heute zwischen {from} und {to}","tomorrowBetween":"Morgen zwischen {from} und {to}","trackingValue":"Sendungsnummer: {value}"},"fr":{"dateBetween":"{date} entre {from} et {to}","empty":"Aucun colis n’est actuellement en route","loading":"Chargement du colis…","packageAlt":"Colis","progress":"Progression de la livraison","title":"Ma livraison","todayBetween":"Aujourd’hui entre {from} et {to}","tomorrowBetween":"Demain entre {from} et {to}","trackingValue":"Numéro de suivi : {value}"},"it":{"dateBetween":"{date} tra le {from} e le {to}","empty":"Al momento non c’è nessun pacco in arrivo","loading":"Caricamento del pacco…","packageAlt":"Pacco","progress":"Avanzamento della consegna","title":"La mia consegna","todayBetween":"Oggi tra le {from} e le {to}","tomorrowBetween":"Domani tra le {from} e le {to}","trackingValue":"Numero di tracciamento: {value}"},"sv":{"dateBetween":"{date} mellan {from} och {to}","empty":"Det finns för närvarande inget paket på väg","loading":"Hämtar paket…","packageAlt":"Paket","progress":"Leveransförlopp","title":"Min leverans","todayBetween":"I dag mellan {from} och {to}","tomorrowBetween":"I morgon mellan {from} och {to}","trackingValue":"Spårningsnummer: {value}"},"no":{"dateBetween":"{date} mellom {from} og {to}","empty":"Det er ingen pakke på vei akkurat nå","loading":"Henter pakke…","packageAlt":"Pakke","progress":"Leveringsfremdrift","title":"Min levering","todayBetween":"I dag mellom {from} og {to}","tomorrowBetween":"I morgen mellom {from} og {to}","trackingValue":"Sporingsnummer: {value}"},"es":{"dateBetween":"{date} entre las {from} y las {to}","empty":"Actualmente no hay ningún paquete en camino","loading":"Cargando paquete…","packageAlt":"Paquete","progress":"Progreso de la entrega","title":"Mi entrega","todayBetween":"Hoy entre las {from} y las {to}","tomorrowBetween":"Mañana entre las {from} y las {to}","trackingValue":"Número de seguimiento: {value}"},"da":{"dateBetween":"{date} mellem {from} og {to}","empty":"Der er i øjeblikket ingen pakke på vej","loading":"Henter pakke…","packageAlt":"Pakke","progress":"Leveringsforløb","title":"Min levering","todayBetween":"I dag mellem {from} og {to}","tomorrowBetween":"I morgen mellem {from} og {to}","trackingValue":"Sporingsnummer: {value}"},"ru":{"dateBetween":"{date} с {from} до {to}","empty":"Сейчас нет посылок в пути","loading":"Загрузка посылки…","packageAlt":"Посылка","progress":"Ход доставки","title":"Моя доставка","todayBetween":"Сегодня с {from} до {to}","tomorrowBetween":"Завтра с {from} до {to}","trackingValue":"Номер отслеживания: {value}"},"pl":{"dateBetween":"{date} między {from} a {to}","empty":"Obecnie żadna paczka nie jest w drodze","loading":"Wczytywanie paczki…","packageAlt":"Paczka","progress":"Postęp dostawy","title":"Moja dostawa","todayBetween":"Dzisiaj między {from} a {to}","tomorrowBetween":"Jutro między {from} a {to}","trackingValue":"Numer przesyłki: {value}"},"ko":{"dateBetween":"{date} {from}~{to}","empty":"현재 배송 중인 택배가 없습니다","loading":"택배 불러오는 중…","packageAlt":"택배","progress":"배송 진행 상황","title":"내 배송","todayBetween":"오늘 {from}~{to}","tomorrowBetween":"내일 {from}~{to}","trackingValue":"운송장 번호: {value}"},"ar":{"dateBetween":"{date} بين {from} و{to}","empty":"لا يوجد حاليًا أي طرد في الطريق","loading":"جارٍ تحميل الطرد…","packageAlt":"طرد","progress":"تقدّم التسليم","title":"توصيلي","todayBetween":"اليوم بين {from} و{to}","tomorrowBetween":"غدًا بين {from} و{to}","trackingValue":"رقم التتبع: {value}"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function langOf(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:'en'}
let LANG='en',LOC='en-GB',TZ='UTC',W=I18N.en;
function fill(s,v){return String(s==null?'':s).replace(/\{(\w+)\}/g,(m,k)=>v&&v[k]!=null?(LANG==='ar'?'\u2068'+v[k]+'\u2069':String(v[k])):m)}
function tr(k,v){return fill(W[k]!=null?W[k]:I18N.en[k],v)}
function fmtNum(n){try{return new Intl.NumberFormat(LOC).format(n)}catch(_){return String(n)}}
function trCount(k,n,v){const e=(W[k]!=null?W[k]:I18N.en[k])||{};let c='other';try{c=new Intl.PluralRules(LOC).select(n)}catch(_){}return fill(e[c]!=null?e[c]:e.other,Object.assign({count:fmtNum(n)},v))}
function setLang(l,tz){LANG=langOf(l);LOC=LOCALES[LANG];if(tz)TZ=tz;W=Object.assign({},I18N.en,I18N[LANG]);const h=document.documentElement;h.lang=LOC;h.dir=LANG==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=tr(e.dataset.t)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',tr(e.dataset.al))});document.querySelectorAll('[data-alt]').forEach(e=>{e.alt=tr(e.dataset.alt)})}
setLang(navigator.language);
function txt(v){return String(v??'').trim()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function zoned(r){return/(?:Z|[+-]\d{2}:?\d{2})$/i.test(r)}
function toDate(value){const raw=txt(value);if(!raw)return null;let m=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return{d:new Date(Date.UTC(+m[1],m[2]-1,+m[3],12)),tz:'UTC',dateOnly:true};m=raw.match(/^(\d{2})[-/.](\d{2})[-/.](\d{4})$/);if(m)return{d:new Date(Date.UTC(+m[3],m[2]-1,+m[1],12)),tz:'UTC',dateOnly:true};m=raw.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})(?::(\d{2}))?/);if(m&&!zoned(raw))return{d:new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0))),tz:'UTC'};const d=new Date(raw);return Number.isNaN(d.getTime())?null:{d,tz:TZ}}
function fmtDate(value,opts){const x=toDate(value);if(!x)return txt(value);try{return new Intl.DateTimeFormat(LOC,Object.assign({},opts,{timeZone:x.tz})).format(x.d)}catch(_){return txt(value)}}
function fmtDateTime(value){const x=toDate(value);if(!x)return txt(value);return fmtDate(value,x.dateOnly?{dateStyle:'medium'}:{dateStyle:'medium',timeStyle:'short'})}
function fmtTime(value){const x=toDate(value);if(!x||x.dateOnly)return'';try{return new Intl.DateTimeFormat(LOC,{hour:'numeric',minute:'2-digit',timeZone:x.tz}).format(x.d)}catch(_){return''}}
function fmtMinutes(mins){mins=((Math.round(mins)%1440)+1440)%1440;try{return new Intl.DateTimeFormat(LOC,{hour:'numeric',minute:'2-digit',timeZone:'UTC'}).format(new Date(Date.UTC(2000,0,1,0,mins)))}catch(_){return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}}
function keyOf(d,tz){try{const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),g=t=>(p.find(y=>y.type===t)||{}).value||'';return g('year')+'-'+g('month')+'-'+g('day')}catch(_){return d.toISOString().slice(0,10)}}
function dayKey(value){const x=toDate(value);return x?keyOf(x.d,x.tz):''}
function todayKey(offsetDays){return keyOf(new Date(Date.now()+(offsetDays||0)*864e5),TZ)}
function fmtRelative(value){const t=Date.parse(txt(value));if(!Number.isFinite(t))return'';const s=Math.round((t-Date.now())/1000);const units=[['year',31536000],['month',2592000],['week',604800],['day',86400],['hour',3600],['minute',60],['second',1]];for(const[u,n]of units){if(Math.abs(s)>=n||u==='second'){try{return new Intl.RelativeTimeFormat(LOC,{numeric:'auto'}).format(Math.round(s/n),u)}catch(_){return fmtDateTime(value)}}}return''}
function parts(value){const x=toDate(value);if(!x||x.dateOnly)return null;try{const p=new Intl.DateTimeFormat('en-CA',{timeZone:x.tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(x.d),g=t=>(p.find(y=>y.type===t)||{}).value||'';return{date:`${g('year')}-${g('month')}-${g('day')}`,mins:+g('hour')*60 + +g('minute')}}catch(_){return null}}
function nowParts(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),g=t=>(p.find(x=>x.type===t)||{}).value||'';const hh=+g('hour'),mm=+g('minute'),ss=+g('second');return{date:`${g('year')}-${g('month')}-${g('day')}`,mins:hh*60+mm,secs:hh*3600+mm*60+ss}}
function onHomeyReady(Homey){
 const host=document.getElementById('content');let data=null,timer=null;
 function empty(){host.innerHTML=`<div class="state"><div class="state-inner"><img class="van" src="van-1.svg" alt=""><p>${esc(tr('empty'))}</p></div></div>`}
 function render(){
  if(!data?.authenticated||!data?.parcel){empty();return}
  const p=data.parcel,a=parts(p.deliveryWindowFrom),b=parts(p.deliveryWindowTo),n=nowParts(),date=a?.date||dayKey(p.deliveryDate)||'';
  let headline=txt(p.status);
  if(a&&b){const vars={from:fmtMinutes(a.mins),to:fmtMinutes(b.mins)};headline=date===n.date?tr('todayBetween',vars):date===todayKey(1)?tr('tomorrowBetween',vars):tr('dateBetween',Object.assign(vars,{date:fmtDate(date,{weekday:'long',day:'numeric',month:'long'})}))}
  const sender=txt(p.sender||p.title||p.sourceDisplayName||'PostNL');
  const tracking=txt(p.tracking);
  const status=txt(p.status);
  host.innerHTML=`<section class="package"><div class="package-top"><img class="mini-logo" src="package.svg" alt="${esc(tr('packageAlt'))}"><div class="sender" dir="auto"></div><div class="status"></div></div><div class="headline"></div><div class="tracking"></div><div class="vanwrap"><img class="van animated-van" src="postnl-van.gif" alt="PostNL"></div><div class="timeline ${a&&b?'':'hidden'}" role="progressbar" aria-label="${esc(tr('progress'))}" aria-valuemin="0" aria-valuemax="100"><div class="track"></div><div class="elapsed"></div><div class="dot"></div><i class="actual-start"></i><i class="actual-end"></i><div class="times"><span></span><span></span><span></span></div></div></section>`;
  host.querySelector('.sender').textContent=sender;
  host.querySelector('.status').textContent=status;host.querySelector('.status').title=status;
  host.querySelector('.headline').textContent=headline;
  host.querySelector('.tracking').textContent=tracking?tr('trackingValue',{value:tracking}):'';
  updateProgress();clearInterval(timer);timer=setInterval(updateProgress,1000)
 }
 function updateProgress(){if(!data?.parcel)return;const a=parts(data.parcel.deliveryWindowFrom),b=parts(data.parcel.deliveryWindowTo),n=nowParts();if(!a||!b)return;const displayStart=a.mins-60,displayEnd=b.mins+60;const startSec=displayStart*60,endSec=displayEnd*60;let pct=0;if(n.date>a.date)pct=100;else if(n.date<a.date)pct=0;else{const span=Math.max(1,endSec-startSec);pct=Math.max(0,Math.min(100,(n.secs-startSec)/span*100))}const q=s=>host.querySelector(s);const elapsed=q('.elapsed'),dot=q('.dot'),startTick=q('.actual-start'),endTick=q('.actual-end'),bar=q('.timeline');const t1=q('.times span:nth-child(1)'),t2=q('.times span:nth-child(2)'),t3=q('.times span:nth-child(3)');if(elapsed)elapsed.style.width=pct+'%';if(dot)dot.style.insetInlineStart=pct+'%';if(bar)bar.setAttribute('aria-valuenow',String(Math.round(pct)));const startPct=((a.mins-displayStart)/(displayEnd-displayStart))*100;const endPct=((b.mins-displayStart)/(displayEnd-displayStart))*100;if(startTick)startTick.style.insetInlineStart=startPct+'%';if(endTick)endTick.style.insetInlineStart=endPct+'%';if(t1)t1.textContent=fmtMinutes(displayStart);if(t2)t2.textContent=fmtMinutes((displayStart+displayEnd)/2);if(t3)t3.textContent=fmtMinutes(displayEnd)}
 (async()=>{try{const id=(Homey.getDeviceIds()||[])[0]||'',x=await Homey.api('GET','/?deviceId='+encodeURIComponent(id),{});data=x;setLang(x.locale,x.timeZone||'UTC');render()}catch(e){host.innerHTML='<div class="state">'+esc(e.message||e)+'</div>'}})();Homey.ready()
}
</script>
</body>
</html>
