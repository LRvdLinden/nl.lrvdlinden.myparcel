name: Build MyParcel package
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-myparcel-package.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr MyParcel-for-Homey-v0.2.7-beta.zip .             -x '.git/*' '.github/*' '.sync/*' 'node_modules/*' '.homeybuild/*' 'MyParcel-for-Homey-v0.2.7-beta.zip'
          unzip -t MyParcel-for-Homey-v0.2.7-beta.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MyParcel-for-Homey-v0.2.7-beta
          path: MyParcel-for-Homey-v0.2.7-beta.zip
          compression-level: 0
