name: Package DHL Express Helper 0.1.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-dhl-express-helper-012.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate branded Chrome icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          mkdir -p tools/dhl-express-homey-login-helper/icons
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          out=Path('tools/dhl-express-homey-login-helper/icons')
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          for size in (16,32,48,128):
              im=Image.new('RGBA',(size,size),(255,204,0,255))
              d=ImageDraw.Draw(im)
              red=(212,5,17,255)
              f=ImageFont.truetype(font,max(7,int(size*0.30)))
              text='DHL'
              box=d.textbbox((0,0),text,font=f)
              tw,th=box[2]-box[0],box[3]-box[1]
              x=(size-tw)//2
              y=max(0,int(size*0.35-th/2))
              d.text((x,y),text,font=f,fill=red)
              line=max(1,int(size*0.025))
              yy=max(1,int(size*0.68))
              d.rectangle([int(size*0.10),yy,int(size*0.90),yy+line],fill=red)
              im.save(out/f'icon{size}.png',optimize=True)
          PY
          test -f tools/dhl-express-homey-login-helper/icons/icon16.png
          test -f tools/dhl-express-homey-login-helper/icons/icon128.png
      - name: Validate helper
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/dhl-express-homey-login-helper/background.js
          node --check tools/dhl-express-homey-login-helper/bridge.js
          node --check tools/dhl-express-homey-login-helper/content.js
          node --check tools/dhl-express-homey-login-helper/popup.js
          node --check tools/dhl-express-homey-login-helper/result.js
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('tools/dhl-express-homey-login-helper/manifest.json','utf8'));
          if(m.version!=='0.1.2') throw new Error('wrong helper version');
          for(const s of ['16','32','48','128']) if(!m.icons?.[s]) throw new Error('missing icon '+s);
          const popup=fs.readFileSync('tools/dhl-express-homey-login-helper/popup.html','utf8');
          const result=fs.readFileSync('tools/dhl-express-homey-login-helper/result.html','utf8');
          if(!popup.includes('#ffcc00')||!popup.includes('#d40511')) throw new Error('popup not DHL branded');
          if(!result.includes('#ffcc00')||!result.includes('#d40511')) throw new Error('result not DHL branded');
          NODE
      - name: Build helper ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/DHL-Express-Homey-Login-Helper-v0.1.1.zip
          rm -f tools/DHL-Express-Homey-Login-Helper-v0.1.2.zip
          (
            cd tools
            zip -qr DHL-Express-Homey-Login-Helper-v0.1.2.zip dhl-express-homey-login-helper
          )
          unzip -t tools/DHL-Express-Homey-Login-Helper-v0.1.2.zip >/dev/null
      - name: Validate MyParcel
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx --no-install homey app validate --level debug
      - name: Rebuild MyParcel 0.3.1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/myparcel031
          mkdir -p /tmp/myparcel031/MyParcel-for-Homey-v0.3.1
          rsync -a ./ /tmp/myparcel031/MyParcel-for-Homey-v0.3.1/             --exclude '.git/'             --exclude '.github/'             --exclude 'node_modules/'             --exclude '.homeybuild/'             --exclude '__MACOSX/'             --exclude 'MyParcel-for-Homey-v0.3.0.zip'             --exclude 'MyParcel-for-Homey-v0.3.1.zip'
          rm -f MyParcel-for-Homey-v0.3.1.zip
          (
            cd /tmp/myparcel031
            zip -qr "$GITHUB_WORKSPACE/MyParcel-for-Homey-v0.3.1.zip" MyParcel-for-Homey-v0.3.1
          )
          unzip -t MyParcel-for-Homey-v0.3.1.zip >/dev/null
      - name: Commit branded helper and rebuilt app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LRvdLinden"
          git config user.email "77990847+LRvdLinden@users.noreply.github.com"
          git rm -f tools/DHL-Express-Homey-Login-Helper-v0.1.1.zip 2>/dev/null || true
          git add tools/dhl-express-homey-login-helper/icons
          git add -f tools/DHL-Express-Homey-Login-Helper-v0.1.2.zip
          git add -f MyParcel-for-Homey-v0.3.1.zip
          git rm .github/workflows/package-dhl-express-helper-012.yml
          git commit -m "Brand DHL Express Homey Login Helper v0.1.2"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: DHL-Express-Homey-Login-Helper-v0.1.2
          path: tools/DHL-Express-Homey-Login-Helper-v0.1.2.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: MyParcel-for-Homey-v0.3.1
          path: MyParcel-for-Homey-v0.3.1.zip
          compression-level: 0
