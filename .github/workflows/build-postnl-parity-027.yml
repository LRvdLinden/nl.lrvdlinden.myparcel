name: Build MyParcel 0.2.7 PostNL parity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-postnl-parity-027.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app and PostNL image architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lib/delivery-image.js)" = "636f8703ead3215dc507c82aa166fbb542b576fd"
          test "$(git hash-object assets/postnl-van-static.b64)" = "57c3bdf462a4b5337e53c58473a82640bdfb5a3b"
          test "$(git hash-object assets/font-bold30.b64)" = "4511ebefb5db5fe90671ac6d9fc3ef0e670ca220"
          test "$(git hash-object assets/font-bold36.b64)" = "d1a117304ba219d2382bb195c49d9e154423f4c3"
          test "$(git hash-object assets/font-regular22.b64)" = "24b172efc1ec32c64d1482e762ec216865e3e4bf"
          test "$(git hash-object assets/font-atlas.json)" = "2a812db883056a0bea71a1f92cb10f2c9a394153"
          test "$(git hash-object widgets/postnl-pakketdetails/public/index.html)" = "57f86a79da4c405c057c9fb903e58b9815773075"
          test "$(git hash-object widgets/postnl-pakketdetails/public/van-1.svg)" = "2d3086607d1beaae3e0769b7af39cdd9649061c6"
          test "$(git hash-object widgets/postnl-pakketdetails/public/package.svg)" = "e90ac0123d17cbec84bdc4fbdfbc587b4efa637e"
          grep -q "setCameraImage('latest_package'" drivers/postnl/device.js
          grep -q "setCameraImage('latest_mail_item'" drivers/postnl/device.js
          grep -q "tokens.package_image = packageImage" drivers/postnl/device.js
          grep -q "tokens.image = image" drivers/postnl/device.js
          grep -q "loadDeliveryVan()" drivers/postnl/device.js
          grep -q '"name": "package_image"' drivers/postnl/driver.flow.compose.json
          grep -q '"name": "image"' drivers/postnl/driver.flow.compose.json
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.homeybuild/*' -print0 | xargs -0 -n1 node --check
          node -e "for (const f of ['app.json','package.json','.homeychangelog.json','drivers/postnl/driver.flow.compose.json','widgets/postnl-pakketdetails/widget.compose.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
          node - <<'NODE'
          const fs=require('fs');
          const {renderNoPackageCard,renderDeliveryCard,loadDeliveryVan}=require('./lib/delivery-image');
          const van=loadDeliveryVan();
          const a=renderNoPackageCard({language:'nl',vanPng:van});
          const b=renderDeliveryCard({sender:'PostNL',status:'Onderweg',headline:'Vandaag tussen 18:00 en 20:00',tracking:'3S123',progress:.5,windowStartPct:.25,windowEndPct:.75,timelineStart:'17:00',timelineMid:'19:00',timelineEnd:'21:00',vanPng:van});
          for (const [name,buf] of [['empty',a],['active',b]]) {
            if (!Buffer.isBuffer(buf) || buf.length < 1000 || buf.subarray(1,4).toString() !== 'PNG') throw new Error(name+' image invalid');
          }
          NODE
      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr MyParcel-for-Homey-v0.2.7-beta.zip .             -x '.git/*' '.github/*' '.sync/*' 'node_modules/*' '.homeybuild/*' 'MyParcel-for-Homey-v0.2.7-beta.zip'
          unzip -t MyParcel-for-Homey-v0.2.7-beta.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MyParcel-for-Homey-v0.2.7-beta-postnl-fixed
          path: MyParcel-for-Homey-v0.2.7-beta.zip
          compression-level: 0
