name: Validate PostNL enrichment
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-postnl-enrichment.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --check lib/postnl-status.js
          node --check lib/postnl-api.js
          node --check drivers/postnl/device.js
          node --check drivers/postnl/driver.js
          node - <<'NODE'
          const fs=require('fs');
          const st=require('./lib/postnl-status');
          const obs=[
            {observationDate:'2026-10-08T08:00:00Z',observationCode:'A03',description:'Aangemeld'},
            {observationDate:'2026-10-08T09:00:00Z',observationCode:'J01',description:'Gesorteerd'},
            {observationDate:'2026-10-08T10:00:00Z',observationCode:'J05',description:'Bezorger is onderweg'},
            {observationDate:'2026-10-08T10:05:00Z',observationCode:'A19',description:'ETA gewijzigd'}
          ];
          if(st.deriveCanonicalStatus({observations:obs})!=='out_for_delivery') throw new Error('canonical status mapping failed');
          const dims=st.convertDimensions({weight:2400,depth:400,width:300,height:200});
          if(dims.weightKg!==2.4||dims.text!=='40 × 30 × 20 cm') throw new Error('dimension conversion failed');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(app.version!=='0.3.1') throw new Error('wrong app version');
          const req=['postnl_package_weight','postnl_package_dimensions','postnl_package_history','postnl_package_observation_code','postnl_package_canonical_status','postnl_package_pickup','postnl_package_pickup_type'];
          const driver=app.drivers.find(d=>d.id==='postnl');
          for(const id of req){if(!app.capabilities[id]||!driver.capabilities.includes(id)) throw new Error('missing '+id);}
          NODE
          npx --no-install homey app validate --level debug
      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/myparcel-postnl
          mkdir -p /tmp/myparcel-postnl/MyParcel-for-Homey-v0.3.1
          rsync -a ./ /tmp/myparcel-postnl/MyParcel-for-Homey-v0.3.1/ --exclude '.git/' --exclude '.github/' --exclude 'node_modules/' --exclude '.homeybuild/' --exclude '__MACOSX/' --exclude 'MyParcel-for-Homey-v0.3.0.zip' --exclude 'MyParcel-for-Homey-v0.3.1.zip'
          rm -f MyParcel-for-Homey-v0.3.1.zip
          (cd /tmp/myparcel-postnl && zip -qr "$GITHUB_WORKSPACE/MyParcel-for-Homey-v0.3.1.zip" MyParcel-for-Homey-v0.3.1)
          unzip -t MyParcel-for-Homey-v0.3.1.zip >/dev/null
          sha256sum MyParcel-for-Homey-v0.3.1.zip
      - name: Commit ZIP and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LRvdLinden'
          git config user.email '77990847+LRvdLinden@users.noreply.github.com'
          git add -f MyParcel-for-Homey-v0.3.1.zip
          git rm .github/workflows/validate-postnl-enrichment.yml
          git commit -m 'Build MyParcel 0.3.1 with enriched PostNL data'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: MyParcel-for-Homey-v0.3.1-postnl-enriched
          path: MyParcel-for-Homey-v0.3.1.zip
          compression-level: 0
