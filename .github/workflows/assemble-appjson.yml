name: Assemble synced app manifest
on:
  push:
    branches: [main]
    paths:
      - '.sync/appjson.*'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble app.json
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04; do test -f ".sync/appjson.$n"; done
          cat .sync/appjson.00 .sync/appjson.01 .sync/appjson.02 .sync/appjson.03 .sync/appjson.04 > app.json
          node -e "JSON.parse(require('fs').readFileSync('app.json','utf8'))"
          rm -f .sync/appjson.*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json .sync
          git commit -m "Sync complete MyParcel v0.1.1 app manifest"
          git push
