name: Build MyParcel 0.2.7 fixed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-myparcel-027-fix.yml'
      - 'app.json'
      - 'app.js'
      - 'drivers/ampere/**'
      - 'widgets/myparcel-pakketten/**'
      - 'widgets/myparcel-bezorging/**'
      - 'widgets/postnl-pakketdetails/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and JSON
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.homeybuild/*' -print0 | xargs -0 -n1 node --check
          node -e "for (const f of ['app.json','package.json','.homeychangelog.json','widgets/myparcel-pakketten/widget.compose.json','widgets/myparcel-bezorging/widget.compose.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
          grep -q 'ampere_parcel_count' app.json
          grep -q 'postnl-van.gif' widgets/postnl-pakketdetails/public/index.html
          grep -q 'MyParcel' widgets/myparcel-bezorging/public/van.svg
      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr MyParcel-for-Homey-v0.2.7-beta.zip .             -x '.git/*' '.github/*' '.sync/*' 'node_modules/*' '.homeybuild/*' 'MyParcel-for-Homey-v0.2.7-beta.zip'
          unzip -t MyParcel-for-Homey-v0.2.7-beta.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MyParcel-for-Homey-v0.2.7-beta-fixed
          path: MyParcel-for-Homey-v0.2.7-beta.zip
          compression-level: 0
