name: Build MyParcel 0.3.0 final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-myparcel-030-final.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.homeybuild/*' -print0 | xargs -0 -n1 node --check
          node -e "for (const f of ['app.json','package.json','package-lock.json','.homeychangelog.json','drivers/ampere/driver.compose.json','drivers/ampere/driver.flow.compose.json','widgets/poststukken/widget.compose.json']) JSON.parse(require('fs').readFileSync(f,'utf8'));"
          node - <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(app.version!=='0.3.0') throw new Error('Expected 0.3.0');
          const postnl=fs.readFileSync('drivers/postnl/device.js','utf8');
          if(/archiveLetters\s*\(/.test(postnl)) throw new Error('PostNL device still archives mail');
          if(!postnl.includes("letters: (this.snapshot.liveLetters || [])")) throw new Error('Widget data is not live mail');
          if(!postnl.includes("letters: [], liveLetters: []")) throw new Error('Persisted mail is not stripped');
          const widgetApi=fs.readFileSync('widgets/poststukken/api.js','utf8');
          if(!widgetApi.includes("reason: 'widget'")) throw new Error('Widget does not live-sync');
          const widgetHtml=fs.readFileSync('widgets/poststukken/public/index.html','utf8');
          if(!widgetHtml.includes('60000')) throw new Error('Widget live poll missing');
          const amp=app.drivers.find(d=>d.id==='ampere');
          if(!amp) throw new Error('Ampere driver missing');
          for(const id of ['ampere_tracking','ampere_sender','ampere_delivery_date','ampere_delivery_window','ampere_delivered','ampere_details_url']){
            if(!amp.capabilities.includes(id)) throw new Error('Ampere capability missing '+id);
          }
          NODE
          test "$(wc -c < widgets/postnl-pakketdetails/public/postnl-van.gif | tr -d ' ')" = "660705"
          echo "efcca70ca181a6b98a0077dcaa0455d4255bec7f97b5ea341b22cd1d51ac1f87  widgets/postnl-pakketdetails/public/postnl-van.gif" | sha256sum -c -
      - name: Homey validation
        run: npx --no-install homey app validate --level debug
      - name: Runtime startup smoke test
        shell: bash
        run: |
          node - <<'NODE'
          const Module=require('module');
          const originalLoad=Module._load;
          let fakeHomey=null;
          class Base {
            constructor(){this._store=new Map();this._caps=new Set();this._settings={};this.homey=fakeHomey;}
            log(){}
            error(){}
            getName(){return 'Test';}
            getId(){return 'test';}
            getStoreValue(k){return this._store.get(k);}
            async setStoreValue(k,v){this._store.set(k,v);}
            async unsetStoreValue(k){this._store.delete(k);}
            hasCapability(k){return this._caps.has(k);}
            async addCapability(k){this._caps.add(k);}
            async setCapabilityValue(){}
            getCapabilityValue(){return null;}
            getSetting(k){return this._settings[k]||'';}
            getSettings(){return this._settings;}
            async setSettings(v){Object.assign(this._settings,v);}
            getAvailable(){return true;}
            async setAvailable(){}
            async setUnavailable(){}
            async setCameraImage(){}
          }
          class App extends Base{}
          class Driver extends Base{}
          class Device extends Base{}
          const card=()=>({registerRunListener(){return this;},trigger:async()=>true});
          const image=()=>({setStream(){}});
          fakeHomey={
            flow:{
              getDeviceTriggerCard:()=>card(),
              getConditionCard:()=>card(),
              getActionCard:()=>card(),
              createToken:async()=>({setValue:async()=>{}}),
            },
            drivers:{getDriver:()=>({getDevices:()=>[]})},
            notifications:{createNotification:async()=>{}},
            images:{createImage:async()=>image()},
            i18n:{getLanguage:()=> 'nl'},
            clock:{getTimezone:()=> 'Europe/Amsterdam'},
            setInterval:()=>({}),
            clearInterval:()=>{},
            setTimeout:()=>({}),
            clearTimeout:()=>{},
            __:(key)=>({
              'common_status.connected':'Verbonden',
              'common_status.disconnected':'Niet verbonden',
              'errors.not_authenticated':'Niet ingelogd',
            }[key]||key),
            app:{getConnectionLabel:(v)=>v?'Verbonden':'Niet verbonden'},
          };
          Module._load=function(request,parent,isMain){
            if(request==='homey') return {App,Driver,Device,manifest:require('./app.json')};
            return originalLoad.call(this,request,parent,isMain);
          };
          (async()=>{
            const Main=require('./app.js');
            const main=new Main(); main.homey=fakeHomey; await main.onInit();

            const AmpDriver=require('./drivers/ampere/driver.js');
            const ad=new AmpDriver(); ad.homey=fakeHomey; await ad.onInit();

            const AmpDevice=require('./drivers/ampere/device.js');
            const av=new AmpDevice(); av.homey=fakeHomey; await av.onInit();

            const PostDevice=require('./drivers/postnl/device.js');
            const pd=new PostDevice(); pd.homey=fakeHomey; await pd.onInit();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr MyParcel-for-Homey-v0.3.0.zip . \
            -x '.git/*' '.github/*' '.sync/*' 'node_modules/*' '.homeybuild/*' '*.zip'
          unzip -t MyParcel-for-Homey-v0.3.0.zip >/dev/null
          sha256sum MyParcel-for-Homey-v0.3.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MyParcel-for-Homey-v0.3.0-final
          path: MyParcel-for-Homey-v0.3.0.zip
          compression-level: 0
