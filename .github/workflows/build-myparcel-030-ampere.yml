name: Build MyParcel 0.3.0 Ampere
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-myparcel-030-ampere.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate MyParcel 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/bol-session.js
          node --check drivers/ampere/device.js
          node --check drivers/ampere/driver.js
          node - <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          const compose=JSON.parse(fs.readFileSync('drivers/ampere/driver.compose.json','utf8'));
          const flows=JSON.parse(fs.readFileSync('drivers/ampere/driver.flow.compose.json','utf8'));
          if(app.version!=='0.3.0') throw new Error('wrong version');
          const requiredCaps=[
            'ampere_parcel_count','ampere_total_count','ampere_status','ampere_tracking','ampere_sender',
            'ampere_delivery_date','ampere_delivery_window','ampere_window_start','ampere_window_end',
            'ampere_delivered','ampere_details_url','myparcel_connection_status','ampere_last_update'
          ];
          const driver=app.drivers.find(d=>d.id==='ampere');
          for(const id of requiredCaps){
            if(!driver.capabilities.includes(id)) throw new Error('driver missing '+id);
            if(id!=='myparcel_connection_status' && !app.capabilities[id]) throw new Error('manifest missing '+id);
          }
          for(const id of ['ampere_new_package','ampere_status_changed','ampere_delivery_updated','ampere_delivery_window_changed','ampere_delivered']){
            if(!app.flow.triggers.some(x=>x.id===id)) throw new Error('trigger missing '+id);
          }
          for(const id of ['ampere_packages_underway','ampere_delivery_window_known','ampere_is_delivered','ampere_is_connected']){
            if(!app.flow.conditions.some(x=>x.id===id)) throw new Error('condition missing '+id);
          }
          if(!app.flow.actions.some(x=>x.id==='ampere_refresh')) throw new Error('action missing');
          if(!flows.triggers.length || !flows.conditions.length || !flows.actions.length) throw new Error('compose flow missing');
          if(JSON.stringify(compose.capabilities)!==JSON.stringify(requiredCaps)) throw new Error('compose capabilities mismatch');
          const langs=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
          for(const cap of requiredCaps.filter(x=>x!=='myparcel_connection_status')){
            for(const lang of langs) if(!app.capabilities[cap].title?.[lang]) throw new Error(cap+' missing '+lang);
          }
          NODE
          node - <<'NODE'
          const { detectParcelCarrier }=require('./lib/bol-session');
          if(detectParcelCarrier('', '', '3STUNM287180165')!=='postnl') throw new Error('3S PostNL detection failed');
          if(detectParcelCarrier('{"carrierName":"PostNL"}','','ABC123')!=='postnl') throw new Error('PostNL carrier detection failed');
          if(detectParcelCarrier('{"carrierName":"Ampère"}','','AMP123')!=='ampere') throw new Error('Ampere carrier detection failed');
          NODE
          test "$(wc -c < widgets/postnl-pakketdetails/public/postnl-van.gif | tr -d ' ')" = "660705"
          echo "efcca70ca181a6b98a0077dcaa0455d4255bec7f97b5ea341b22cd1d51ac1f87  widgets/postnl-pakketdetails/public/postnl-van.gif" | sha256sum -c -
          node -e "JSON.parse(require('fs').readFileSync('.homeychangelog.json','utf8'))"
      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip -qr MyParcel-for-Homey-v0.3.0.zip . \
            -x '.git/*' '.github/*' '.sync/*' 'node_modules/*' '.homeybuild/*' '*.zip'
          unzip -t MyParcel-for-Homey-v0.3.0.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MyParcel-for-Homey-v0.3.0
          path: MyParcel-for-Homey-v0.3.0.zip
          compression-level: 0
