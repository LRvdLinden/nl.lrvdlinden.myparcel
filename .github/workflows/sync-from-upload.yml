name: Sync canonical MyParcel source
on:
  push:
    branches: [main]
    paths:
      - '.sync/current/READY'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace main with canonical uploaded app
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/current/part* | base64 --decode > /tmp/myparcel.zip
          unzip -t /tmp/myparcel.zip
          tmp="$(mktemp -d)"
          unzip -q /tmp/myparcel.zip -d "$tmp"
          src="$(find "$tmp" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$src"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .sync -exec rm -rf {} +
          cp -a "$src"/. .
          rm -rf .sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync main from canonical MyParcel ZIP"
          git push origin main
