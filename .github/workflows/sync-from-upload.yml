name: Sync canonical MyParcel source
on:
  push:
    branches: [main]
    paths:
      - '.sync/canonical3/READY'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace repository with canonical uploaded source
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/canonical3/part* | base64 --decode > /tmp/myparcel.tar.xz
          xz -t /tmp/myparcel.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .sync -exec rm -rf {} +
          tar -xJf /tmp/myparcel.tar.xz -C .
          rm -rf .sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync canonical MyParcel v0.1.5 source"
          git push origin main
