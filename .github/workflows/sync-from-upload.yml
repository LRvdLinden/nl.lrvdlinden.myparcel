name: Inspect current staged source
on:
  push:
    branches: [baseline-inspect]
    paths:
      - '.sync/current/READY'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack current staged source
        shell: bash
        run: |
          set -euo pipefail
          cat .sync/current/part* | base64 --decode > /tmp/current.zip
          unzip -t /tmp/current.zip >/dev/null
          mkdir -p /tmp/src
          unzip -q /tmp/current.zip -d /tmp/src
          SRC="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$SRC"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SRC"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Inspect staged baseline source"
          git push origin baseline-inspect
