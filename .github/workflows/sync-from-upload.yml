name: Inspect staged archives
on:
  push:
    branches: [baseline-inspect]
    paths:
      - '.sync/TESTREADY'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test staged archives
        shell: bash
        run: |
          set +e
          for d in .sync/*; do
            test -d "$d" || continue
            ls "$d"/part* >/dev/null 2>&1 || continue
            name="$(basename "$d")"
            cat "$d"/part* | base64 --decode > "/tmp/$name.bin" 2>/tmp/decode.err
            rc=$?
            printf '%s decode=%s size=%s type=' "$name" "$rc" "$(wc -c < "/tmp/$name.bin" 2>/dev/null || echo 0)"
            file -b "/tmp/$name.bin"
            xz -t "/tmp/$name.bin" >/dev/null 2>&1; echo "  xz=$?"
            unzip -t "/tmp/$name.bin" >/dev/null 2>&1; echo "  zip=$?"
          done
