name: Release MyParcel 0.3.5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-035.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip and create GitHub release v0.3.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.3.5 >/dev/null 2>&1; then
            echo "Release v0.3.5 already exists"; exit 0
          fi
          mkdir -p /tmp/zipb
          git archive --prefix=MyParcel-for-Homey-v0.3.5/ HEAD | tar -x -C /tmp/zipb
          rm -rf /tmp/zipb/MyParcel-for-Homey-v0.3.5/.github /tmp/zipb/MyParcel-for-Homey-v0.3.5/.gitignore
          find /tmp/zipb -name '*.zip' -delete
          (cd /tmp/zipb && zip -qr -X "$GITHUB_WORKSPACE/MyParcel-for-Homey-v0.3.5.zip" MyParcel-for-Homey-v0.3.5)
          gh release create v0.3.5 MyParcel-for-Homey-v0.3.5.zip \
            --target "${GITHUB_SHA}" \
            --title "v0.3.5 — FedEx, Budbee, Vinted Go, InPost, bpost & Ampère like Home Assistant" \
            --notes-file .github/release-notes/0.3.5.md \
            --latest
