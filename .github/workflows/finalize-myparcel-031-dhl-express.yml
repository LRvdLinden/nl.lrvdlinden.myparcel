name: Finalize MyParcel 0.3.1 DHL Express
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-myparcel-031-dhl-express.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Generate DHL Express device artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drivers/dhl-express/assets/images drivers/dhl-express/assets
          cp drivers/dhl-parcel/icon.svg drivers/dhl-express/icon.svg
          cp drivers/dhl-parcel/assets/icon.svg drivers/dhl-express/assets/icon.svg
          find drivers/dhl-express -type f \( -name '* (3)*' -o -name '* (4)*' -o -name 'ff*' \) -delete

          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          out=Path('drivers/dhl-express/assets/images')
          font='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          def make(size,name):
              im=Image.new('RGBA',(size,size),(255,204,0,255))
              d=ImageDraw.Draw(im)
              red=(212,5,17,255)
              f1=ImageFont.truetype(font,max(12,int(size*0.22)))
              f2=ImageFont.truetype(font,max(7,int(size*0.085)))
              word='DHL'
              b=d.textbbox((0,0),word,font=f1)
              tw,th=b[2]-b[0],b[3]-b[1]
              x=(size-tw)//2
              y=int(size*0.38-th/2)
              d.text((x,y),word,font=f1,fill=red)
              yy=int(size*0.48)
              line=max(1,int(size*0.012))
              d.rectangle([int(size*0.09),yy,int(size*0.29),yy+line],fill=red)
              d.rectangle([int(size*0.09),yy+int(size*0.025),int(size*0.24),yy+int(size*0.025)+line],fill=red)
              d.rectangle([int(size*0.71),yy,int(size*0.91),yy+line],fill=red)
              d.rectangle([int(size*0.76),yy+int(size*0.025),int(size*0.91),yy+int(size*0.025)+line],fill=red)
              exp='EXPRESS'
              b=d.textbbox((0,0),exp,font=f2)
              ew=b[2]-b[0]
              d.text(((size-ew)//2,int(size*0.60)),exp,font=f2,fill=red)
              im.save(out/name,optimize=True)

          make(500,'large.png')
          make(75,'small.png')
          PY

          test -f drivers/dhl-express/assets/images/large.png
          test -f drivers/dhl-express/assets/images/small.png
          test ! -e 'drivers/dhl-express/assets/images/large (3).png'
          test ! -e 'drivers/dhl-express/assets/images/small (4).png'
          cmp drivers/dhl-express/icon.svg drivers/dhl-parcel/icon.svg
          cmp drivers/dhl-express/assets/icon.svg drivers/dhl-parcel/assets/icon.svg

      - name: Build DHL Express helper ZIP
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/dhl-express-homey-login-helper/background.js
          node --check tools/dhl-express-homey-login-helper/bridge.js
          node --check tools/dhl-express-homey-login-helper/content.js
          node --check tools/dhl-express-homey-login-helper/popup.js
          rm -f tools/DHL-Express-Homey-Login-Helper-v0.1.0.zip
          (
            cd tools
            zip -qr DHL-Express-Homey-Login-Helper-v0.1.0.zip dhl-express-homey-login-helper
          )
          unzip -t tools/DHL-Express-Homey-Login-Helper-v0.1.0.zip >/dev/null

      - name: Validate Homey app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.homeybuild/*' -print0 | xargs -0 -n1 node --check
          node - <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(app.version!=='0.3.1') throw new Error('Expected app version 0.3.1');
          const driver=app.drivers.find(d=>d.id==='dhl-express');
          if(!driver) throw new Error('DHL Express driver missing');
          if(driver.images.small!=='/drivers/dhl-express/assets/images/small.png') throw new Error('Wrong DHL Express small image path');
          if(driver.images.large!=='/drivers/dhl-express/assets/images/large.png') throw new Error('Wrong DHL Express large image path');
          for(const id of ['myparcel-pakketten','myparcel-bezorging']){
            const caps=app.widgets?.[id]?.devices?.filter?.capabilities||'';
            if(!caps.includes('dhl_express_parcel_count')) throw new Error(id+' missing DHL Express filter');
          }
          NODE
          npx --no-install homey app validate --level debug

      - name: Build complete 0.3.1 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/myparcel031
          mkdir -p /tmp/myparcel031/MyParcel-for-Homey-v0.3.1
          rsync -a ./ /tmp/myparcel031/MyParcel-for-Homey-v0.3.1/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.homeybuild/' \
            --exclude '__MACOSX/' \
            --exclude 'MyParcel-for-Homey-v0.3.0.zip' \
            --exclude 'MyParcel-for-Homey-v0.3.1.zip'
          (
            cd /tmp/myparcel031
            zip -qr "$GITHUB_WORKSPACE/MyParcel-for-Homey-v0.3.1.zip" MyParcel-for-Homey-v0.3.1
          )
          unzip -t MyParcel-for-Homey-v0.3.1.zip >/dev/null
          sha256sum MyParcel-for-Homey-v0.3.1.zip

      - name: Commit finalized 0.3.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LRvdLinden"
          git config user.email "77990847+LRvdLinden@users.noreply.github.com"
          git add drivers/dhl-express/icon.svg
          git add drivers/dhl-express/assets/icon.svg
          git add drivers/dhl-express/assets/dhl-express-logo.svg
          git add drivers/dhl-express/assets/images/large.png
          git add drivers/dhl-express/assets/images/small.png
          git add widgets/myparcel-pakketten/public/dhl-express.svg
          git add widgets/myparcel-bezorging/public/dhl-express.svg
          git add -f tools/DHL-Express-Homey-Login-Helper-v0.1.0.zip
          git add tools/dhl-express-homey-login-helper
          git add -f MyParcel-for-Homey-v0.3.1.zip
          git rm .github/workflows/finalize-myparcel-031-dhl-express.yml
          git commit -m "Finalize MyParcel v0.3.1 DHL Express assets and tools"
          git push origin HEAD:main
