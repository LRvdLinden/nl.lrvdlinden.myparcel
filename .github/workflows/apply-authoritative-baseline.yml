name: Apply authoritative MyParcel baseline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-authoritative-baseline.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply authoritative ZIP asset patch
        shell: bash
        run: |
          set -euo pipefail
          test -f .sync/baseline-patch.zip
          echo "3c9b3ea925ae2f6c23f56481f42c04975a4182cf41812914f201faa65a33b1a6  .sync/baseline-patch.zip" | sha256sum -c -
          unzip -o .sync/baseline-patch.zip -d .
          test "$(git hash-object assets/ampere-logo.png)" = "e78607ae05afea0fc094a8ebac1a57b378e6191f"
          test "$(git hash-object assets/images/xlarge.png)" = "b42967439346b62480b24cfea817d6073a3145d0"
          test "$(git hash-object assets/images/large.png)" = "a9388dec797deac7ab2f4914c6659edf8cccd1fe"
          test "$(git hash-object assets/images/small.png)" = "0dac42da030abe67ea72b4c5be408a00484a8bad"
          test "$(git hash-object drivers/ampere/assets/ampere-logo.png)" = "e78607ae05afea0fc094a8ebac1a57b378e6191f"
          test "$(git hash-object drivers/ampere/assets/images/large.png)" = "2c03bc126e5b9fe63dc223f9f0aa9ed8a4099885"
          test "$(git hash-object drivers/ampere/assets/images/small.png)" = "dab92781eea95df7fc0958fff8b634272b34111f"
      - name: Validate Homey app
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.homeybuild/*' -print0 | xargs -0 -n1 node --check
          npx --no-install homey app validate --level debug
      - name: Build complete baseline ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/myparcel-baseline
          mkdir -p /tmp/myparcel-baseline/MyParcel-for-Homey-v0.3.0
          while IFS= read -r -d '' f; do
            case "$f" in
              .github/*|.sync/*|MyParcel-for-Homey-v0.3.0.zip) continue ;;
            esac
            mkdir -p "/tmp/myparcel-baseline/MyParcel-for-Homey-v0.3.0/$(dirname "$f")"
            cp "$f" "/tmp/myparcel-baseline/MyParcel-for-Homey-v0.3.0/$f"
          done < <(git ls-files -z)
          (
            cd /tmp/myparcel-baseline
            zip -qr "$GITHUB_WORKSPACE/MyParcel-for-Homey-v0.3.0.zip" MyParcel-for-Homey-v0.3.0
          )
          unzip -t MyParcel-for-Homey-v0.3.0.zip >/dev/null
          echo "Baseline ZIP:"
          ls -lh MyParcel-for-Homey-v0.3.0.zip
          sha256sum MyParcel-for-Homey-v0.3.0.zip
      - name: Commit synchronized baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LRvdLinden"
          git config user.email "77990847+LRvdLinden@users.noreply.github.com"
          git add assets/ampere-logo.png assets/images/xlarge.png assets/images/large.png assets/images/small.png
          git add drivers/ampere/assets/ampere-logo.png drivers/ampere/assets/images/large.png drivers/ampere/assets/images/small.png
          git add -f MyParcel-for-Homey-v0.3.0.zip
          git rm .sync/baseline-patch.zip
          git rm .github/workflows/apply-authoritative-baseline.yml
          git commit -m "Set uploaded MyParcel v0.3.0 ZIP as authoritative baseline"
          git push origin HEAD:main
