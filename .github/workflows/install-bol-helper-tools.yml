name: Install Bol.com helper in tools
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-bol-helper-tools.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install helper sources under tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bol-helper tools/bol-homey-login-helper
          mkdir -p /tmp/bol-helper tools/bol-homey-login-helper
          unzip -q .sync/bol-helper-v0.3.1.zip -d /tmp/bol-helper
          cp -a /tmp/bol-helper/bol-helper-0.3.1/. tools/bol-homey-login-helper/
          cp .sync/bol-helper-v0.3.1.zip tools/Bol.com-Homey-Login-Helper-v0.3.1.zip
          test -f tools/bol-homey-login-helper/manifest.json
          test -f tools/bol-homey-login-helper/background.js
          test -f tools/bol-homey-login-helper/popup.js
          test -f tools/bol-homey-login-helper/result.js
          test -f tools/bol-homey-login-helper/icons/icon128.png
          node -e "const m=require('./tools/bol-homey-login-helper/manifest.json'); if(m.version!=='0.3.1') process.exit(1)"
      - name: Commit helper to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LRvdLinden"
          git config user.email "77990847+LRvdLinden@users.noreply.github.com"
          git add -f tools/bol-homey-login-helper tools/Bol.com-Homey-Login-Helper-v0.3.1.zip
          git rm .sync/bol-helper-v0.3.1.zip
          git rm .github/workflows/install-bol-helper-tools.yml
          git commit -m "Add Bol.com Homey Login Helper v0.3.1 under tools"
          git push origin HEAD:main
