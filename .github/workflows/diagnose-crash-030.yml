name: Diagnose MyParcel 0.3.0 crash
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-crash-030.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax and manifest checks
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.homeybuild/*' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('app.json','utf8'));JSON.parse(require('fs').readFileSync('.homeychangelog.json','utf8'));"
          node - <<'NODE'
          const app=require('./app.json');
          const ids={};
          for(const section of ['triggers','conditions','actions']){
            ids[section]=(app.flow?.[section]||[]).map(x=>x.id);
            const dup=ids[section].filter((x,i,a)=>a.indexOf(x)!==i);
            if(dup.length) throw new Error('duplicate '+section+': '+dup.join(','));
          }
          const amp=app.drivers.find(d=>d.id==='ampere');
          if(!amp) throw new Error('Ampere driver missing');
          for(const id of amp.capabilities||[]) if(!app.capabilities[id] && id!=='myparcel_connection_status') throw new Error('Missing capability '+id);
          NODE
      - name: Homey validation
        shell: bash
        run: |
          set -euo pipefail
          if npx --no-install homey app validate --level debug; then
            echo "HOMEY_VALIDATE_OK=1"
          else
            echo "HOMEY_VALIDATE_FAILED=1"
            exit 1
          fi
