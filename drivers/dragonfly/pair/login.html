<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/dragonfly-logo.png" alt="Dragonfly"></div><h1 class="homey-title">Dragonfly / Intelcom</h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="country" data-t="country"></label><select id="country" class="homey-form-select"></select></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-textarea" rows="4" placeholder="INTLCMB2C000999999" dir="ltr"></textarea><p class="note" data-t="trackingHint"></p></div>
<button id="go" class="homey-button-primary-full" data-t="addDevice"></button><div id="status" class="status" role="status"></div>
<script>
const I18N={"en":{"addDevice":"Add device","checking":"Checking…","country":"Country","subtitle":"Follow Dragonfly (Netherlands, Australia) and Intelcom (Canada) parcels with their tracking number – no account needed.","tracking":"Tracking numbers (optional)","trackingHint":"One per line, e.g. INTLCMB2C000999999. Add “ out” after a code for a parcel you send yourself. You can also add codes later in the device settings or with a Flow."},"nl":{"addDevice":"Apparaat toevoegen","checking":"Controleren…","country":"Land","subtitle":"Volg pakketten van Dragonfly (Nederland, Australië) en Intelcom (Canada) met hun trackingnummer – geen account nodig.","tracking":"Trackingnummers (optioneel)","trackingHint":"Eén per regel, bijv. INTLCMB2C000999999. Zet “ out” achter een code voor een pakket dat je zelf verstuurt. Codes toevoegen kan ook later via de apparaatinstellingen of met een Flow."},"de":{"addDevice":"Gerät hinzufügen","checking":"Wird geprüft…","country":"Land","subtitle":"Verfolge Pakete von Dragonfly (Niederlande, Australien) und Intelcom (Kanada) mit ihrer Sendungsnummer – ohne Konto.","tracking":"Sendungsnummern (optional)","trackingHint":"Eine pro Zeile, z. B. INTLCMB2C000999999. Setze „ out“ hinter einen Code für ein Paket, das du selbst versendest. Codes kannst du auch später in den Geräteeinstellungen oder per Flow hinzufügen."},"fr":{"addDevice":"Ajouter l’appareil","checking":"Vérification…","country":"Pays","subtitle":"Suivez les colis Dragonfly (Pays-Bas, Australie) et Intelcom (Canada) avec leur numéro de suivi – sans compte.","tracking":"Numéros de suivi (facultatif)","trackingHint":"Un par ligne, p. ex. INTLCMB2C000999999. Ajoutez « out » après un code pour un colis que vous envoyez vous-même. Vous pourrez aussi ajouter des codes plus tard dans les réglages de l’appareil ou via un Flow."},"it":{"addDevice":"Aggiungi dispositivo","checking":"Verifica in corso…","country":"Paese","subtitle":"Traccia i pacchi Dragonfly (Paesi Bassi, Australia) e Intelcom (Canada) con il numero di tracciamento – senza account.","tracking":"Numeri di tracciamento (facoltativo)","trackingHint":"Uno per riga, ad es. INTLCMB2C000999999. Aggiungi “ out” dopo un codice per un pacco che invii tu. Puoi aggiungere codici anche in seguito nelle impostazioni del dispositivo o con un Flow."},"sv":{"addDevice":"Lägg till enhet","checking":"Kontrollerar…","country":"Land","subtitle":"Spåra paket från Dragonfly (Nederländerna, Australien) och Intelcom (Kanada) med spårningsnumret – inget konto behövs.","tracking":"Spårningsnummer (valfritt)","trackingHint":"Ett per rad, t.ex. INTLCMB2C000999999. Lägg till ” out” efter en kod för ett paket du skickar själv. Du kan också lägga till koder senare i enhetsinställningarna eller med ett Flow."},"no":{"addDevice":"Legg til enhet","checking":"Kontrollerer…","country":"Land","subtitle":"Spor pakker fra Dragonfly (Nederland, Australia) og Intelcom (Canada) med sporingsnummeret – ingen konto nødvendig.","tracking":"Sporingsnumre (valgfritt)","trackingHint":"Ett per linje, f.eks. INTLCMB2C000999999. Legg til « out» etter en kode for en pakke du sender selv. Du kan også legge til koder senere i enhetsinnstillingene eller med en Flow."},"es":{"addDevice":"Añadir dispositivo","checking":"Comprobando…","country":"País","subtitle":"Sigue paquetes de Dragonfly (Países Bajos, Australia) e Intelcom (Canadá) con su número de seguimiento, sin cuenta.","tracking":"Números de seguimiento (opcional)","trackingHint":"Uno por línea, p. ej. INTLCMB2C000999999. Añade « out» tras un código para un paquete que envías tú. También puedes añadir códigos después en los ajustes del dispositivo o con un Flow."},"da":{"addDevice":"Tilføj enhed","checking":"Kontrollerer…","country":"Land","subtitle":"Spor pakker fra Dragonfly (Holland, Australien) og Intelcom (Canada) med sporingsnummeret – ingen konto nødvendig.","tracking":"Sporingsnumre (valgfrit)","trackingHint":"Ét pr. linje, f.eks. INTLCMB2C000999999. Tilføj “ out” efter en kode for en pakke, du selv sender. Du kan også tilføje koder senere i enhedsindstillingerne eller med et Flow."},"ru":{"addDevice":"Добавить устройство","checking":"Проверка…","country":"Страна","subtitle":"Отслеживайте посылки Dragonfly (Нидерланды, Австралия) и Intelcom (Канада) по номеру отслеживания – без аккаунта.","tracking":"Номера отслеживания (необязательно)","trackingHint":"По одному в строке, например INTLCMB2C000999999. Добавьте « out» после кода для посылки, которую отправляете вы. Коды можно добавить и позже в настройках устройства или с помощью Flow."},"pl":{"addDevice":"Dodaj urządzenie","checking":"Sprawdzanie…","country":"Kraj","subtitle":"Śledź paczki Dragonfly (Holandia, Australia) i Intelcom (Kanada) po numerze przesyłki – bez konta.","tracking":"Numery przesyłek (opcjonalnie)","trackingHint":"Jeden w wierszu, np. INTLCMB2C000999999. Dodaj „ out” po kodzie dla paczki wysyłanej przez Ciebie. Kody możesz dodać także później w ustawieniach urządzenia lub za pomocą Flow."},"ko":{"addDevice":"기기 추가","checking":"확인 중…","country":"국가","subtitle":"운송장 번호로 Dragonfly(네덜란드, 호주) 및 Intelcom(캐나다) 택배를 조회하세요. 계정이 필요 없습니다.","tracking":"운송장 번호 (선택 사항)","trackingHint":"한 줄에 하나씩 입력하세요(예: INTLCMB2C000999999). 직접 보내는 택배는 코드 뒤에 “ out”을 추가하세요. 나중에 기기 설정이나 Flow로 코드를 추가할 수도 있습니다."},"ar":{"addDevice":"إضافة الجهاز","checking":"جارٍ التحقق…","country":"الدولة","subtitle":"تتبّع طرود Dragonfly (هولندا وأستراليا) وIntelcom (كندا) برقم التتبع – دون حساب.","tracking":"أرقام التتبع (اختياري)","trackingHint":"رمز واحد في كل سطر، مثل INTLCMB2C000999999. أضف ” out“ بعد الرمز للطرد الذي ترسله بنفسك. يمكنك أيضًا إضافة رموز لاحقًا من إعدادات الجهاز أو باستخدام Flow."}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?(L==='ar'?'\u2068'+v[n]+'\u2069':String(v[n])):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
const BRANDS=[['NL','Dragonfly'],['AU','Dragonfly'],['CA','Intelcom']];
for(const[code,brand]of BRANDS){const o=document.createElement('option');o.value=code;o.textContent=brand+' — '+regionName(code);country.append(o)}
go.onclick=async()=>{go.disabled=true;statusEl.textContent=t('checking');try{const r=await Homey.emit('connect',{trackingCodes:tracking.value,country:country.value});await Homey.createDevice(r.device);Homey.done();}catch(e){statusEl.textContent='';Homey.alert(e&&e.message||String(e))}finally{go.disabled=false}};
</script></body></html>
