<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>

<script>
const I18N={"en":{"checking":"Checking…","connectAccount":"Connect account","emptyCb":"Paste the address you ended on after signing in first.","landing":"Address after signing in","linkReady":"Sign-in link ready.","newLink":"A new sign-in link is ready. Open the sign-in page again – each link works only once.","open":"Open Amazon sign-in","privacy":"Homey never sees your password: you enter it on Amazon’s page, and Homey only keeps a sign-in token. You can remove access at any time under “Manage Your Content and Devices” on Amazon.","step1":"1. Open the Amazon sign-in page and complete every step Amazon asks for (password, verification code, puzzle or passkey).","step2":"2. You end on a page whose address starts with {prefix}. It may look blank or show an error – that is expected. Copy the full address from the address bar and paste it here.","store":"Amazon store","subtitle":"Experimental · Sign in on Amazon’s own page to see your orders and deliveries automatically.","wrongLanding":"This address does not start with {prefix}. Copy the full address of the page you ended on after signing in."},"nl":{"checking":"Controleren…","connectAccount":"Account koppelen","emptyCb":"Plak eerst het adres waarop je na het inloggen uitkwam.","landing":"Adres na het inloggen","linkReady":"Inloglink klaar.","newLink":"Er staat een nieuwe inloglink klaar. Open de inlogpagina opnieuw – elke link werkt maar één keer.","open":"Amazon-login openen","privacy":"Homey ziet je wachtwoord nooit: je vult het in op de pagina van Amazon en Homey bewaart alleen een inlogtoken. Je kunt de toegang altijd intrekken via “Inhoud en apparaten beheren” bij Amazon.","step1":"1. Open de inlogpagina van Amazon en doorloop elke stap die Amazon vraagt (wachtwoord, verificatiecode, puzzel of passkey).","step2":"2. Je komt uit op een pagina waarvan het adres begint met {prefix}. Die kan leeg lijken of een fout tonen – dat hoort zo. Kopieer het volledige adres uit de adresbalk en plak het hier.","store":"Amazon-winkel","subtitle":"Experimenteel · Log in op de eigen pagina van Amazon om je bestellingen en bezorgingen automatisch te zien.","wrongLanding":"Dit adres begint niet met {prefix}. Kopieer het volledige adres van de pagina waarop je na het inloggen uitkwam."},"de":{"checking":"Wird geprüft…","connectAccount":"Konto verbinden","emptyCb":"Füge zuerst die Adresse ein, auf der du nach der Anmeldung gelandet bist.","landing":"Adresse nach der Anmeldung","linkReady":"Anmeldelink bereit.","newLink":"Ein neuer Anmeldelink ist bereit. Öffne die Anmeldeseite erneut – jeder Link funktioniert nur einmal.","open":"Amazon-Anmeldung öffnen","privacy":"Homey sieht dein Passwort nie: Du gibst es auf der Amazon-Seite ein, und Homey speichert nur ein Anmeldetoken. Den Zugriff kannst du jederzeit unter „Inhalte und Geräte verwalten“ bei Amazon entfernen.","step1":"1. Öffne die Amazon-Anmeldeseite und erledige jeden Schritt, den Amazon verlangt (Passwort, Bestätigungscode, Rätsel oder Passkey).","step2":"2. Du landest auf einer Seite, deren Adresse mit {prefix} beginnt. Sie kann leer aussehen oder einen Fehler zeigen – das ist normal. Kopiere die vollständige Adresse aus der Adresszeile und füge sie hier ein.","store":"Amazon-Shop","subtitle":"Experimentell · Melde dich auf Amazons eigener Seite an, um deine Bestellungen und Lieferungen automatisch zu sehen.","wrongLanding":"Diese Adresse beginnt nicht mit {prefix}. Kopiere die vollständige Adresse der Seite, auf der du nach der Anmeldung gelandet bist."},"fr":{"checking":"Vérification…","connectAccount":"Connecter le compte","emptyCb":"Collez d’abord l’adresse affichée après la connexion.","landing":"Adresse après la connexion","linkReady":"Lien de connexion prêt.","newLink":"Un nouveau lien de connexion est prêt. Rouvrez la page de connexion – chaque lien ne fonctionne qu’une fois.","open":"Ouvrir la connexion Amazon","privacy":"Homey ne voit jamais votre mot de passe : vous le saisissez sur la page d’Amazon et Homey ne conserve qu’un to","emptyCb":"Klistra först in adressen du hamnade på efter inloggningen.","landing":"Adress efter inloggningen","linkReady":"Inloggningslänken är klar.","newLink":"En ny inloggningslänk är klar. Öppna inloggningssidan igen – varje länk fungerar bara en gång.","open":"Öppna Amazon-inloggningen","privacy":"Homey ser aldrig ditt lösenord: du anger det på Amazons sida och Homey sparar bara en inloggningstoken. Du kan när som helst ta bort åtkomsten under ”Hantera ditt innehåll och dina enheter” hos Amazon.","step1":"1. Öppna Amazons inloggningssida och slutför varje steg som Amazon ber om (lösenord, verifieringskod, pussel eller nyckel).","step2":"2. Du hamnar på en sida vars adress börjar med {prefix}. Den kan se tom ut eller visa ett fel – det är normalt. Kopiera hela adressen från adressfältet och klistra in den här.","store":"Amazon-butik","subtitle":"Experimentell · Logga in på Amazons egen sida för att automatiskt se dina beställningar och leveranser.","wrongLanding":"Den här adressen börjar inte med {prefix}. Kopiera hela adressen till sidan du hamnade på efter inloggningen."},"no":{"checking":"Kontrollerer…","connectAccount":"Koble til konto","emptyCb":"Lim først inn adressen du havnet på etter påloggingen.","landing":"Adresse etter påloggingen","linkReady":"Påloggingslenken er klar.","newLink":"En ny påloggingslenke er klar. Åpne påloggingssiden på nytt – hver lenke virker bare én gang.","open":"Åpne Amazon-pålogging","privacy":"Homey ser aldri passordet ditt: du skriver det inn på Amazons side, og Homey lagrer bare et påloggingstoken. Du kan når som helst fjerne tilgangen under «Administrer innhold og enheter» hos Amazon.","step1":"1. Åpne Amazons påloggingsside og fullfør hvert trinn Amazon ber om (passord, bekreftelseskode, puslespill eller passnøkkel).","step2":"2. Du havner på en side der adressen starter med {prefix}. Den kan se tom ut eller vise en feil – det er som forventet. Kopier hele adressen fra adresselinjen og lim den inn her.","store":"Amazon-butikk","subtitle":"Eksperimentell · Logg inn på Amazons egen side for å se bestillinger og leveranser automatisk.","wrongLanding":"Denne adressen starter ikke med {prefix}. Kopier hele adressen til siden du havnet på etter påloggingen."},"es":{"checking":"Comprobando…","connectAccount":"Conectar cuenta","emptyCb":"Pega primero la dirección en la que terminaste tras iniciar sesión.","landing":"Dirección tras iniciar sesión","linkReady":"Enlace de inicio de sesión listo.","newLink":"Hay un nuevo enlace de inicio de sesión. Vuelve a abrir la página de inicio de sesión: cada enlace funciona una sola vez.","open":"Abrir el inicio de sesión de Amazon","privacy":"Homey nunca ve tu contraseña: la introduces en la página de Amazon y Homey solo guarda un token de inicio de sesión. Puedes retirar el acceso en cualquier momento en «Administrar contenido y dispositivos» de Amazon.","step1":"1. Abre la página de inicio de sesión de Amazon y completa cada paso que pida (contraseña, código de verificación, rompecabezas o llave de acceso).","step2":"2. Terminarás en una página cuya dirección empieza por {prefix}. Puede verse en blanco o mostrar un error; es normal. Copia la dirección completa de la barra de direcciones y pégala aquí.","store":"Tienda de Amazon","subtitle":"Experimental · Inicia sesión en la propia página de Amazon para ver tus pedidos y entregas automáticamente.","wrongLanding":"Esta dirección no empieza por {prefix}. Copia la dirección completa de la página en la que terminaste tras iniciar sesión."},"da":{"checking":"Kontrollerer…","connectAccount":"Forbind konto","emptyCb":"Indsæt først den adresse, du endte på efter login.","landing":"Adresse efter login","linkReady":"Login-linket er klar.","newLink":"Et nyt login-link er klar. Åbn login-siden igen – hvert link virker kun én gang.","open":"Åbn Amazon-login","privacy":"Homey ser aldrig din adgangskode: du indtaster den på Amazons side, og Homey gemmer kun et login-token. Du kan altid fjerne adgangen under “Administrer dit indhold og dine enheder” hos Amazon.","step1":"1. Åbn Amazons login-side, og gennemfør hvert trin, Amazon beder om (adgangskode, bekræftelseskode, puslespil eller adgangsnøgle).","step2":"2. Du ender på en side, hvis adresse starter med {prefix}. Den kan se tom ud eller vise en fejl – det er forventet. Kopiér hele adressen fra adresselinjen, og indsæt den her.","store":"Amazon-butik","subtitle":"Eksperimentel · Log ind på Amazons egen side for automatisk at se dine ordrer og leveringer.","wrongLanding":"Denne adresse starter ikke med {prefix}. Kopiér hele adressen på den side, du endte på efter login."},"ru":{"checking":"Проверка…","connectAccount":"Подключить аккаунт","emptyCb":"Сначала вставьте адрес, на котором вы оказались после входа.","landing":"Адрес после входа","linkReady":"Ссылка для входа готова.","newLink":"Новая ссылка для входа готова. Откройте страницу входа ещё раз – каждая ссылка работает только один раз.","open":"Открыть вход Amazon","privacy":"Homey никогда не видит ваш пароль: вы вводите его на странице Amazon, а Homey хранит только токен входа. Доступ можно отозвать в любой момент в разделе «Управление контентом и устройствами» на Amazon.","step1":"1. Откройте страницу входа Amazon и пройдите все шаги, которые запросит Amazon (пароль, код подтверждения, головоломка или ключ доступа).","step2":"2. Вы окажетесь на странице, адрес которой начинается с {prefix}. Она может выглядеть пустой или показывать ошибку – так и должно быть. Скопируйте полный адрес из адресной строки и вставьте его сюда.","store":"Магазин Amazon","subtitle":"Экспериментально · Войдите на странице Amazon, чтобы автоматически видеть заказы и доставки.","wrongLanding":"Этот адрес не начинается с {prefix}. Скопируйте полный адрес страницы, на которой вы оказались после входа."},"pl":{"checking":"Sprawdzanie…","connectAccount":"Połącz konto","emptyCb":"Najpierw wklej adres, na którym znalazłeś się po zalogowaniu.","landing":"Adres po zalogowaniu","linkReady":"Link logowania gotowy.","newLink":"Nowy link logowania jest gotowy. Otwórz stronę logowania ponownie – każdy link działa tylko raz.","open":"Otwórz logowanie Amazon","privacy":"Homey nigdy nie widzi Twojego hasła: wpisujesz je na stronie Amazon, a Homey przechowuje tylko token logowania. Dostęp możesz w każdej chwili usunąć w sekcji „Zarządzaj treściami i urządzeniami” w Amazon.","step1":"1. Otwórz stronę logowania Amazon i wykonaj każdy krok, o który poprosi Amazon (hasło, kod weryfikacyjny, łamigłówka lub klucz dostępu).","step2":"2. Trafisz na stronę, której adres zaczyna się od {prefix}. Może wyglądać na pustą lub pokazywać błąd – to normalne. Skopiuj pełny adres z paska adresu i wklej go tutaj.","store":"Sklep Amazon","subtitle":"Eksperymentalne · Zaloguj się na stronie Amazon, aby automatycznie widzieć zamówienia i dostawy.","wrongLanding":"Ten adres nie zaczyna się od {prefix}. Skopiuj pełny adres strony, na której znalazłeś się po zalogowaniu."},"ko":{"checking":"확인 중…","connectAccount":"계정 연결","emptyCb":"먼저 로그인 후 도착한 페이지의 주소를 붙여 넣으세요.","landing":"로그인 후 주소","linkReady":"로그인 링크가 준비되었습니다.","newLink":"새 로그인 링크가 준비되었습니다. 로그인 페이지를 다시 여세요. 각 링크는 한 번만 사용할 수 있습니다.","open":"Amazon 로그인 열기","privacy":"Homey는 비밀번호를 절대 보지 않습니다. 비밀번호는 Amazon 페이지에서 입력하며 Homey는 로그인 토큰만 저장합니다. Amazon의 “콘텐츠 및 기기 관리”에서 언제든지 접근 권한을 제거할 수 있습니다.","step1":"1. Amazon 로그인 페이지를 열고 Amazon이 요구하는 모든 단계(비밀번호, 인증 코드, 퍼즐 또는 패스키)를 완료하세요.","step2":"2. 주소가 {prefix}(으)로 시작하는 페이지로 이동합니다. 페이지가 비어 있거나 오류가 표시될 수 있지만 정상입니다. 주소창의 전체 주소를 복사해 여기에 붙여 넣으세요.","store":"Amazon 스토어","subtitle":"실험적 기능 · Amazon 자체 페이지에서 로그인하면 주문과 배송이 자동으로 표시됩니다.","wrongLanding":"이 주소는 {prefix}(으)로 시작하지 않습니다. 로그인 후 도착한 페이지의 전체 주소를 복사하세요."},"ar":{"checking":"جارٍ التحقق…","connectAccount":"ربط الحساب","emptyCb":"الصق أولًا العنوان الذي وصلت إليه بعد تسجيل الدخول.","landing":"العنوان بعد تسجيل الدخول","linkReady":"رابط تسجيل الدخول جاهز.","newLink":"رابط تسجيل دخول جديد جاهز. افتح صفحة تسجيل الدخول مرة أخرى – كل رابط يعمل مرة واحدة فقط.","open":"فتح تسجيل الدخول إلى Amazon","privacy":"لا يرى Homey كلمة المرور أبدًا: تُدخلها في صفحة Amazon ويحتفظ Homey برمز تسجيل دخول فقط. يمكنك إزالة الوصول في أي وقت من «إدارة المحتوى والأجهزة» في Amazon.","step1":"1. افتح صفحة تسجيل الدخول إلى Amazon وأكمل كل خطوة يطلبها Amazon (كلمة المرور أو رمز التحقق أو اللغز أو مفتاح المرور).","step2":"2. ستصل إلى صفحة يبدأ عنوانها بـ {prefix}. قد تبدو فارغة أو تعرض خطأ – وهذا متوقع. انسخ العنوان الكامل من شريط العنوان والصقه هنا.","store":"متجر Amazon","subtitle":"تجريبي · سجّل الدخول من صفحة Amazon نفسها لعرض طلباتك وشحناتك تلقائيًا.","wrongLanding":"هذا العنوان لا يبدأ بـ {prefix}. انسخ العنوان الكامل للصفحة التي وصلت إليها بعد تسجيل الدخول."}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?(L==='ar'?'\u2068'+v[n]+'\u2069':String(v[n])):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
const openBtn=document.getElementById('open');
function openLink(url){if(!url)return;try{if(Homey.openURL)return Homey.openURL(url)}catch(_){}window.open(url,'_blank')}
const STORES=[['NL','amazon.nl'],['BE','amazon.com.be'],['DE','amazon.de'],['FR','amazon.fr'],['GB','amazon.co.uk'],['IE','amazon.ie'],['ES','amazon.es'],['IT','amazon.it'],['SE','amazon.se'],['PL','amazon.pl'],['US','amazon.com'],['CA','amazon.ca'],['MX','amazon.com.mx'],['BR','amazon.com.br'],['AU','amazon.com.au'],['JP','amazon.co.jp'],['IN','amazon.in']];
const DEFAULT_STORE={nl:'NL',de:'DE',fr:'FR',it:'IT',es:'ES',sv:'SE',pl:'PL',en:'GB'};
function fillStores(list){const keepValue=store.value;store.replaceChildren();for(const[code,domain]of list){const o=document.createElement('option');o.value=code;o.textContent=regionName(code)+' — '+domain;store.append(o)}if(keepValue!==undefined&&[...store.options].some(o=>o.value===keepValue))store.value=keepValue}
fillStores(STORES);store.value=DEFAULT_STORE[L]||'NL';
let link=null;
async function refreshLink(again){openBtn.disabled=true;try{link=await Homey.emit('login',{country:store.value});step2.textContent=t('step2',{prefix:link.landingPrefix||''});statusEl.textContent=again?t('newLink'):t('linkReady');openBtn.disabled=!link.url}catch(e){statusEl.textContent='';Homey.alert(e&&e.message||String(e))}}
step2.textContent=t('step2',{prefix:'https://www.amazon.com/ap/maplanding'});
store.onchange=()=>refreshLink(false);
openBtn.onclick=()=>openLink(link&&link.url);
connect.onclick=async()=>{const v=landing.value.trim();if(!v)return Homey.alert(t('emptyCb'));const prefix=link&&link.landingPrefix;if(prefix&&!v.startsWith(prefix))return Homey.alert(t('wrongLanding',{prefix}));connect.disabled=true;statusEl.textContent=t('checking');try{const r=await Homey.emit('verify',{landingUrl:v});await Homey.createDevice(r.device);Homey.done();}catch(e){statusEl.textContent='';await Homey.alert(e&&e.message||String(e));landing.value='';await refreshLink(true)}finally{connect.disabled=false}};
(async()=>{try{const list=await Homey.emit('countries');if(Array.isArray(list)&&list.length)fillStores(list.map(c=>[c.id,c.domain]))}catch(_){}await refreshLink(false)})();
</script></body></html>
