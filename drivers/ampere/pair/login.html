<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>.brand{text-align:center;margin:8px 0 22px}.brand img{max-width:230px;max-height:92px}.note{font-size:13px;line-height:1.45;opacity:.72}.sep{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:12px;opacity:.6}.sep:before,.sep:after{content:"";height:1px;background:currentColor;flex:1}textarea{min-height:126px;resize:vertical}:dir(rtl){direction:rtl;text-align:right}</style></head><body>
<div class="brand"><img src="../assets/ampere-logo.png" alt="Ampère"></div>
<h1 class="homey-title">Ampère</h1><p class="homey-subtitle" id="subtitle">Connect Ampère deliveries from your bol.com account.</p>
<div class="homey-form-group"><label class="homey-form-label" for="sessionCode" id="sessionLabel">Bol.com session code</label><textarea id="sessionCode" class="homey-form-input" placeholder="BOLHOMEY3.…" autocomplete="off" spellcheck="false"></textarea></div>
<p class="note" id="helperNote">Use Bol.com Homey Login Helper 0.3.1, sign in once at login.bol.com and paste the generated session code here. MyParcel then checks your bol.com orders automatically for Ampère deliveries.</p>
<div class="sep" id="orText">or manual fallback</div>
<div class="homey-form-group"><label class="homey-form-label" for="url" id="urlLabel">Ampère Track & Trace URL (optional)</label><input id="url" class="homey-form-input" type="url" placeholder="https://bol.prd.amperebezorgt.nl/…" autocomplete="off"></div>
<button id="connect" class="homey-button-primary-full">Connect</button>
<script>
const T={
en:['Connect Ampère deliveries from your bol.com account.','Bol.com session code','Use Bol.com Homey Login Helper 0.3.1, sign in once at login.bol.com and paste the generated session code here. MyParcel then checks your bol.com orders automatically for Ampère deliveries.','or manual fallback','Ampère Track & Trace URL (optional)','Connect'],
nl:['Koppel Ampère-bezorgingen vanuit je bol.com-account.','Bol.com-sessiecode','Gebruik Bol.com Homey Login Helper 0.3.1, log één keer in via login.bol.com en plak de gegenereerde sessiecode hier. MyParcel controleert daarna automatisch je bol.com-bestellingen op Ampère-bezorgingen.','of handmatige fallback','Ampère Track & Trace-URL (optioneel)','Koppelen'],
de:['Ampère-Lieferungen aus deinem bol.com-Konto verbinden.','Bol.com-Sitzungscode','Verwende Bol.com Homey Login Helper 0.3.1, melde dich einmal bei login.bol.com an und füge den erzeugten Sitzungscode hier ein. MyParcel prüft danach automatisch deine bol.com-Bestellungen auf Ampère-Lieferungen.','oder manuelle Alternative','Ampère Track-&-Trace-URL (optional)','Verbinden'],
fr:['Connectez les livraisons Ampère de votre compte bol.com.','Code de session bol.com','Utilisez Bol.com Homey Login Helper 0.3.1, connectez-vous une fois sur login.bol.com puis collez ici le code de session généré. MyParcel vérifie ensuite automatiquement vos commandes bol.com pour les livraisons Ampère.','ou solution manuelle','URL Track & Trace Ampère (facultatif)','Connecter'],
it:['Collega le consegne Ampère dal tuo account bol.com.','Codice sessione bol.com','Usa Bol.com Homey Login Helper 0.3.1, accedi una volta su login.bol.com e incolla qui il codice sessione generato. MyParcel controllerà automaticamente gli ordini bol.com per le consegne Ampère.','oppure fallback manuale','URL Track & Trace Ampère (opzionale)','Connetti'],
sv:['Anslut Ampère-leveranser från ditt bol.com-konto.','Bol.com-sessionskod','Använd Bol.com Homey Login Helper 0.3.1, logga in en gång på login.bol.com och klistra in den skapade sessionskoden här. MyParcel kontrollerar sedan automatiskt dina bol.com-beställningar efter Ampère-leveranser.','eller manuell reserv','Ampère Track & Trace-URL (valfri)','Anslut'],
no:['Koble Ampère-leveranser fra bol.com-kontoen din.','Bol.com-sesjonskode','Bruk Bol.com Homey Login Helper 0.3.1, logg inn én gang på login.bol.com og lim inn den genererte sesjonskoden her. MyParcel sjekker deretter bol.com-bestillingene dine automatisk for Ampère-leveranser.','eller manuelt alternativ','Ampère Track & Trace-URL (valgfri)','Koble til'],
es:['Conecta las entregas de Ampère desde tu cuenta bol.com.','Código de sesión de bol.com','Usa Bol.com Homey Login Helper 0.3.1, inicia sesión una vez en login.bol.com y pega aquí el código generado. MyParcel comprobará automáticamente tus pedidos de bol.com para encontrar entregas de Ampère.','o alternativa manual','URL Track & Trace de Ampère (opcional)','Conectar'],
da:['Forbind Ampère-leveringer fra din bol.com-konto.','Bol.com-sessionskode','Brug Bol.com Homey Login Helper 0.3.1, log ind én gang på login.bol.com og indsæt den genererede sessionskode her. MyParcel kontrollerer derefter automatisk dine bol.com-bestillinger for Ampère-leveringer.','eller manuel reserve','Ampère Track & Trace-URL (valgfri)','Forbind'],
ru:['Подключите доставки Ampère из своей учетной записи bol.com.','Код сессии bol.com','Используйте Bol.com Homey Login Helper 0.3.1, один раз войдите через login.bol.com и вставьте сюда созданный код сессии. Затем MyParcel автоматически проверит ваши заказы bol.com на доставки Ampère.','или ручной вариант','URL Ampère Track & Trace (необязательно)','Подключить'],
pl:['Połącz dostawy Ampère ze swojego konta bol.com.','Kod sesji bol.com','Użyj Bol.com Homey Login Helper 0.3.1, zaloguj się raz na login.bol.com i wklej tutaj wygenerowany kod sesji. MyParcel będzie następnie automatycznie sprawdzać zamówienia bol.com pod kątem dostaw Ampère.','lub ręczny tryb awaryjny','Adres URL Ampère Track & Trace (opcjonalnie)','Połącz'],
ko:['bol.com 계정의 Ampère 배송을 연결합니다.','bol.com 세션 코드','Bol.com Homey Login Helper 0.3.1을 사용해 login.bol.com에 한 번 로그인한 뒤 생성된 세션 코드를 여기에 붙여 넣으세요. 이후 MyParcel이 bol.com 주문에서 Ampère 배송을 자동으로 확인합니다.','또는 수동 대체 방식','Ampère Track & Trace URL (선택 사항)','연결'],
ar:['اربط شحنات Ampère من حساب bol.com الخاص بك.','رمز جلسة bol.com','استخدم Bol.com Homey Login Helper 0.3.1 وسجّل الدخول مرة واحدة عبر login.bol.com ثم الصق رمز الجلسة الذي تم إنشاؤه هنا. بعد ذلك يتحقق MyParcel تلقائيًا من طلبات bol.com بحثًا عن شحنات Ampère.','أو بديل يدوي','رابط Ampère Track & Trace (اختياري)','اتصال']};
let language='en';try{language=((Homey.getLanguage&&Homey.getLanguage())||'en').slice(0,2).toLowerCase();}catch(_){}const tr=T[language]||T.en;if(language==='ar')document.documentElement.dir='rtl';const els={subtitle:document.getElementById('subtitle'),sessionLabel:document.getElementById('sessionLabel'),session:document.getElementById('sessionCode'),helper:document.getElementById('helperNote'),orText:document.getElementById('orText'),urlLabel:document.getElementById('urlLabel'),url:document.getElementById('url'),connect:document.getElementById('connect')};els.subtitle.textContent=tr[0];els.sessionLabel.textContent=tr[1];els.helper.textContent=tr[2];els.orText.textContent=tr[3];els.urlLabel.textContent=tr[4];els.connect.textContent=tr[5];els.connect.addEventListener('click',async()=>{els.connect.disabled=true;try{const result=await Homey.emit('create_ampere',{sessionCode:els.session.value.trim(),url:els.url.value.trim()});await Homey.createDevice(result.device);Homey.done();}catch(error){Homey.alert(error&&error.message?error.message:String(error));els.connect.disabled=false;}});</script></body></html>
