<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}.sep{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:12px;opacity:.6}.sep:before,.sep:after{content:"";height:1px;background:currentColor;flex:1}textarea{min-height:126px}</style></head><body>
<div class="logo"><img src="../assets/ampere-logo.png" alt="Ampère"></div>
<h1 class="homey-title">Ampère</h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="sessionCode" data-t="sessionLabel"></label><textarea id="sessionCode" class="homey-form-input" placeholder="BOLHOMEY3.…" autocomplete="off" spellcheck="false" dir="ltr"></textarea></div>
<p class="note" data-t="helperNote"></p>
<div class="sep" data-t="orText"></div>
<div class="homey-form-group"><label class="homey-form-label" for="url" data-t="urlLabel"></label><input id="url" class="homey-form-input" type="url" placeholder="https://link.bol.com/t/…" autocomplete="off" dir="ltr"></div>
<button id="connect" class="homey-button-primary-full" data-t="connect"></button>
<script>
const I18N={"en":{"connect":"Connect","helperNote":"Use Bol.com Homey Login Helper 0.3.1, sign in once at login.bol.com and paste the generated session code here. MyParcel then checks your bol.com orders automatically for Ampère deliveries.","orText":"or manual fallback","sessionLabel":"bol.com session code","subtitle":"Connect Ampère deliveries from your bol.com account.","urlLabel":"Tracking link from the bol.com e-mail (optional)"},"nl":{"connect":"Koppelen","helperNote":"Gebruik Bol.com Homey Login Helper 0.3.1, log één keer in via login.bol.com en plak de gegenereerde sessiecode hier. MyParcel controleert daarna automatisch je bol.com-bestellingen op Ampère-bezorgingen.","orText":"of handmatig als alternatief","sessionLabel":"bol.com-sessiecode","subtitle":"Koppel Ampère-bezorgingen vanuit je bol.com-account.","urlLabel":"Trackinglink uit de bol.com-mail (optioneel)"},"de":{"connect":"Verbinden","helperNote":"Verwende Bol.com Homey Login Helper 0.3.1, melde dich einmal bei login.bol.com an und füge den erzeugten Sitzungscode hier ein. MyParcel prüft danach automatisch deine bol.com-Bestellungen auf Ampère-Lieferungen.","orText":"oder manuelle Alternative","sessionLabel":"bol.com-Sitzungscode","subtitle":"Verbinde Ampère-Lieferungen aus deinem bol.com-Konto.","urlLabel":"Sendungsverfolgungslink aus der bol.com-E-Mail (optional)"},"fr":{"connect":"Connecter","helperNote":"Utilisez Bol.com Homey Login Helper 0.3.1, connectez-vous une fois sur login.bol.com puis collez ici le code de session généré. MyParcel vérifie ensuite automatiquement vos commandes bol.com pour trouver les livraisons Ampère.","orText":"ou solution manuelle","sessionLabel":"Code de session bol.com","subtitle":"Connectez les livraisons Ampère de votre compte bol.com.","urlLabel":"Lien de suivi de l’e-mail bol.com (facultatif)"},"it":{"connect":"Collega","helperNote":"Usa Bol.com Homey Login Helper 0.3.1, accedi una volta su login.bol.com e incolla qui il codice di sessione generato. MyParcel controllerà poi automaticamente gli ordini bol.com per le consegne Ampère.","orText":"oppure alternativa manuale","sessionLabel":"Codice di sessione bol.com","subtitle":"Collega le consegne Ampère dal tuo account bol.com.","urlLabel":"Link di tracciamento dall’e-mail di bol.com (facoltativo)"},"sv":{"connect":"Anslut","helperNote":"Använd Bol.com Homey Login Helper 0.3.1, logga in en gång på login.bol.com och klistra in den skapade sessionskoden här. MyParcel kontrollerar sedan automatiskt dina bol.com-beställningar efter Ampère-leveranser.","orText":"eller manuellt alternativ","sessionLabel":"bol.com-sessionskod","subtitle":"Anslut Ampère-leveranser från ditt bol.com-konto.","urlLabel":"Spårningslänk från bol.com-mejlet (valfritt)"},"no":{"connect":"Koble til","helperNote":"Bruk Bol.com Homey Login Helper 0.3.1, logg inn én gang på login.bol.com og lim inn den genererte sesjonskoden her. MyParcel sjekker deretter bol.com-bestillingene dine automatisk for Ampère-leveranser.","orText":"eller manuelt alternativ","sessionLabel":"bol.com-sesjonskode","subtitle":"Koble til Ampère-leveranser fra bol.com-kontoen din.","urlLabel":"Sporingslenke fra e-posten fra bol.com (valgfritt)"},"es":{"connect":"Conectar","helperNote":"Usa Bol.com Homey Login Helper 0.3.1, inicia sesión una vez en login.bol.com y pega aquí el código de sesión generado. MyParcel comprobará automáticamente tus pedidos de bol.com en busca de entregas de Ampère.","orText":"o alternativa manual","sessionLabel":"Código de sesión de bol.com","subtitle":"Conecta las entregas de Ampère desde tu cuenta de bol.com.","urlLabel":"Enlace de seguimiento del correo de bol.com (opcional)"},"da":{"connect":"Forbind","helperNote":"Brug Bol.com Homey Login Helper 0.3.1, log ind én gang på login.bol.com, og indsæt den genererede sessionskode her. MyParcel kontrollerer derefter automatisk dine bol.com-ordrer for Ampère-leveringer.","orText":"eller manuelt alternativ","sessionLabel":"bol.com-sessionskode","subtitle":"Forbind Ampère-leveringer fra din bol.com-konto.","urlLabel":"Sporingslink fra bol.com-mailen (valgfrit)"},"ru":{"connect":"Подключить","helperNote":"Используйте Bol.com Homey Login Helper 0.3.1: один раз войдите на login.bol.com и вставьте сюда созданный код сеанса. После этого MyParcel будет автоматически проверять ваши заказы bol.com на доставки Ampère.","orText":"или вручную","sessionLabel":"Код сеанса bol.com","subtitle":"Подключите доставки Ampère из своей учётной записи bol.com.","urlLabel":"Ссылка для отслеживания из письма bol.com (необязательно)"},"pl":{"connect":"Połącz","helperNote":"Użyj Bol.com Homey Login Helper 0.3.1, zaloguj się raz na login.bol.com i wklej tutaj wygenerowany kod sesji. MyParcel będzie potem automatycznie sprawdzać zamówienia bol.com pod kątem dostaw Ampère.","orText":"lub ręcznie","sessionLabel":"Kod sesji bol.com","subtitle":"Połącz dostawy Ampère ze swojego konta bol.com.","urlLabel":"Link do śledzenia z e-maila bol.com (opcjonalnie)"},"ko":{"connect":"연결","helperNote":"Bol.com Homey Login Helper 0.3.1을 사용해 login.bol.com에 한 번 로그인한 뒤 생성된 세션 코드를 여기에 붙여 넣으세요. 이후 MyParcel이 bol.com 주문에서 Ampère 배송을 자동으로 확인합니다.","orText":"또는 수동 대체 방법","sessionLabel":"bol.com 세션 코드","subtitle":"bol.com 계정의 Ampère 배송을 연결합니다.","urlLabel":"bol.com 이메일의 배송 조회 링크 (선택 사항)"},"ar":{"connect":"ربط","helperNote":"استخدم Bol.com Homey Login Helper 0.3.1 وسجّل الدخول مرة واحدة عبر login.bol.com ثم الصق رمز الجلسة الذي تم إنشاؤه هنا. بعد ذلك يتحقق MyParcel تلقائيًا من طلباتك على bol.com بحثًا عن شحنات Ampère.","orText":"أو بديل يدوي","sessionLabel":"رمز جلسة bol.com","subtitle":"اربط شحنات Ampère من حسابك على bol.com.","urlLabel":"رابط التتبع من رسالة bol.com (اختياري)"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const els={session:document.getElementById('sessionCode'),url:document.getElementById('url'),connect:document.getElementById('connect')};
els.connect.addEventListener('click',async()=>{els.connect.disabled=true;try{const result=await Homey.emit('create_ampere',{sessionCode:els.session.value.trim(),url:els.url.value.trim()});await Homey.createDevice(result.device);Homey.done();}catch(error){Homey.alert(error&&error.message?error.message:String(error));els.connect.disabled=false;}});
</script></body></html>
