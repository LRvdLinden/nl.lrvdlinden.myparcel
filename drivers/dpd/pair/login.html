<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;min-height:92px;margin:8px 0 18px}.logo img{display:block;max-width:190px;max-height:82px;object-fit:contain}.homey-form-group{margin-bottom:14px}.note{font-size:12px;line-height:1.45;opacity:.72}.hidden{display:none}</style>
<style>:dir(rtl){direction:rtl;text-align:right}</style></head><body>
<div class="logo"><img src="../../../assets/dpd-logo.svg" alt="DPD"></div>
<h1 class="homey-title" data-t="title"></h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="country" data-t="country"></label><select id="country" class="homey-form-select"></select></div>
<div id="account">
 <div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="username"></div>
 <div class="homey-form-group"><label class="homey-form-label" for="password" data-t="password"></label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div>
 <button id="go" class="homey-button-primary-full" data-t="connect"></button>
</div>
<div id="poland" class="hidden">
 <p class="note" data-t="pl_intro"></p>
 <div class="homey-form-group"><label class="homey-form-label" for="phone" data-t="phone"></label><input id="phone" class="homey-form-input" type="tel" placeholder="600 700 800"></div>
 <button id="send" class="homey-button-secondary-full" data-t="send"></button>
 <div class="homey-form-group" style="margin-top:14px"><label class="homey-form-label" for="code" data-t="code"></label><input id="code" class="homey-form-input" inputmode="numeric" autocomplete="one-time-code"></div>
 <button id="verify" class="homey-button-primary-full" data-t="verify"></button>
</div>
<script>
const TXT={"en": {"title": "DPD", "subtitle": "Sign in with your myDPD account (the same as in the DPD app).", "country": "Country", "email": "E-mail address", "password": "Password", "connect": "Connect", "phone": "Mobile number", "send": "Send SMS code", "code": "SMS code", "verify": "Verify and connect", "pl_intro": "DPD Poland signs in with your mobile number and a one-time SMS code. Homey only keeps a renewable token, never the code.", "sent": "SMS code sent."}, "nl": {"title": "DPD", "subtitle": "Log in met je myDPD-account (hetzelfde als in de DPD-app).", "country": "Land", "email": "E-mailadres", "password": "Wachtwoord", "connect": "Koppelen", "phone": "Mobiel nummer", "send": "Sms-code versturen", "code": "Sms-code", "verify": "Controleren en koppelen", "pl_intro": "DPD Polen logt in met je mobiele nummer en een eenmalige sms-code. Homey bewaart alleen een vernieuwbaar token, nooit de code.", "sent": "Sms-code verstuurd."}, "de": {"title": "DPD", "subtitle": "Mit deinem myDPD-Konto anmelden (wie in der DPD-App).", "country": "Land", "email": "E-Mail-Adresse", "password": "Passwort", "connect": "Verbinden", "phone": "Handynummer", "send": "SMS-Code senden", "code": "SMS-Code", "verify": "Prüfen und verbinden", "pl_intro": "DPD Polen meldet sich mit Handynummer und einmaligem SMS-Code an. Homey speichert nur ein erneuerbares Token, nie den Code.", "sent": "SMS-Code gesendet."}, "fr": {"title": "DPD", "subtitle": "Connectez-vous avec votre compte myDPD (le même que dans l’app DPD).", "country": "Pays", "email": "Adresse e-mail", "password": "Mot de passe", "connect": "Connecter", "phone": "Numéro de mobile", "send": "Envoyer le code SMS", "code": "Code SMS", "verify": "Vérifier et connecter", "pl_intro": "DPD Pologne se connecte avec votre numéro de mobile et un code SMS unique. Homey ne conserve qu’un jeton renouvelable, jamais le code.", "sent": "Code SMS envoyé."}, "pl": {"title": "DPD", "subtitle": "Zaloguj się kontem myDPD.", "country": "Kraj", "email": "Adres e-mail", "password": "Hasło", "connect": "Połącz", "phone": "Numer telefonu", "send": "Wyślij kod SMS", "code": "Kod SMS", "verify": "Sprawdź i połącz", "pl_intro": "DPD Polska loguje się numerem telefonu i jednorazowym kodem SMS. Homey przechowuje tylko odnawialny token, nigdy kodu.", "sent": "Kod SMS wysłany."}};
let T=TXT.en,countries=[];
const MODE='pair';
function apply(){document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=T[el.dataset.t]||TXT.en[el.dataset.t]||''});}
function view(){const c=countries.find(x=>x.id===country.value);const pl=c&&c.backend==='pl';account.classList.toggle('hidden',pl);poland.classList.toggle('hidden',!pl);}
async function finish(r){if(MODE==='pair'){await Homey.createDevice(r.device);}Homey.done();}
(async()=>{apply();try{const r=await Homey.emit('countries');T=Object.assign({},TXT.en,TXT[r.language]||{});apply();countries=r.countries||[];
country.innerHTML=countries.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
if(r.current){country.value=r.current.country;email.value=r.current.email||'';phone.value=r.current.phone||'';}view();}catch(e){Homey.alert(e.message||String(e));}})();
country.onchange=view;
go.onclick=async()=>{go.disabled=true;try{await finish(await Homey.emit('login',{country:country.value,email:email.value.trim(),password:password.value}));}catch(e){Homey.alert(e.message||String(e));go.disabled=false;}};
send.onclick=async()=>{send.disabled=true;try{const r=await Homey.emit('pl_send_sms',{phone:phone.value});phone.value=r.phone;Homey.alert(T.sent);}catch(e){Homey.alert(e.message||String(e));}send.disabled=false;};
verify.onclick=async()=>{verify.disabled=true;try{await finish(await Homey.emit('pl_verify',{phone:phone.value,code:code.value.trim()}));}catch(e){Homey.alert(e.message||String(e));verify.disabled=false;}};
</script></body></html>
