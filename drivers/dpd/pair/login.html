<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/dpd-logo.svg" alt="DPD"></div>
<h1 class="homey-title" data-t="title"></h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="country" data-t="country"></label><select id="country" class="homey-form-select"></select></div>
<div id="account">
 <div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="username" dir="ltr"></div>
 <div class="homey-form-group"><label class="homey-form-label" for="password" data-t="password"></label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div>
 <button id="go" class="homey-button-primary-full" data-t="connect"></button>
</div>
<div id="poland" class="hidden">
 <p class="note" data-t="pl_intro"></p>
 <div class="homey-form-group"><label class="homey-form-label" for="phone" data-t="phone"></label><input id="phone" class="homey-form-input" type="tel" placeholder="600 700 800" dir="ltr"></div>
 <button id="send" class="homey-button-secondary-full" data-t="send"></button>
 <div class="homey-form-group" style="margin-top:14px"><label class="homey-form-label" for="code" data-t="code"></label><input id="code" class="homey-form-input" inputmode="numeric" autocomplete="one-time-code"></div>
 <button id="verify" class="homey-button-primary-full" data-t="verify"></button>
</div>
<script>
const I18N={"en":{"code":"SMS code","connect":"Connect","country":"Country","email":"E-mail address","password":"Password","phone":"Mobile number","pl_intro":"DPD Poland signs in with your mobile number and a one-time SMS code. Homey only keeps a renewable token, never the code.","send":"Send SMS code","sent":"SMS code sent.","subtitle":"Sign in with your myDPD account (the same as in the DPD app).","title":"DPD","verify":"Verify and connect"},"nl":{"code":"Sms-code","connect":"Koppelen","country":"Land","email":"E-mailadres","password":"Wachtwoord","phone":"Mobiel nummer","pl_intro":"DPD Polen logt in met je mobiele nummer en een eenmalige sms-code. Homey bewaart alleen een vernieuwbaar token, nooit de code.","send":"Sms-code versturen","sent":"Sms-code verstuurd.","subtitle":"Log in met je myDPD-account (hetzelfde als in de DPD-app).","title":"DPD","verify":"Controleren en koppelen"},"de":{"code":"SMS-Code","connect":"Verbinden","country":"Land","email":"E-Mail-Adresse","password":"Passwort","phone":"Handynummer","pl_intro":"DPD Polen meldet sich mit deiner Handynummer und einem einmaligen SMS-Code an. Homey speichert nur ein erneuerbares Token, nie den Code.","send":"SMS-Code senden","sent":"SMS-Code gesendet.","subtitle":"Melde dich mit deinem myDPD-Konto an (wie in der DPD-App).","title":"DPD","verify":"Prüfen und verbinden"},"fr":{"code":"Code SMS","connect":"Connecter","country":"Pays","email":"Adresse e-mail","password":"Mot de passe","phone":"Numéro de mobile","pl_intro":"DPD Pologne se connecte avec votre numéro de mobile et un code SMS à usage unique. Homey ne conserve qu’un jeton renouvelable, jamais le code.","send":"Envoyer le code SMS","sent":"Code SMS envoyé.","subtitle":"Connectez-vous avec votre compte myDPD (le même que dans l’app DPD).","title":"DPD","verify":"Vérifier et connecter"},"it":{"code":"Codice SMS","connect":"Collega","country":"Paese","email":"Indirizzo e-mail","password":"Password","phone":"Numero di cellulare","pl_intro":"DPD Polonia accede con il tuo numero di cellulare e un codice SMS monouso. Homey conserva solo un token rinnovabile, mai il codice.","send":"Invia codice SMS","sent":"Codice SMS inviato.","subtitle":"Accedi con il tuo account myDPD (lo stesso dell’app DPD).","title":"DPD","verify":"Verifica e collega"},"sv":{"code":"Sms-kod","connect":"Anslut","country":"Land","email":"E-postadress","password":"Lösenord","phone":"Mobilnummer","pl_intro":"DPD Polen loggar in med ditt mobilnummer och en engångskod via sms. Homey sparar bara en förnybar token, aldrig koden.","send":"Skicka sms-kod","sent":"Sms-kod skickad.","subtitle":"Logga in med ditt myDPD-konto (samma som i DPD-appen).","title":"DPD","verify":"Verifiera och anslut"},"no":{"code":"SMS-kode","connect":"Koble til","country":"Land","email":"E-postadresse","password":"Passord","phone":"Mobilnummer","pl_intro":"DPD Polen logger inn med mobilnummeret ditt og en engangskode på SMS. Homey lagrer bare et fornybart token, aldri koden.","send":"Send SMS-kode","sent":"SMS-kode sendt.","subtitle":"Logg inn med myDPD-kontoen din (den samme som i DPD-appen).","title":"DPD","verify":"Bekreft og koble til"},"es":{"code":"Código SMS","connect":"Conectar","country":"País","email":"Correo electrónico","password":"Contraseña","phone":"Número de móvil","pl_intro":"DPD Polonia inicia sesión con tu número de móvil y un código SMS de un solo uso. Homey solo guarda un token renovable, nunca el código.","send":"Enviar código SMS","sent":"Código SMS enviado.","subtitle":"Inicia sesión con tu cuenta myDPD (la misma que en la app de DPD).","title":"DPD","verify":"Verificar y conectar"},"da":{"code":"Sms-kode","connect":"Forbind","country":"Land","email":"E-mailadresse","password":"Adgangskode","phone":"Mobilnummer","pl_intro":"DPD Polen logger ind med dit mobilnummer og en engangskode via sms. Homey gemmer kun et token, der kan fornyes, aldrig koden.","send":"Send sms-kode","sent":"Sms-kode sendt.","subtitle":"Log ind med din myDPD-konto (den samme som i DPD-appen).","title":"DPD","verify":"Bekræft og forbind"},"ru":{"code":"SMS-код","connect":"Подключить","country":"Страна","email":"Адрес электронной почты","password":"Пароль","phone":"Номер мобильного телефона","pl_intro":"DPD Польша выполняет вход по номеру мобильного телефона и одноразовому SMS-коду. Homey хранит только обновляемый токен, но не код.","send":"Отправить SMS-код","sent":"SMS-код отправлен.","subtitle":"Войдите с аккаунтом myDPD (тем же, что и в приложении DPD).","title":"DPD","verify":"Проверить и подключить"},"pl":{"code":"Kod SMS","connect":"Połącz","country":"Kraj","email":"Adres e-mail","password":"Hasło","phone":"Numer telefonu komórkowego","pl_intro":"DPD Polska loguje się numerem telefonu i jednorazowym kodem SMS. Homey przechowuje tylko odnawialny token, nigdy kod.","send":"Wyślij kod SMS","sent":"Kod SMS wysłany.","subtitle":"Zaloguj się kontem myDPD (tym samym co w aplikacji DPD).","title":"DPD","verify":"Sprawdź i połącz"},"ko":{"code":"SMS 코드","connect":"연결","country":"국가","email":"이메일 주소","password":"비밀번호","phone":"휴대폰 번호","pl_intro":"DPD 폴란드는 휴대폰 번호와 일회용 SMS 코드로 로그인합니다. Homey는 코드가 아니라 갱신 가능한 토큰만 저장합니다.","send":"SMS 코드 보내기","sent":"SMS 코드를 보냈습니다.","subtitle":"myDPD 계정으로 로그인하세요 (DPD 앱과 동일한 계정).","title":"DPD","verify":"확인 후 연결"},"ar":{"code":"رمز SMS","connect":"ربط","country":"الدولة","email":"عنوان البريد الإلكتروني","password":"كلمة المرور","phone":"رقم الجوال","pl_intro":"تسجّل DPD بولندا الدخول برقم جوالك ورمز SMS لمرة واحدة. يحتفظ Homey برمز مميز قابل للتجديد فقط، وليس بالرمز أبدًا.","send":"إرسال رمز SMS","sent":"تم إرسال رمز SMS.","subtitle":"سجّل الدخول بحساب myDPD (نفس الحساب في تطبيق DPD).","title":"DPD","verify":"تحقّق واربط"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
let countries=[];
const MODE='pair';
const REGION={'DPD-UK':'GB','BRT':'IT','CHR-PT':'PT'};
function countryLabel(c){const code=REGION[c.id]||String(c.id||'').replace(/^[A-Z]+-/,'');const name=/^[A-Z]{2}$/.test(code)?regionName(code,c.name):c.name;return c.id==='BRT'?name+' (BRT)':name}
function view(){const c=countries.find(x=>x.id===country.value);const pl=c&&c.backend==='pl';account.classList.toggle('hidden',pl);poland.classList.toggle('hidden',!pl);}
async function finish(r){if(MODE==='pair'){await Homey.createDevice(r.device);}Homey.done();}
(async()=>{try{const r=await Homey.emit('countries');if(r.language)applyLang(r.language);countries=r.countries||[];
country.replaceChildren(...countries.map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=countryLabel(c);return o}));
if(r.current){country.value=r.current.country;email.value=r.current.email||'';phone.value=r.current.phone||'';}view();}catch(e){Homey.alert(e.message||String(e));}})();
country.onchange=view;
go.onclick=async()=>{go.disabled=true;try{await finish(await Homey.emit('login',{country:country.value,email:email.value.trim(),password:password.value}));}catch(e){Homey.alert(e.message||String(e));go.disabled=false;}};
send.onclick=async()=>{send.disabled=true;try{const r=await Homey.emit('pl_send_sms',{phone:phone.value});phone.value=r.phone;Homey.alert(t('sent'));}catch(e){Homey.alert(e.message||String(e));}send.disabled=false;};
verify.onclick=async()=>{verify.disabled=true;try{await finish(await Homey.emit('pl_verify',{phone:phone.value,code:code.value.trim()}));}catch(e){Homey.alert(e.message||String(e));verify.disabled=false;}};
</script></body></html>
