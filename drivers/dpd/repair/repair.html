<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 22px}.logo img{display:block;width:auto;max-width:190px;height:auto;max-height:82px;object-fit:contain;object-position:center}.homey-form-group{margin-bottom:14px}</style><style>:dir(rtl){direction:rtl;text-align:right}</style></head><body><div class="logo"><img src="../../../assets/dpd-logo.svg" alt="dpd"></div><h1 class="homey-title">DPD / myDPD</h1><p class="homey-subtitle">Log in with your myDPD recipient account.</p><div class="homey-form-group"><label class="homey-form-label">E-mail</label><input id="email" class="homey-form-input" type="email" autocomplete="username"></div><div class="homey-form-group"><label class="homey-form-label">Password</label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div><button id="go" class="homey-button-primary-full">Connect</button><script>go.onclick=async()=>{go.disabled=true;try{const r=await Homey.emit('login',{email:email.value.trim(),password:password.value});Homey.done()}catch(e){Homey.alert(e.message||String(e));go.disabled=false}}</script></body></html>
