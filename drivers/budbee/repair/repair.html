<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 28px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 22px}.logo img{display:block;width:auto;max-width:190px;height:auto;max-height:82px;object-fit:contain;object-position:center}.codes{min-height:120px;resize:vertical}.note{font-size:13px;line-height:1.45;opacity:.75}</style><style>:dir(rtl){direction:rtl;text-align:right}</style></head><body>
<div class="logo"><img src="../../../assets/budbee-logo.svg" alt="budbee"></div><h1 class="homey-title" id="title">Connect Budbee</h1><p class="homey-subtitle" id="subtitle">Add your Budbee order or tracking numbers.</p><p class="note" id="note">Budbee consumer tracking does not use an account login for the parcel data used here. Enter the order/tracking numbers from your Budbee deliveries.</p>
<div class="homey-form-group"><label class="homey-form-label" id="label">Tracking/order numbers</label><textarea id="trackingCodes" class="homey-form-input codes" placeholder="One per line"></textarea></div><button id="connect" class="homey-button-primary-full">Add Budbee device</button>
<script>const l=(navigator.language||'en').toLowerCase().split('-')[0];if(l==='nl'){title.textContent='Budbee koppelen';subtitle.textContent='Voeg je Budbee bestel- of trackingnummers toe.';note.textContent='Voor de pakketgegevens die deze app gebruikt heeft Budbee geen accountlogin nodig. Vul de bestel-/trackingnummers van je Budbee-zendingen in.';label.textContent='Tracking-/bestelnummers';trackingCodes.placeholder='Eén per regel';connect.textContent='Budbee-device toevoegen'}connect.onclick=async()=>{connect.disabled=true;try{const r=await Homey.emit('connect',{trackingCodes:trackingCodes.value});Homey.done()}catch(e){Homey.alert(e.message||String(e));connect.disabled=false}}</script></body></html>
