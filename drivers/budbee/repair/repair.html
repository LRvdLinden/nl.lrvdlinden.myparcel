<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}textarea{min-height:120px}</style></head><body>
<div class="logo"><img src="../../../assets/budbee-logo.svg" alt="Budbee"></div><h1 class="homey-title" data-t="title"></h1><p class="homey-subtitle" data-t="subtitle"></p><p class="note" data-t="note"></p>
<div class="homey-form-group"><label class="homey-form-label" for="trackingCodes" data-t="label"></label><textarea id="trackingCodes" class="homey-form-input" data-ph="onePerLine" dir="ltr"></textarea></div><button id="connect" class="homey-button-primary-full" data-t="save"></button>
<script>
const I18N={"en":{"label":"Tracking/order numbers","note":"Budbee consumer tracking does not use an account login for the parcel data used here. Enter the order/tracking numbers from your Budbee deliveries.","onePerLine":"One per line","save":"Save","subtitle":"Add your Budbee order or tracking numbers.","title":"Connect Budbee"},"nl":{"label":"Tracking-/bestelnummers","note":"Voor de pakketgegevens die deze app gebruikt heeft Budbee geen accountlogin nodig. Vul de bestel-/trackingnummers van je Budbee-zendingen in.","onePerLine":"Eén per regel","save":"Opslaan","subtitle":"Voeg je Budbee-bestel- of trackingnummers toe.","title":"Budbee koppelen"},"de":{"label":"Sendungs-/Bestellnummern","note":"Für die hier genutzten Paketdaten braucht Budbee keine Konto-Anmeldung. Gib die Bestell-/Sendungsnummern deiner Budbee-Lieferungen ein.","onePerLine":"Eine pro Zeile","save":"Speichern","subtitle":"Füge deine Budbee-Bestell- oder Sendungsnummern hinzu.","title":"Budbee verbinden"},"fr":{"label":"Numéros de suivi/commande","note":"Le suivi Budbee n’exige pas de connexion à un compte pour les données de colis utilisées ici. Saisissez les numéros de commande/suivi de vos livraisons Budbee.","onePerLine":"Un par ligne","save":"Enregistrer","subtitle":"Ajoutez vos numéros de commande ou de suivi Budbee.","title":"Connecter Budbee"},"it":{"label":"Numeri di tracciamento/ordine","note":"Per i dati dei pacchi usati qui Budbee non richiede l’accesso a un account. Inserisci i numeri d’ordine/tracciamento delle tue consegne Budbee.","onePerLine":"Uno per riga","save":"Salva","subtitle":"Aggiungi i numeri d’ordine o di tracciamento Budbee.","title":"Collega Budbee"},"sv":{"label":"Spårnings-/ordernummer","note":"Budbee kräver ingen kontoinloggning för paketdata som används här. Ange order-/spårningsnumren från dina Budbee-leveranser.","onePerLine":"En per rad","save":"Spara","subtitle":"Lägg till dina Budbee-order- eller spårningsnummer.","title":"Anslut Budbee"},"no":{"label":"Sporings-/ordrenumre","note":"Budbee krever ingen kontopålogging for pakkedataene som brukes her. Skriv inn ordre-/sporingsnumrene fra Budbee-leveransene dine.","onePerLine":"Én per linje","save":"Lagre","subtitle":"Legg til Budbee-ordre- eller sporingsnumrene dine.","title":"Koble til Budbee"},"es":{"label":"Números de seguimiento/pedido","note":"Budbee no requiere iniciar sesión en una cuenta para los datos de paquetes que se usan aquí. Introduce los números de pedido/seguimiento de tus entregas de Budbee.","onePerLine":"Uno por línea","save":"Guardar","subtitle":"Añade tus números de pedido o de seguimiento de Budbee.","title":"Conectar Budbee"},"da":{"label":"Sporings-/ordrenumre","note":"Budbee kræver ikke login på en konto for de pakkedata, der bruges her. Indtast ordre-/sporingsnumrene fra dine Budbee-leveringer.","onePerLine":"Én pr. linje","save":"Gem","subtitle":"Tilføj dine Budbee-ordre- eller sporingsnumre.","title":"Forbind Budbee"},"ru":{"label":"Номера отслеживания/заказов","note":"Для используемых здесь данных о посылках Budbee не требует входа в аккаунт. Введите номера заказов/отслеживания ваших доставок Budbee.","onePerLine":"По одному в строке","save":"Сохранить","subtitle":"Добавьте номера заказов или отслеживания Budbee.","title":"Подключить Budbee"},"pl":{"label":"Numery przesyłek/zamówień","note":"Budbee nie wymaga logowania do konta dla używanych tu danych paczek. Wpisz numery zamówień/przesyłek z dostaw Budbee.","onePerLine":"Jeden w wierszu","save":"Zapisz","subtitle":"Dodaj numery zamówień lub przesyłek Budbee.","title":"Połącz Budbee"},"ko":{"label":"운송장/주문 번호","note":"여기서 사용하는 택배 정보에는 Budbee 계정 로그인이 필요하지 않습니다. Budbee 배송의 주문/운송장 번호를 입력하세요.","onePerLine":"한 줄에 하나씩","save":"저장","subtitle":"Budbee 주문 번호 또는 운송장 번호를 추가하세요.","title":"Budbee 연결"},"ar":{"label":"أرقام التتبع/الطلب","note":"لا يتطلب Budbee تسجيل الدخول إلى حساب لبيانات الطرود المستخدمة هنا. أدخل أرقام الطلب/التتبع لشحنات Budbee الخاصة بك.","onePerLine":"واحد في كل سطر","save":"حفظ","subtitle":"أضف أرقام الطلب أو التتبع الخاصة بـ Budbee.","title":"ربط Budbee"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
connect.onclick=async()=>{connect.disabled=true;try{const r=await Homey.emit('connect',{trackingCodes:trackingCodes.value});Homey.done()}catch(e){Homey.alert(e.message||String(e));connect.disabled=false}};
</script></body></html>
