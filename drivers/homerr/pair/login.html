<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 22px}.logo img{display:block;width:auto;max-width:190px;height:auto;max-height:82px;object-fit:contain;object-position:center}.homey-form-group{margin-bottom:14px}.hidden{display:none}</style><style>:dir(rtl){direction:rtl;text-align:right}</style></head><body><div class="logo"><img src="../../../assets/homerr-logo.svg" alt="homerr"></div><h1 class="homey-title">Homerr / Vinted Go</h1><p class="homey-subtitle">Sign in with the e-mail address linked to your Homerr / Vinted Go shipments.</p><section id="a"><div class="homey-form-group"><label class="homey-form-label">E-mail</label><input id="email" class="homey-form-input" type="email" autocomplete="email"></div><button id="send" class="homey-button-primary-full">Send verification link</button></section><section id="b" class="hidden"><p>Open the verification e-mail and paste the complete link or token below.</p><div class="homey-form-group"><label class="homey-form-label">Verification link / token</label><textarea id="token" class="homey-form-input"></textarea></div><button id="finish" class="homey-button-primary-full">Connect account</button></section><script>send.onclick=async()=>{send.disabled=true;try{await Homey.emit('start_login',{email:email.value.trim()});a.classList.add('hidden');b.classList.remove('hidden')}catch(e){Homey.alert(e.message||String(e));send.disabled=false}};finish.onclick=async()=>{finish.disabled=true;try{const r=await Homey.emit('finish_login',{token:token.value.trim()});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));finish.disabled=false}}</script></body></html>
