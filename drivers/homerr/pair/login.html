<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/homerr-logo.svg" alt="Homerr"></div><h1 class="homey-title">Homerr / Vinted Go</h1><p class="homey-subtitle" data-t="subtitle"></p>
<section id="a"><div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="email" dir="ltr"></div><button id="send" class="homey-button-primary-full" data-t="send"></button></section>
<section id="b" class="hidden"><p data-t="verifyIntro"></p><div class="homey-form-group"><label class="homey-form-label" for="token" data-t="tokenLabel"></label><textarea id="token" class="homey-form-input" dir="ltr"></textarea></div><button id="finish" class="homey-button-primary-full" data-t="connectAccount"></button></section>
<script>
const I18N={"en":{"connectAccount":"Connect account","email":"E-mail address","send":"Send verification link","subtitle":"Sign in with the e-mail address linked to your Homerr / Vinted Go shipments.","tokenLabel":"Verification link / token","verifyIntro":"Open the verification e-mail and paste the complete link or token below."},"nl":{"connectAccount":"Account koppelen","email":"E-mailadres","send":"Verificatielink versturen","subtitle":"Log in met het e-mailadres dat aan je Homerr / Vinted Go-zendingen is gekoppeld.","tokenLabel":"Verificatielink / token","verifyIntro":"Open de verificatiemail en plak hieronder de volledige link of het token."},"de":{"connectAccount":"Konto verbinden","email":"E-Mail-Adresse","send":"Bestätigungslink senden","subtitle":"Melde dich mit der E-Mail-Adresse an, die mit deinen Homerr- / Vinted-Go-Sendungen verknüpft ist.","tokenLabel":"Bestätigungslink / Token","verifyIntro":"Öffne die Bestätigungs-E-Mail und füge unten den vollständigen Link oder das Token ein."},"fr":{"connectAccount":"Connecter le compte","email":"Adresse e-mail","send":"Envoyer le lien de vérification","subtitle":"Connectez-vous avec l’adresse e-mail liée à vos envois Homerr / Vinted Go.","tokenLabel":"Lien de vérification / jeton","verifyIntro":"Ouvrez l’e-mail de vérification et collez ci-dessous le lien complet ou le jeton."},"it":{"connectAccount":"Collega account","email":"Indirizzo e-mail","send":"Invia link di verifica","subtitle":"Accedi con l’indirizzo e-mail collegato alle tue spedizioni Homerr / Vinted Go.","tokenLabel":"Link di verifica / token","verifyIntro":"Apri l’e-mail di verifica e incolla qui sotto il link completo o il token."},"sv":{"connectAccount":"Anslut konto","email":"E-postadress","send":"Skicka verifieringslänk","subtitle":"Logga in med e-postadressen som är kopplad till dina Homerr / Vinted Go-försändelser.","tokenLabel":"Verifieringslänk / token","verifyIntro":"Öppna verifieringsmejlet och klistra in hela länken eller token nedan."},"no":{"connectAccount":"Koble til konto","email":"E-postadresse","send":"Send bekreftelseslenke","subtitle":"Logg inn med e-postadressen som er knyttet til Homerr / Vinted Go-forsendelsene dine.","tokenLabel":"Bekreftelseslenke / token","verifyIntro":"Åpne bekreftelses-e-posten og lim inn hele lenken eller tokenet nedenfor."},"es":{"connectAccount":"Conectar cuenta","email":"Correo electrónico","send":"Enviar enlace de verificación","subtitle":"Inicia sesión con el correo electrónico vinculado a tus envíos de Homerr / Vinted Go.","tokenLabel":"Enlace de verificación / token","verifyIntro":"Abre el correo de verificación y pega abajo el enlace completo o el token."},"da":{"connectAccount":"Forbind konto","email":"E-mailadresse","send":"Send bekræftelseslink","subtitle":"Log ind med den e-mailadresse, der er knyttet til dine Homerr / Vinted Go-forsendelser.","tokenLabel":"Bekræftelseslink / token","verifyIntro":"Åbn bekræftelsesmailen, og indsæt hele linket eller tokenet nedenfor."},"ru":{"connectAccount":"Подключить аккаунт","email":"Адрес электронной почты","send":"Отправить ссылку для подтверждения","subtitle":"Войдите с адресом электронной почты, связанным с вашими отправлениями Homerr / Vinted Go.","tokenLabel":"Ссылка для подтверждения / токен","verifyIntro":"Откройте письмо с подтверждением и вставьте ниже полную ссылку или токен."},"pl":{"connectAccount":"Połącz konto","email":"Adres e-mail","send":"Wyślij link weryfikacyjny","subtitle":"Zaloguj się adresem e-mail powiązanym z przesyłkami Homerr / Vinted Go.","tokenLabel":"Link weryfikacyjny / token","verifyIntro":"Otwórz e-mail weryfikacyjny i wklej poniżej pełny link lub token."},"ko":{"connectAccount":"계정 연결","email":"이메일 주소","send":"인증 링크 보내기","subtitle":"Homerr / Vinted Go 배송에 연결된 이메일 주소로 로그인하세요.","tokenLabel":"인증 링크 / 토큰","verifyIntro":"인증 이메일을 열고 전체 링크 또는 토큰을 아래에 붙여 넣으세요."},"ar":{"connectAccount":"ربط الحساب","email":"عنوان البريد الإلكتروني","send":"إرسال رابط التحقق","subtitle":"سجّل الدخول باستخدام عنوان البريد الإلكتروني المرتبط بشحنات Homerr / Vinted Go.","tokenLabel":"رابط التحقق / الرمز","verifyIntro":"افتح رسالة التحقق والصق الرابط الكامل أو الرمز أدناه."}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
send.onclick=async()=>{send.disabled=true;try{await Homey.emit('start_login',{email:email.value.trim()});a.classList.add('hidden');b.classList.remove('hidden')}catch(e){Homey.alert(e.message||String(e));send.disabled=false}};
finish.onclick=async()=>{finish.disabled=true;try{const r=await Homey.emit('finish_login',{token:token.value.trim()});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));finish.disabled=false}};
</script></body></html>
