<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>

const I18N={"en":{"app":"Post & DHL app login (works from any country)","appHint":"Open the DHL login, sign in, and after the redirect copy the complete address from the address bar back into this screen.","callbackAddress":"Address after signing in","checking":"Checking…","connect":"Connect","dhlde":"DHL.de login (only from Germany)","dhldeHint":"DHL only answers this login from a German internet connection. Open the login, sign in, then copy the dhllogin://… address (browser developer tools → Network) and paste it here.","emptyCb":"Paste the address you got after signing in first.","open":"Open DHL login","openDe":"Open DHL.de login","subtitle":"Choose how to sign in. Both show your DHL parcels with live status, Packstation pickups and sent parcels."},"nl":{"app":"Post & DHL-app-login (werkt vanuit elk land)","appHint":"Open de DHL-login, log in en kopieer na de doorverwijzing het volledige adres uit de adresbalk terug naar dit scherm.","callbackAddress":"Adres na het inloggen","checking":"Controleren…","connect":"Koppelen","dhlde":"DHL.de-login (alleen vanuit Duitsland)","dhldeHint":"DHL beantwoordt deze login alleen vanaf een Duitse internetverbinding. Open de login, log in en kopieer daarna het dhllogin://…-adres (ontwikkelaarstools van de browser → Netwerk) en plak het hier.","emptyCb":"Plak eerst het adres dat je na het inloggen kreeg.","open":"DHL-login openen","openDe":"DHL.de-login openen","subtitle":"Kies hoe je inlogt. Beide tonen je DHL-pakketten met live status, Packstation-ophalingen en verzonden pakketten."},"de":{"app":"Anmeldung wie in der Post & DHL App (funktioniert aus jedem Land)","appHint":"Öffne die DHL-Anmeldung, melde dich an und kopiere nach der Weiterleitung die vollständige Adresse aus der Adresszeile zurück in dieses Fenster.","callbackAddress":"Adresse nach der Anmeldung","checking":"Wird geprüft…","connect":"Verbinden","dhlde":"DHL.de-Anmeldung (nur aus Deutschland)","dhldeHint":"DHL beantwortet diese Anmeldung nur über eine deutsche Internetverbindung. Öffne die Anmeldung, melde dich an, kopiere dann die dhllogin://…-Adresse (Entwicklertools des Browsers → Netzwerk) und füge sie hier ein.","emptyCb":"Füge zuerst die Adresse ein, die du nach der Anmeldung erhalten hast.","open":"DHL-Anmeldung öffnen","openDe":"DHL.de-Anmeldung öffnen","subtitle":"Wähle die Anmeldung. Beide zeigen deine DHL-Pakete mit Live-Status, Packstation-Abholungen und versendeten Paketen."},"fr":{"app":"Connexion de l’app Post & DHL (fonctionne depuis tous les pays)","appHint":"Ouvrez la connexion DHL, connectez-vous, puis après la redirection copiez l’adresse complète de la barre d’adresse dans cet écran.","callbackAddress":"Adresse après la connexion","checking":"Vérification…","connect":"Connecter","dhlde":"Connexion DHL.de (depuis l’Allemagne uniquement)","dhldeHint":"DHL ne répond à cette connexion que depuis une connexion Internet allemande. Ouvrez la connexion, connectez-vous, puis copiez l’adresse dhllogin://… (outils de développement du navigateur → Réseau) et collez-la ici.","emptyCb":"Collez d’abord l’adresse obtenue après la connexion.","open":"Ouvrir la connexion DHL","openDe":"Ouvrir la connexion DHL.de","subtitle":"Choisissez le mode de connexion. Les deux affichent vos colis DHL avec leur statut en direct, les retraits en Packstation et les colis envoyés."},"it":{"app":"Accesso dell’app Post & DHL (funziona da qualsiasi paese)","appHint":"Apri l’accesso DHL, accedi e dopo il reindirizzamento copia l’indirizzo completo dalla barra degli indirizzi in questa schermata.","callbackAddress":"Indirizzo dopo l’accesso","checking":"Verifica in corso…","connect":"Collega","dhlde":"Accesso DHL.de (solo dalla Germania)","dhldeHint":"DHL risponde a questo accesso solo da una connessione Internet tedesca. Apri l’accesso, accedi, poi copia l’indirizzo dhllogin://… (strumenti per sviluppatori del browser → Rete) e incollalo qui.","emptyCb":"Incolla prima l’indirizzo ottenuto dopo l’accesso.","open":"Apri l’accesso DHL","ope e la barra de direcciones en esta pantalla.","callbackAddress":"Dirección tras iniciar sesión","checking":"Comprobando…","connect":"Conectar","dhlde":"Inicio de sesión de DHL.de (solo desde Alemania)","dhldeHint":"DHL solo responde a este inicio de sesión desde una conexión a Internet alemana. Abre el inicio de sesión, entra y copia la dirección dhllogin://… (herramientas para desarrolladores del navegador → Red) y pégala aquí.","emptyCb":"Pega primero la dirección que obtuviste tras iniciar sesión.","open":"Abrir el inicio de sesión de DHL","openDe":"Abrir el inicio de sesión de DHL.de","subtitle":"Elige cómo iniciar sesión. Ambas opciones muestran tus paquetes DHL con estado en directo, recogidas en Packstation y paquetes enviados."},"da":{"app":"Login via Post & DHL-appen (virker fra alle lande)","appHint":"Åbn DHL-login, log ind, og kopiér efter omdirigeringen hele adressen fra adresselinjen tilbage til denne skærm.","callbackAddress":"Adresse efter login","checking":"Kontrollerer…","connect":"Forbind","dhlde":"DHL.de-login (kun fra Tyskland)","dhldeHint":"DHL svarer kun på dette login fra en tysk internetforbindelse. Åbn login, log ind, kopiér derefter adressen dhllogin://… (browserens udviklerværktøjer → Netværk), og indsæt den her.","emptyCb":"Indsæt først den adresse, du fik efter login.","open":"Åbn DHL-login","openDe":"Åbn DHL.de-login","subtitle":"Vælg, hvordan du logger ind. Begge viser dine DHL-pakker med livestatus, Packstation-afhentninger og sendte pakker."},"ru":{"app":"Вход как в приложении Post & DHL (работает из любой страны)","appHint":"Откройте вход DHL, войдите и после перенаправления скопируйте полный адрес из адресной строки на этот экран.","callbackAddress":"Адрес после входа","checking":"Проверка…","connect":"Подключить","dhlde":"Вход через DHL.de (только из Германии)","dhldeHint":"DHL отвечает на этот вход только при немецком интернет-подключении. Откройте вход, войдите, затем скопируйте адрес dhllogin://… (инструменты разработчика браузера → Сеть) и вставьте его сюда.","emptyCb":"Сначала вставьте адрес, полученный после входа.","open":"Открыть вход DHL","openDe":"Открыть вход DHL.de","subtitle":"Выберите способ входа. Оба показывают ваши посылки DHL со статусом в реальном времени, получения в Packstation и отправленные посылки."},"pl":{"app":"Logowanie aplikacji Post & DHL (działa z każdego kraju)","appHint":"Otwórz logowanie DHL, zaloguj się, a po przekierowaniu skopiuj pełny adres z paska adresu z powrotem do tego ekranu.","callbackAddress":"Adres po zalogowaniu","checking":"Sprawdzanie…","connect":"Połącz","dhlde":"Logowanie DHL.de (tylko z Niemiec)","dhldeHint":"DHL odpowiada na to logowanie tylko z niemieckiego połączenia internetowego. Otwórz logowanie, zaloguj się, a następnie skopiuj adres dhllogin://… (narzędzia deweloperskie przeglądarki → Sieć) i wklej go tutaj.","emptyCb":"Najpierw wklej adres otrzymany po zalogowaniu.","open":"Otwórz logowanie DHL","openDe":"Otwórz logowanie DHL.de","subtitle":"Wybierz sposób logowania. Oba pokazują paczki DHL ze statusem na żywo, odbiory z Packstation i wysłane paczki."},"ko":{"app":"Post & DHL 앱 로그인 (모든 국가에서 사용 가능)","appHint":"DHL 로그인을 열고 로그인한 뒤, 리디렉션 후 주소창의 전체 주소를 복사해 이 화면에 붙여 넣으세요.","callbackAddress":"로그인 후 주소","checking":"확인 중…","connect":"연결","dhlde":"DHL.de 로그인 (독일에서만 가능)","dhldeHint":"DHL은 독일 인터넷 연결에서만 이 로그인에 응답합니다. 로그인을 열어 로그인한 뒤 dhllogin://… 주소(브라우저 개발자 도구 → 네트워크)를 복사해 여기에 붙여 넣으세요.","emptyCb":"먼저 로그인 후 받은 주소를 붙여 넣으세요.","open":"DHL 로그인 열기","openDe":"DHL.de 로그인 열기","subtitle":"로그인 방법을 선택하세요. 두 방법 모두 DHL 택배의 실시간 상태, Packstation 수령, 발송한 택배를 보여 줍니다."},"ar":{"app":"تسجيل الدخول عبر تطبيق Post & DHL (يعمل من أي دولة)","appHint":"افتح تسجيل الدخول إلى DHL وسجّل الدخول، وبعد إعادة التوجيه انسخ العنوان الكامل من شريط العنوان والصقه في هذه الشاشة.","callbackAddress":"العنوان بعد تسجيل الدخول","checking":"جارٍ التحقق…","connect":"ربط","dhlde":"تسجيل الدخول عبر DHL.de (من ألمانيا فقط)","dhldeHint":"لا تستجيب DHL لتسجيل الدخول هذا إلا من اتصال إنترنت ألماني. افتح تسجيل الدخول وسجّل الدخول، ثم انسخ العنوان ⁦dhllogin://…⁩ (أدوات المطوّر في المتصفح ← الشبكة) والصقه هنا.","emptyCb":"الصق أولًا العنوان الذي حصلت عليه بعد تسجيل الدخول.","open":"فتح تسجيل الدخول إلى DHL","openDe":"فتح تسجيل الدخول عبر DHL.de","subtitle":"اختر طريقة تسجيل الدخول. كلتاهما تعرضان طرود DHL بحالتها المباشرة واستلامات Packstation والطرود المرسلة."}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
const openBtn=document.getElementById('open');
async function openUrl(event){try{const r=await Homey.emit(event);Homey.openURL?Homey.openURL(r.url):window.open(r.url,'_blank')}catch(e){Homey.alert(e&&e.message||String(e))}}
openBtn.onclick=()=>openUrl('get_auth_url');openDe.onclick=()=>openUrl('get_dhlde_url');
async function run(btn,event,data){btn.disabled=true;statusEl.textContent=t('checking');try{const r=await Homey.emit(event,data);Homey.done()}catch(e){statusEl.textContent='';Homey.alert(e&&e.message||String(e))}finally{btn.disabled=false}}
go.onclick=()=>{if(!cb.value.trim())return Homey.alert(t('emptyCb'));run(go,'repair',{callback:cb.value})};
goDe.onclick=()=>{if(!cbDe.value.trim())return Homey.alert(t('emptyCb'));run(goDe,'login_dhlde',{redirect:cbDe.value})};
</script></body></html>
