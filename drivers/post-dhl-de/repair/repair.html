<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:200px;height:auto;max-height:84px;object-fit:contain}.hint{opacity:.72;font-size:12px;line-height:1.45;margin:4px 0 10px}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px}.or{margin:18px 0 6px;font-weight:700}</style></head><body><div class="logo"><img src="../../../assets/dhl-logo.svg" alt="DHL"></div><h1 class="homey-title">Post &amp; DHL Germany</h1><p class="homey-subtitle" data-t="subtitle"></p>
<p class="or" data-t="app"></p><p class="hint" data-t="appHint"></p>
<button id="open" class="homey-button-secondary-full" data-t="open"></button>
<div class="homey-form-group"><input id="cb" class="homey-form-input" placeholder="https://app.dhl.de/android-dhl-parcel#state=…&amp;code=…"></div>
<button id="go" class="homey-button-primary-full" data-t="connect"></button>
<details class="box"><summary data-t="dhlde"></summary><p class="hint" data-t="dhldeHint"></p>
<button id="openDe" class="homey-button-secondary-full" data-t="openDe"></button>
<div class="homey-form-group"><input id="cbDe" class="homey-form-input" placeholder="dhllogin://de.deutschepost.dhl/login?code=…"></div>

<button id="goDe" class="homey-button-primary-full" data-t="connect"></button></details><div id="status" class="status"></div><script>const I18N={"en": {"subtitle": "Choose how to sign in. Both show your DHL Paket parcels with live status, Packstation pickups and sent parcels.", "app": "Post & DHL app login (works from any country)", "appHint": "Open the DHL login, sign in, and copy the complete address from the address bar after the redirect back into this screen.", "open": "Open DHL login", "connect": "Connect", "dhlde": "DHL.de login (like Home Assistant, only from Germany)", "dhldeHint": "DHL only answers this login from a German internet connection. Open the login, sign in, then copy the dhllogin://… address (browser developer tools → Network) and paste it here.", "openDe": "Open DHL.de login", "tracking": "Extra tracking numbers (optional)", "checking": "Checking…", "emptyCb": "Paste the address after signing in first."}, "nl": {"subtitle": "Kies hoe je inlogt. Beide tonen je DHL Paket-pakketten met live status, Packstation-ophalingen en verzonden pakketten.", "app": "Post & DHL-app-login (werkt vanuit elk land)", "appHint": "Open de DHL-login, log in en kopieer na de redirect het volledige adres uit de adresbalk terug naar dit scherm.", "open": "DHL-login openen", "connect": "Koppelen", "dhlde": "DHL.de-login (zoals Home Assistant, alleen vanuit Duitsland)", "dhldeHint": "DHL beantwoordt deze login alleen vanaf een Duitse internetverbinding. Open de login, log in en kopieer daarna het dhllogin://…-adres (ontwikkelaarstools van de browser → Netwerk) en plak het hier.", "openDe": "DHL.de-login openen", "tracking": "Extra trackingnummers (optioneel)", "checking": "Controleren…", "emptyCb": "Plak eerst het adres na het inloggen."}, "de": {"subtitle": "Wähle die Anmeldung. Beide zeigen deine DHL-Pakete mit Live-Status, Packstation-Abholungen und versendeten Paketen.", "app": "Post & DHL App-Anmeldung (funktioniert aus jedem Land)", "appHint": "Öffne die DHL-Anmeldung, melde dich an und kopiere nach der Weiterleitung die vollständige Adresse aus der Adresszeile hierher.", "open": "DHL-Anmeldung öffnen", "connect": "Verbinden", "dhlde": "DHL.de-Anmeldung (wie Home Assistant, nur aus Deutschland)", "dhldeHint": "DHL beantwortet diese Anmeldung nur über eine deutsche Internetverbindung. Melde dich an und kopiere dann die dhllogin://…-Adresse (Entwicklertools → Netzwerk) hierher.", "openDe": "DHL.de-Anmeldung öffnen", "tracking": "Zusätzliche Sendungsnummern (optional)", "checking": "Wird geprüft…", "emptyCb": "Füge zuerst die Adresse nach der Anmeldung ein."}, "fr": {"app": "Connexion appli Post & DHL (depuis tout pays)", "open": "Ouvrir la connexion DHL", "connect": "Connecter", "dhlde": "Connexion DHL.de (depuis l’Allemagne uniquement)", "openDe": "Ouvrir la connexion DHL.de"}};function lang(){const l=String(navigator.language||'en').toLowerCase().split('-')[0];return I18N[l]?l:'en'}const L=lang(),T=Object.assign({},I18N.en,I18N[L]);document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(el.placeholder!==undefined&&el.tagName!=='BUTTON'&&el.hasAttribute('data-ph'))el.placeholder=T[k];else el.textContent=T[k]});async function openUrl(event){try{const r=await Homey.emit(event);Homey.openURL?Homey.openURL(r.url):window.open(r.url,'_blank')}catch(e){Homey.alert(e&&e.message||String(e))}}open.onclick=()=>openUrl('get_auth_url');openDe.onclick=()=>openUrl('get_dhlde_url');async function run(btn,event,data){btn.disabled=true;status.textContent=T.checking||'';try{const r=await Homey.emit(event,data);Homey.done()}catch(e){status.textContent='';Homey.alert(e&&e.message||String(e))}finally{btn.disabled=false}}go.onclick=()=>{if(!cb.value.trim())return Homey.alert(T.emptyCb);run(go,'repair',{callback:cb.value})};goDe.onclick=()=>{if(!cbDe.value.trim())return Homey.alert(T.emptyCb);run(goDe,'login_dhlde',{redirect:cbDe.value})};</script></body></html>
