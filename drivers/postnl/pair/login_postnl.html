<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/icon.svg" alt="PostNL" style="width:92px;height:92px"></div><h1 class="homey-title" data-t="title"></h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="username" autocapitalize="none" dir="ltr"></div>
<div class="homey-form-group"><label class="homey-form-label" for="password" data-t="password"></label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div>
<button id="connect" class="homey-button-primary-full" type="button" data-t="connect"></button><p class="hint" data-t="hint" style="margin-top:12px"></p>
<script>
const I18N={"en":{"connect":"Connect","email":"E-mail address","emptyLogin":"Enter your e-mail address and password.","hint":"Your password is only used to sign in to PostNL. Homey then stores the resulting tokens, not your password.","password":"Password","subtitle":"Sign in directly with the same credentials you use on jouw.postnl.nl.","title":"Connect PostNL account"},"nl":{"connect":"Koppelen","email":"E-mailadres","emptyLogin":"Vul je e-mailadres en wachtwoord in.","hint":"Je wachtwoord wordt alleen gebruikt om bij PostNL in te loggen. Homey bewaart daarna de verkregen tokens, niet je wachtwoord.","password":"Wachtwoord","subtitle":"Log rechtstreeks in met dezelfde gegevens als op jouw.postnl.nl.","title":"PostNL-account koppelen"},"de":{"connect":"Verbinden","email":"E-Mail-Adresse","emptyLogin":"Gib deine E-Mail-Adresse und dein Passwort ein.","hint":"Dein Passwort wird nur für die Anmeldung bei PostNL verwendet. Homey speichert danach die erhaltenen Tokens, nicht dein Passwort.","password":"Passwort","subtitle":"Melde dich direkt mit denselben Zugangsdaten an wie auf jouw.postnl.nl.","title":"PostNL-Konto verbinden"},"fr":{"connect":"Connecter","email":"Adresse e-mail","emptyLogin":"Saisissez votre adresse e-mail et votre mot de passe.","hint":"Votre mot de passe sert uniquement à vous connecter à PostNL. Homey conserve ensuite les jetons obtenus, pas votre mot de passe.","password":"Mot de passe","subtitle":"Connectez-vous directement avec les mêmes identifiants que sur jouw.postnl.nl.","title":"Connecter le compte PostNL"},"it":{"connect":"Collega","email":"Indirizzo e-mail","emptyLogin":"Inserisci indirizzo e-mail e password.","hint":"La password serve solo per accedere a PostNL. Homey conserva poi i token ottenuti, non la password.","password":"Password","subtitle":"Accedi direttamente con le stesse credenziali che usi su jouw.postnl.nl.","title":"Collega account PostNL"},"sv":{"connect":"Anslut","email":"E-postadress","emptyLogin":"Ange din e-postadress och ditt lösenord.","hint":"Ditt lösenord används bara för att logga in hos PostNL. Homey sparar sedan de erhållna token, inte ditt lösenord.","password":"Lösenord","subtitle":"Logga in direkt med samma uppgifter som du använder på jouw.postnl.nl.","title":"Anslut PostNL-konto"},"no":{"connect":"Koble til","email":"E-postadresse","emptyLogin":"Skriv inn e-postadressen og passordet ditt.","hint":"Passordet brukes bare til å logge inn hos PostNL. Homey lagrer deretter tokenene, ikke passordet ditt.","password":"Passord","subtitle":"Logg inn direkte med den samme påloggingen som du bruker på jouw.postnl.nl.","title":"Koble til PostNL-konto"},"es":{"connect":"Conectar","email":"Correo electrónico","emptyLogin":"Introduce tu correo electrónico y contraseña.","hint":"Tu contraseña solo se usa para iniciar sesión en PostNL. Después Homey guarda los tokens obtenidos, no tu contraseña.","password":"Contraseña","subtitle":"Inicia sesión directamente con las mismas credenciales que usas en jouw.postnl.nl.","title":"Conectar cuenta de PostNL"},"da":{"connect":"Forbind","email":"E-mailadresse","emptyLogin":"Indtast din e-mailadresse og adgangskode.","hint":"Din adgangskode bruges kun til at logge ind hos PostNL. Homey gemmer derefter de modtagne tokens, ikke din adgangskode.","password":"Adgangskode","subtitle":"Log ind direkte med de samme loginoplysninger, som du bruger på jouw.postnl.nl.","title":"Forbind PostNL-konto"},"ru":{"connect":"Подключить","email":"Адрес электронной почты","emptyLogin":"Введите адрес электронной почты и пароль.","hint":"Пароль используется только для входа в PostNL. Затем Homey хранит полученные токены, а не ваш пароль.","password":"Пароль","subtitle":"Войдите напрямую с теми же данными, что и на jouw.postnl.nl.","title":"Подключить аккаунт PostNL"},"pl":{"connect":"Połącz","email":"Adres e-mail","emptyLogin":"Wpisz adres e-mail i hasło.","hint":"Hasło służy tylko do zalogowania się w PostNL. Homey przechowuje potem otrzymane tokeny, a nie hasło.","password":"Hasło","subtitle":"Zaloguj się bezpośrednio tymi samymi danymi co na jouw.postnl.nl.","title":"Połącz konto PostNL"},"ko":{"connect":"연결","email":"이메일 주소","emptyLogin":"이메일 주소와 비밀번호를 입력하세요.","hint":"비밀번호는 PostNL 로그인에만 사용됩니다. 이후 Homey는 비밀번호가 아니라 발급된 토큰을 저장합니다.","password":"비밀번호","subtitle":"jouw.postnl.nl에서 사용하는 것과 같은 계정 정보로 바로 로그인하세요.","title":"PostNL 계정 연결"},"ar":{"connect":"ربط","email":"عنوان البريد الإلكتروني","emptyLogin":"أدخل عنوان بريدك الإلكتروني وكلمة المرور.","hint":"تُستخدم كلمة المرور فقط لتسجيل الدخول إلى PostNL. بعد ذلك يحتفظ Homey بالرموز التي تم الحصول عليها، وليس بكلمة المرور.","password":"كلمة المرور","subtitle":"سجّل الدخول مباشرةً ببيانات الاعتماد نفسها التي تستخدمها على jouw.postnl.nl.","title":"ربط حساب PostNL"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const $=id=>document.getElementById(id);
$('connect').addEventListener('click',async()=>{const username=$('email').value.trim(),password=$('password').value;if(!username||!password){Homey.alert(t('emptyLogin'));return;}$('connect').disabled=true;try{const result=await Homey.emit('login_credentials',{username,password});await Homey.createDevice(result.device);Homey.done();}catch(e){Homey.alert(e.message||String(e));$('connect').disabled=false;}});
</script></body></html>
