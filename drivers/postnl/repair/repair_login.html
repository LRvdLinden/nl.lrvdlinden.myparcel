<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{padding:0 4px 24px}
    .logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 22px}
    .logo img{display:block;width:auto;max-width:190px;height:auto;max-height:82px;object-fit:contain;object-position:center}
    .hint{opacity:.68;font-size:12px;line-height:1.45;margin-top:12px}
    .status{min-height:18px;font-size:12px;margin:10px 0;opacity:.78;text-align:center}
    :dir(rtl){direction:rtl;text-align:right}
  </style>
</head>
<body>
  <div class="logo"><img src="../../../assets/postnl-logo.svg" alt="PostNL"></div>
  <h1 class="homey-title" id="title">PostNL opnieuw koppelen</h1>
  <p class="homey-subtitle" id="subtitle">Log opnieuw in met je PostNL e-mailadres en wachtwoord.</p>

  <div class="homey-form-group">
    <label class="homey-form-label" id="emailLabel" for="username">E-mailadres</label>
    <input id="username" class="homey-form-input" type="email" autocomplete="username" autocapitalize="none" spellcheck="false">
  </div>

  <div class="homey-form-group">
    <label class="homey-form-label" id="passwordLabel" for="password">Wachtwoord</label>
    <input id="password" class="homey-form-input" type="password" autocomplete="current-password">
  </div>

  <button id="connect" class="homey-button-primary-full" type="button">Opnieuw koppelen</button>
  <div id="status" class="status"></div>
  <p class="hint" id="hint">Na succesvolle aanmelding worden de tokens en accountgegevens op dit bestaande PostNL-device vernieuwd. Er wordt geen nieuw device aangemaakt.</p>

<script>
const language=(Homey.__('pair.language_marker')||'nl').toLowerCase();
const isNl=language==='nl';
const $=id=>document.getElementById(id);

if(!isNl){
  $('title').textContent='Reconnect PostNL';
  $('subtitle').textContent='Sign in again with your PostNL email address and password.';
  $('emailLabel').textContent='Email address';
  $('passwordLabel').textContent='Password';
  $('connect').textContent='Reconnect account';
  $('hint').textContent='After a successful sign-in, the tokens and account credentials on this existing PostNL device are renewed. No new device is created.';
}

$('connect').addEventListener('click',async()=>{
  const username=$('username').value.trim();
  const password=$('password').value;
  if(!username||!password){
    Homey.alert(isNl?'Vul je e-mailadres en wachtwoord in.':'Enter your email address and password.');
    return;
  }
  $('connect').disabled=true;
  $('status').textContent=isNl?'Opnieuw inloggen bij PostNL…':'Signing in to PostNL again…';
  try{
    await Homey.emit('login_postnl',{username,password});
    $('status').textContent=isNl?'PostNL opnieuw gekoppeld.':'PostNL reconnected.';
    Homey.done();
  }catch(error){
    $('status').textContent='';
    Homey.alert(error?.message||String(error));
    $('connect').disabled=false;
  }
});
</script>
</body>
</html>
