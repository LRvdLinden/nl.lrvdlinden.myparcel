<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/trunkrs-logo.png" alt="Trunkrs"></div><h1 class="homey-title">Trunkrs</h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="postcode" data-t="postcode"></label><input id="postcode" class="homey-form-input" autocomplete="postal-code" autocapitalize="characters" placeholder="1234AB" dir="ltr"><p class="note" data-t="postcodeHint"></p></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-textarea" rows="4" placeholder="419719666&#10;419719667 1234AB" dir="ltr"></textarea><p class="note" data-t="trackingHint"></p></div>
<button id="go" class="homey-button-primary-full" data-t="add"></button><div id="status" class="status" role="status"></div>
<script>
const I18N={"en":{"add":"Add Trunkrs","checking":"Checking…","emptyPostcode":"Enter the delivery postcode.","postcode":"Delivery postcode","postcodeHint":"Required: Trunkrs only shows a parcel together with the Dutch delivery postcode, e.g. 1234AB.","subtitle":"Follow Trunkrs parcels with their number and the delivery postcode – no account needed.","tracking":"Trunkrs numbers (optional)","trackingHint":"One per line. For a parcel delivered to another address, add its postcode after the number: 419719666 1234AB. You can also add numbers later in the device settings or with a Flow."},"nl":{"add":"Trunkrs toevoegen","checking":"Controleren…","emptyPostcode":"Vul de postcode van het bezorgadres in.","postcode":"Postcode van het bezorgadres","postcodeHint":"Verplicht: Trunkrs toont een pakket alleen samen met de Nederlandse postcode van het bezorgadres, bijv. 1234AB.","subtitle":"Volg Trunkrs-pakketten met hun nummer en de postcode van het bezorgadres – geen account nodig.","tracking":"Trunkrs-nummers (optioneel)","trackingHint":"Eén per regel. Voor een pakket naar een ander adres zet je de postcode achter het nummer: 419719666 1234AB. Nummers toevoegen kan ook later via de apparaatinstellingen of met een Flow."},"de":{"add":"Trunkrs hinzufügen","checking":"Wird geprüft…","emptyPostcode":"Gib die Postleitzahl der Lieferadresse ein.","postcode":"Postleitzahl der Lieferadresse","postcodeHint":"Pflichtfeld: Trunkrs zeigt ein Paket nur zusammen mit der niederländischen Postleitzahl der Lieferadresse, z. B. 1234AB.","subtitle":"Verfolge Trunkrs-Pakete mit Nummer und Postleitzahl der Lieferadresse – ohne Konto.","tracking":"Trunkrs-Nummern (optional)","trackingHint":"Eine pro Zeile. Für ein Paket an eine andere Adresse die Postleitzahl hinter die Nummer setzen: 419719666 1234AB. Nummern kannst du auch später in den Geräteeinstellungen oder per Flow hinzufügen."},"fr":{"add":"Ajouter Trunkrs","checking":"Vérification…","emptyPostcode":"Saisissez le code postal de livraison.","postcode":"Code postal de livraison","postcodeHint":"Obligatoire : Trunkrs n’affiche un colis qu’avec le code postal néerlandais de livraison, p. ex. 1234AB.","subtitle":"Suivez les colis Trunkrs avec leur numéro et le code postal de livraison – sans compte.","tracking":"Numéros Trunkrs (facultatif)","trackingHint":"Un par ligne. Pour un colis livré à une autre adresse, ajoutez son code postal après le numéro : 419719666 1234AB. Vous pourrez aussi ajouter des numéros plus tard dans les réglages de l’appareil ou via un Flow."},"it":{"add":"Aggiungi Trunkrs","checking":"Verifica in corso…","emptyPostcode":"Inserisci il codice postale di consegna.","postcode":"Codice postale di consegna","postcodeHint":"Obbligatorio: Trunkrs mostra un pacco solo insieme al codice postale olandese di consegna, ad es. 1234AB.","subtitle":"Traccia i pacchi Trunkrs con il numero e il codice postale di consegna – senza account.","tracking":"Numeri Trunkrs (facoltativo)","trackingHint":"Uno per riga. Per un pacco consegnato a un altro indirizzo, aggiungi il codice postale dopo il numero: 419719666 1234AB. Puoi aggiungere numeri anche in seguito nelle impostazioni del dispositivo o con un Flow."},"sv":{"add":"Lägg till Trunkrs","checking":"Kontrollerar…","emptyPostcode":"Ange postnumret för leveransen.","postcode":"Postnummer för leveransen","postcodeHint":"Obligatoriskt: Trunkrs visar bara ett paket tillsammans med det nederländska postnumret för leveransen, t.ex. 1234AB.","subtitle":"Spåra Trunkrs-paket med numret och leveransens postnummer – inget konto behövs.","tracking":"Trunkrs-nummer (valfritt)","trackingHint":"Ett per rad. För ett paket till en annan adress, lägg till postnumret efter numret: 419719666 1234AB. Du kan också lägga till nummer senare i enhetsinställningarna eller med ett Flow."},"no":{"add":"Legg til Trunkrs","checking":"Kontrollerer…","emptyPostcode":"Skriv inn postnummeret for leveringen.","postcode":"Postnummer for leveringen","postcodeHint":"Påkrevd: Trunkrs viser bare en pakke sammen med det nederlandske postnummeret for leveringen, f.eks. 1234AB.","subtitle":"Spor Trunkrs-pakker med nummeret og postnummeret for leveringen – ingen konto nødvendig.","tracking":"Trunkrs-numre (valgfritt)","trackingHint":"Ett per linje. For en pakke til en annen adresse legger du postnummeret etter nummeret: 419719666 1234AB. Du kan også legge til numre senere i enhetsinnstillingene eller med en Flow."},"es":{"add":"Añadir Trunkrs","checking":"Comprobando…","emptyPostcode":"Introduce el código postal de entrega.","postcode":"Código postal de entrega","postcodeHint":"Obligatorio: Trunkrs solo muestra un paquete junto con el código postal neerlandés de entrega, p. ej. 1234AB.","subtitle":"Sigue paquetes de Trunkrs con su número y el código postal de entrega, sin cuenta.","tracking":"Números de Trunkrs (opcional)","trackingHint":"Uno por línea. Para un paquete entregado en otra dirección, añade su código postal tras el número: 419719666 1234AB. También puedes añadir números después en los ajustes del dispositivo o con un Flow."},"da":{"add":"Tilføj Trunkrs","checking":"Kontrollerer…","emptyPostcode":"Indtast postnummeret for leveringen.","postcode":"Postnummer for leveringen","postcodeHint":"Påkrævet: Trunkrs viser kun en pakke sammen med det hollandske postnummer for leveringen, f.eks. 1234AB.","subtitle":"Spor Trunkrs-pakker med nummeret og leveringens postnummer – ingen konto nødvendig.","tracking":"Trunkrs-numre (valgfrit)","trackingHint":"Ét pr. linje. For en pakke til en anden adresse tilføjer du postnummeret efter nummeret: 419719666 1234AB. Du kan også tilføje numre senere i enhedsindstillingerne eller med et Flow."},"ru":{"add":"Добавить Trunkrs","checking":"Проверка…","emptyPostcode":"Введите почтовый индекс доставки.","postcode":"Почтовый индекс доставки","postcodeHint":"Обязательно: Trunkrs показывает посылку только вместе с нидерландским почтовым индексом доставки, например 1234AB.","subtitle":"Отслеживайте посылки Trunkrs по номеру и почтовому индексу доставки – без аккаунта.","tracking":"Номера Trunkrs (необязательно)","trackingHint":"По одному в строке. Для посылки на другой адрес укажите индекс после номера: 419719666 1234AB. Номера можно добавить и позже в настройках устройства или с помощью Flow."},"pl":{"add":"Dodaj Trunkrs","checking":"Sprawdzanie…","emptyPostcode":"Wpisz kod pocztowy dostawy.","postcode":"Kod pocztowy dostawy","postcodeHint":"Wymagane: Trunkrs pokazuje paczkę tylko razem z holenderskim kodem pocztowym dostawy, np. 1234AB.","subtitle":"Śledź paczki Trunkrs po numerze i kodzie pocztowym dostawy – bez konta.","tracking":"Numery Trunkrs (opcjonalnie)","trackingHint":"Jeden w wierszu. Dla paczki na inny adres dodaj kod pocztowy po numerze: 419719666 1234AB. Numery możesz dodać także później w ustawieniach urządzenia lub za pomocą Flow."},"ko":{"add":"Trunkrs 추가","checking":"확인 중…","emptyPostcode":"배송지 우편번호를 입력하세요.","postcode":"배송지 우편번호","postcodeHint":"필수: Trunkrs는 네덜란드 배송지 우편번호(예: 1234AB)가 있어야 택배 정보를 보여 줍니다.","subtitle":"번호와 배송지 우편번호로 Trunkrs 택배를 조회하세요. 계정이 필요 없습니다.","tracking":"Trunkrs 번호 (선택 사항)","trackingHint":"한 줄에 하나씩 입력하세요. 다른 주소로 배송되는 택배는 번호 뒤에 우편번호를 추가하세요: 419719666 1234AB. 나중에 기기 설정이나 Flow로 번호를 추가할 수도 있습니다."},"ar":{"add":"إضافة Trunkrs","checking":"جارٍ التحقق…","emptyPostcode":"أدخل الرمز البريدي للتسليم.","postcode":"الرمز البريدي للتسليم","postcodeHint":"مطلوب: لا يعرض Trunkrs الطرد إلا مع الرمز البريدي الهولندي للتسليم، مثل 1234AB.","subtitle":"تتبّع طرود Trunkrs برقمها والرمز البريدي للتسليم – دون حساب.","tracking":"أرقام Trunkrs (اختياري)","trackingHint":"رقم واحد في كل سطر. للطرد المرسل إلى عنوان آخر، أضف رمزه البريدي بعد الرقم: 419719666 1234AB. يمكنك أيضًا إضافة أرقام لاحقًا من إعدادات الجهاز أو باستخدام Flow."}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?(L==='ar'?'\u2068'+v[n]+'\u2069':String(v[n])):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
go.onclick=async()=>{const pc=postcode.value.trim();if(!pc)return Homey.alert(t('emptyPostcode'));go.disabled=true;statusEl.textContent=t('checking');try{const r=await Homey.emit('connect',{trackingCodes:tracking.value,postalCode:pc});await Homey.createDevice(r.device);Homey.done();}catch(e){statusEl.textContent='';Homey.alert(e&&e.message||String(e))}finally{go.disabled=false}};
</script></body></html>
