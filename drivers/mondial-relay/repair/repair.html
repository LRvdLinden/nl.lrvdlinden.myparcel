<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>

const I18N={"en":{"accountNote":"Your account must have signed in at least once on the Mondial Relay website or app ({website}).","callback":"Address after signing in","checking":"Checking…","connectAccount":"Connect account","emptyCb":"Paste the address you ended on after signing in first.","linkReady":"Sign-in link ready.","market":"Account country","newLink":"A new sign-in link is ready. Open the sign-in page again – each link works only once.","open":"Open Mondial Relay sign-in","step1":"1. Open the sign-in page and sign in with your account.","step2":"2. After signing in, the browser ends on an address starting with https://account.inpost-group.com/callback?code=… that does not load. That is expected: copy the full address from the address bar and paste it here.","subtitle":"Sign in with your Mondial Relay / InPost account to see your parcels automatically.","wrongCb":"This is not the address after signing in. It must start with https://account.inpost-group.com/callback?code="},"nl":{"accountNote":"Je account moet minstens één keer zijn ingelogd op de website of in de app van Mondial Relay ({website}).","callback":"Adres na het inloggen","checking":"Controleren…","connectAccount":"Account koppelen","emptyCb":"Plak eerst het adres waarop je na het inloggen uitkwam.","linkReady":"Inloglink klaar.","market":"Land van het account","newLink":"Er staat een nieuwe inloglink klaar. Open de inlogpagina opnieuw – elke link werkt maar één keer.","open":"Mondial Relay-login openen","step1":"1. Open de inlogpagina en log in met je account.","step2":"2. Na het inloggen komt de browser uit op een adres dat begint met https://account.inpost-group.com/callback?code=… en niet laadt. Dat hoort zo: kopieer het volledige adres uit de adresbalk en plak het hier.","subtitle":"Log in met je Mondial Relay- / InPost-account om je pakketten automatisch te zien.","wrongCb":"Dit is niet het adres na het inloggen. Het moet beginnen met https://account.inpost-group.com/callback?code="},"de": pour voir automatiquement vos colis.","wrongCb":"Ce n’est pas l’adresse obtenue après la connexion. Elle doit commencer par https://account.inpost-group.com/callback?code="},"it":{"accountNote":"Il tuo account deve aver effettuato almeno un accesso al sito o all’app di Mondial Relay ({website}).","callback":"Indirizzo dopo l’accesso","checking":"Verifica in corso…","connectAccount":"Collega account","emptyCb":"Incolla prima l’indirizzo su cui sei arrivato dopo l’accesso.","linkReady":"Link di accesso pronto.","market":"Paese dell’account","newLink":"È pronto un nuovo link di accesso. Apri di nuovo la pagina di accesso: ogni link funziona una sola volta.","open":"Apri l’accesso Mondial Relay","step1":"1. Apri la pagina di accesso e accedi con il tuo account.","step2":"2. Dopo l’accesso il browser arriva a un indirizzo che inizia con https://account.inpost-group.com/callback?code=… e non si carica. È normale: copia l’indirizzo completo dalla barra degli indirizzi e incollalo qui.","subtitle":"Accedi con il tuo account Mondial Relay / InPost per vedere automaticamente i tuoi pacchi.","wrongCb":"Questo non è l’indirizzo dopo l’accesso. Deve iniziare con https://account.inpost-group.com/callback?code="},"sv":{"accountNote":"Ditt konto måste ha loggat in minst en gång på Mondial Relays webbplats eller app ({website}).","callback":"Adress efter inloggningen","checking":"Kontrollerar…","connectAccount":"Anslut konto","emptyCb":"Klistra först in adressen du hamnade på efter inloggningen.","linkReady":"Inloggningslänken är klar.","market":"Kontots land","newLink":"En ny inloggningslänk är klar. Öppna inloggningssidan igen – varje länk fungerar bara en gång.","open":"Öppna Mondial Relay-inloggningen","step1":"1. Öppna inloggningssidan och logga in med ditt konto.","step2":"2. Efter inloggningen hamnar webbläsaren på en adress som börjar med https://account.inpost-group.com/callback?code=… och inte laddas. Det är normalt: kopiera hela adressen från adressfältet och klistra in den här.","subtitle":"Logga in med ditt Mondial Relay- / InPost-konto för att automatiskt se dina paket.","wrongCb":"Det här är inte adressen efter inloggningen. Den måste börja med https://account.inpost-group.com/callback?code="},"no":{"accountNote":"Kontoen din må ha logget inn minst én gang på Mondial Relays nettsted eller app ({website}).","callback":"Adresse etter påloggingen","checking":"Kontrollerer…","connectAccount":"Koble til konto","emptyCb":"Lim først inn adressen du havnet på etter påloggingen.","linkReady":"Påloggingslenken er klar.","market":"Kontoens land","newLink":"En ny påloggingslenke er klar. Åpne påloggingssiden på nytt – hver lenke virker bare én gang.","open":"Åpne Mondial Relay-pålogging","step1":"1. Åpne påloggingssiden og logg inn med kontoen din.","step2":"2. Etter påloggingen havner nettleseren på en adresse som starter med https://account.inpost-group.com/callback?code=… og ikke lastes. Det er som forventet: kopier hele adressen fra adresselinjen og lim den inn her.","subtitle":"Logg inn med Mondial Relay- / InPost-kontoen din for å se pakkene dine automatisk.","wrongCb":"Dette er ikke adressen etter påloggingen. Den må starte med https://account.inpost-group.com/callback?code="},"es":{"accountNote":"Tu cuenta debe haber iniciado sesión al menos una vez en la web o la app de Mondial Relay ({website}).","callback":"Dirección tras iniciar sesión","checking":"Comprobando…","connectAccount":"Conectar cuenta","emptyCb":"Pega primero la dirección en la que terminaste tras iniciar sesión.","linkReady":"Enlace de inicio de sesión listo.","market":"País de la cuenta","newLink":"Hay un nuevo enlace de inicio de sesión. Vuelve a abrir la página de inicio de sesión: cada enlace funciona una sola vez.","open":"Abrir el inicio de sesión de Mondial Relay","step1":"1. Abre la página de inicio de sesión y entra con tu cuenta.","step2":"2. Tras iniciar sesión, el navegador termina en una dirección que empieza por https://account.inpost-group.com/callback?code=… y que no carga. Es normal: copia la dirección completa de la barra de direcciones y pégala aquí.","subtitle":"Inicia sesión con tu cuenta de Mondial Relay / InPost para ver tus paquetes automáticamente.","wrongCb":"Esta no es la dirección tras iniciar sesión. Debe empezar por https://account.inpost-group.com/callback?code="},"da":{"accountNote":"Din konto skal have logget ind mindst én gang på Mondial Relays websted eller app ({website}).","callback":"Adresse efter login","checking":"Kontrollerer…","connectAccount":"Forbind konto","emptyCb":"Indsæt først den adresse, du endte på efter login.","linkReady":"Login-linket er klar.","market":"Kontoens land","newLink":"Et nyt login-link er klar. Åbn login-siden igen – hvert link virker kun én gang.","open":"Åbn Mondial Relay-login","step1":"1. Åbn login-siden, og log ind med din konto.","step2":"2. Efter login ender browseren på en adresse, der starter med https://account.inpost-group.com/callback?code=… og ikke indlæses. Det er forventet: kopiér hele adressen fra adresselinjen, og indsæt den her.","subtitle":"Log ind med din Mondial Relay- / InPost-konto for automatisk at se dine pakker.","wrongCb":"Dette er ikke adressen efter login. Den skal starte med https://account.inpost-group.com/callback?code="},"ru":{"accountNote":"Ваш аккаунт должен хотя бы раз войти на сайт или в приложение Mondial Relay ({website}).","callback":"Адрес после входа","checking":"Проверка…","connectAccount":"Подключить аккаунт","emptyCb":"Сначала вставьте адрес, на котором вы оказались после входа.","linkReady":"Ссылка для входа готова.","market":"Страна аккаунта","newLink":"Новая ссылка для входа готова. Откройте страницу входа ещё раз – каждая ссылка работает только один раз.","open":"Открыть вход Mondial Relay","step1":"1. Откройте страницу входа и войдите в свой аккаунт.","step2":"2. После входа браузер откроет адрес, начинающийся с https://account.inpost-group.com/callback?code=…, который не загружается. Так и должно быть: скопируйте полный адрес из адресной строки и вставьте его сюда.","subtitle":"Войдите в аккаунт Mondial Relay / InPost, чтобы автоматически видеть свои посылки.","wrongCb":"Это не адрес после входа. Он должен начинаться с https://account.inpost-group.com/callback?code="},"pl":{"accountNote":"Twoje konto musi choć raz zalogować się na stronie lub w aplikacji Mondial Relay ({website}).","callback":"Adres po zalogowaniu","checking":"Sprawdzanie…","connectAccount":"Połącz konto","emptyCb":"Najpierw wklej adres, na którym znalazłeś się po zalogowaniu.","linkReady":"Link logowania gotowy.","market":"Kraj konta","newLink":"Nowy link logowania jest gotowy. Otwórz stronę logowania ponownie – każdy link działa tylko raz.","open":"Otwórz logowanie Mondial Relay","step1":"1. Otwórz stronę logowania i zaloguj się na swoje konto.","step2":"2. Po zalogowaniu przeglądarka trafi na adres zaczynający się od https://account.inpost-group.com/callback?code=…, który się nie wczytuje. To normalne: skopiuj pełny adres z paska adresu i wklej go tutaj.","subtitle":"Zaloguj się kontem Mondial Relay / InPost, aby automatycznie widzieć swoje paczki.","wrongCb":"To nie jest adres po zalogowaniu. Musi zaczynać się od https://account.inpost-group.com/callback?code="},"ko":{"accountNote":"계정이 Mondial Relay 웹사이트나 앱({website})에 한 번 이상 로그인한 적이 있어야 합니다.","callback":"로그인 후 주소","checking":"확인 중…","connectAccount":"계정 연결","emptyCb":"먼저 로그인 후 도착한 페이지의 주소를 붙여 넣으세요.","linkReady":"로그인 링크가 준비되었습니다.","market":"계정 국가","newLink":"새 로그인 링크가 준비되었습니다. 로그인 페이지를 다시 여세요. 각 링크는 한 번만 사용할 수 있습니다.","open":"Mondial Relay 로그인 열기","step1":"1. 로그인 페이지를 열고 계정으로 로그인하세요.","step2":"2. 로그인 후 브라우저가 https://account.inpost-group.com/callback?code=…로 시작하는 주소로 이동하며 페이지가 열리지 않습니다. 정상입니다. 주소창의 전체 주소를 복사해 여기에 붙여 넣으세요.","subtitle":"Mondial Relay / InPost 계정으로 로그인하면 택배가 자동으로 표시됩니다.","wrongCb":"로그인 후 주소가 아닙니다. 주소는 https://account.inpost-group.com/callback?code=로 시작해야 합니다."},"ar":{"accountNote":"يجب أن يكون حسابك قد سجّل الدخول مرة واحدة على الأقل في موقع Mondial Relay أو تطبيقه ({website}).","callback":"العنوان بعد تسجيل الدخول","checking":"جارٍ التحقق…","connectAccount":"ربط الحساب","emptyCb":"الصق أولًا العنوان الذي وصلت إليه بعد تسجيل الدخول.","linkReady":"رابط تسجيل الدخول جاهز.","market":"دولة الحساب","newLink":"رابط تسجيل دخول جديد جاهز. افتح صفحة تسجيل الدخول مرة أخرى – كل رابط يعمل مرة واحدة فقط.","open":"فتح تسجيل الدخول إلى Mondial Relay","step1":"1. افتح صفحة تسجيل الدخول وسجّل الدخول بحسابك.","step2":"2. بعد تسجيل الدخول ينتهي المتصفح على عنوان يبدأ بـ ⁦https://account.inpost-group.com/callback?code=…⁩ لا يتم تحميله. هذا متوقع: انسخ العنوان الكامل من شريط العنوان والصقه هنا.","subtitle":"سجّل الدخول بحساب Mondial Relay / InPost لعرض طرودك تلقائيًا.","wrongCb":"هذا ليس العنوان بعد تسجيل الدخول. يجب أن يبدأ بـ ⁦https://account.inpost-group.com/callback?code=⁩"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?(L==='ar'?'\u2068'+v[n]+'\u2069':String(v[n])):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
const openBtn=document.getElementById('open');
function openLink(url){if(!url)return;try{if(Homey.openURL)return Homey.openURL(url)}catch(_){}window.open(url,'_blank')}
const DEFAULT_MARKET={nl:'NL',fr:'FR',es:'ES'};
market.value=DEFAULT_MARKET[L]||'FR';let firstLogin=true;
let link=null;
async function refreshLink(again){openBtn.disabled=true;try{link=await Homey.emit('login',{country:firstLogin?'':market.value,language:L});firstLogin=false;if(link&&link.market)market.value=link.market;accountNote.textContent=t('accountNote',{website:link.website||''});statusEl.textContent=again?t('newLink'):t('linkReady');openBtn.disabled=!link.url}catch(e){statusEl.textContent='';Homey.alert(e&&e.message||String(e))}}
market.onchange=()=>refreshLink(false);
openBtn.onclick=()=>openLink(link&&link.url);
connect.onclick=async()=>{const v=cb.value.trim();if(!v)return Homey.alert(t('emptyCb'));if(!/^https:\/\/account\.inpost-group\.com\/callback\?/i.test(v)||!/[?&]code=/.test(v))return Homey.alert(t('wrongCb'));connect.disabled=true;statusEl.textContent=t('checking');try{const r=await Homey.emit('callback',{callbackUrl:v});Homey.done();}catch(e){statusEl.textContent='';await Homey.alert(e&&e.message||String(e));cb.value='';await refreshLink(true)}finally{connect.disabled=false}};
refreshLink(false);
</script></body></html>
