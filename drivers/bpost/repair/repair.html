<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 28px}.logo{text-align:center;margin:8px 0 18px}.logo img{max-width:190px;max-height:82px}.note{font-size:13px;opacity:.72;line-height:1.45}.sep{height:1px;background:rgba(127,127,127,.25);margin:26px 0}.codes{min-height:95px}</style><style>:dir(rtl){direction:rtl;text-align:right}</style></head><body><div class="logo"><img src="../../../assets/bpost-logo.svg"></div><h1 class="homey-title">My bpost</h1><p class="homey-subtitle">Log in with the same My bpost account you use on bpost.be.</p><div class="homey-form-group"><label class="homey-form-label">E-mail</label><input id="email" type="email" class="homey-form-input" autocomplete="email"></div><div class="homey-form-group"><label class="homey-form-label">Password</label><input id="password" type="password" class="homey-form-input" autocomplete="current-password"></div><button id="connect" class="homey-button-primary-full">Connect My bpost</button><p class="note">MyParcel follows bpost's own web/SAML login and reads the receiving-parcel history from your account. Credentials stay in the Homey device settings.</p><div class="sep"></div><details><summary>Manual tracking fallback</summary><p class="note">BARCODE|POSTCODE, one per line.</p><textarea id="trackingCodes" class="homey-form-input codes"></textarea><button id="manual" class="homey-button-secondary-full">Add with tracking codes</button></details><script>connect.onclick=async()=>{connect.disabled=true;try{const r=await Homey.emit('connect',{email:email.value.trim(),password:password.value});Homey.done()}catch(e){Homey.alert(e.message||String(e));connect.disabled=false}};manual.onclick=async()=>{manual.disabled=true;try{const r=await Homey.emit('manual_connect',{trackingCodes:trackingCodes.value});Homey.done()}catch(e){Homey.alert(e.message||String(e));manual.disabled=false}}</script></body></html>
