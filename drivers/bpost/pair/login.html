<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>

r leveransadressen","subtitle":"Logga in på My bpost för att se alla dina paket (inkommande och skickade) och Mail Ahead-brev, eller spåra streckkoder med ett postnummer.","track":"Spåra streckkoder"},"no":{"barcodes":"Strekkoder","checking":"Kontrollerer…","connectBpost":"Koble til My bpost","email":"E-postadresse","empty":"Skriv inn minst én strekkode.","emptyLogin":"Skriv inn e-postadressen og passordet ditt.","hint":"Én per linje. Legg til et postnummer etter en strekkode hvis det er et annet.","manual":"Spor strekkoder uten konto","password":"Passord","passwordHint":"Brukes én gang for å logge inn; MyParcel lagrer bpost-påloggingstokener, ikke passordet ditt.","postal":"Postnummer for leveringsadressen","subtitle":"Logg inn på My bpost for å se alle pakkene dine (innkommende og sendte) og Mail Ahead-brev, eller spor strekkoder med et postnummer.","track":"Spor strekkoder"},"es":{"barcodes":"Códigos de barras","checking":"Comprobando…","connectBpost":"Conectar My bpost","email":"Correo electrónico","empty":"Introduce al menos un código de barras.","emptyLogin":"Introduce tu correo electrónico y contraseña.","hint":"Uno por línea. Añade un código postal tras un código de barras si es distinto.","manual":"Seguir códigos de barras sin cuenta","password":"Contraseña","passwordHint":"Se usa una sola vez para iniciar sesión; MyParcel guarda tokens de bpost, no tu contraseña.","postal":"Código postal de entrega","subtitle":"Inicia sesión en My bpost para ver todos tus paquetes (recibidos y enviados) y las cartas Mail Ahead, o sigue códigos de barras con un código postal.","track":"Seguir códigos de barras"},"da":{"barcodes":"Stregkoder","checking":"Kontrollerer…","connectBpost":"Forbind My bpost","email":"E-mailadresse","empty":"Indtast mindst én stregkode.","emptyLogin":"Indtast din e-mailadresse og adgangskode.","hint":"Én pr. linje. Tilføj et postnummer efter en stregkode, hvis det er et andet.","manual":"Spor stregkoder uden konto","password":"Adgangskode","passwordHint":"Bruges én gang til at logge ind; MyParcel gemmer bpost-logintokens, ikke din adgangskode.","postal":"Postnummer for leveringsadressen","subtitle":"Log ind på My bpost for at se alle dine pakker (indgående og sendte) og Mail Ahead-breve, eller spor stregkoder med et postnummer.","track":"Spor stregkoder"},"ru":{"barcodes":"Штрихкоды","checking":"Проверка…","connectBpost":"Подключить My bpost","email":"Адрес электронной почты","empty":"Введите хотя бы один штрихкод.","emptyLogin":"Введите адрес электронной почты и пароль.","hint":"По одному в строке. Если индекс отличается, укажите его после штрихкода.","manual":"Отслеживать штрихкоды без аккаунта","password":"Пароль","passwordHint":"Используется один раз для входа; MyParcel хранит токены входа bpost, а не ваш пароль.","postal":"Почтовый индекс доставки","subtitle":"Войдите в My bpost, чтобы видеть все посылки (входящие и отправленные) и письма Mail Ahead, или отслеживайте штрихкоды по почтовому индексу.","track":"Отслеживать штрихкоды"},"pl":{"barcodes":"Kody kreskowe","checking":"Sprawdzanie…","connectBpost":"Połącz My bpost","email":"Adres e-mail","empty":"Wpisz co najmniej jeden kod kreskowy.","emptyLogin":"Wpisz adres e-mail i hasło.","hint":"Jeden w wierszu. Dodaj kod pocztowy po kodzie kreskowym, jeśli jest inny.","manual":"Śledź kody kreskowe bez konta","password":"Hasło","passwordHint":"Używane jednorazowo do logowania; MyParcel przechowuje tokeny bpost, a nie Twoje hasło.","postal":"Kod pocztowy dostawy","subtitle":"Zaloguj się do My bpost, aby widzieć wszystkie paczki (przychodzące i wysłane) oraz listy Mail Ahead, albo śledź kody kreskowe z kodem pocztowym.","track":"Śledź kody kreskowe"},"ko":{"barcodes":"바코드","checking":"확인 중…","connectBpost":"My bpost 연결","email":"이메일 주소","empty":"바코드를 하나 이상 입력하세요.","emptyLogin":"이메일 주소와 비밀번호를 입력하세요.","hint":"한 줄에 하나씩 입력하세요. 우편번호가 다르면 바코드 뒤에 추가하세요.","manual":"계정 없이 바코드 조회","password":"비밀번호","passwordHint":"로그인할 때 한 번만 사용됩니다. MyParcel은 비밀번호가 아니라 bpost 로그인 토큰을 저장합 const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
async function run(btn,event,data){btn.disabled=true;statusEl.textContent=t('checking');try{const r=await Homey.emit(event,data);await Homey.createDevice(r.device);Homey.done()}catch(e){statusEl.textContent='';Homey.alert(e&&e.message||String(e))}finally{btn.disabled=false}}
connect.onclick=()=>{if(!email.value.trim()||!password.value)return Homey.alert(t('emptyLogin'));run(connect,'connect',{email:email.value.trim(),password:password.value})};
track.onclick=()=>{if(!tracking.value.trim())return Homey.alert(t('empty'));run(track,'manual_connect',{trackingCodes:tracking.value,postalCode:postal.value.trim()})};
</script></body></html>
