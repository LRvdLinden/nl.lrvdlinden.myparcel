<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:200px;height:auto;max-height:84px;object-fit:contain}.hint{opacity:.72;font-size:12px;line-height:1.45;margin:4px 0 10px}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px}</style></head><body><div class="logo"><img src="../../../assets/bpost-logo.svg" alt="bpost"></div><h1 class="homey-title">bpost</h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="username"></div>
<div class="homey-form-group"><label class="homey-form-label" for="password" data-t="password"></label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"><div class="hint" data-t="passwordHint"></div></div>
<button id="connect" class="homey-button-primary-full" data-t="connect"></button><div id="status" class="status"></div>
<details class="box"><summary data-t="manual"></summary>
<div class="homey-form-group"><label class="homey-form-label" for="postal" data-t="postal"></label><input id="postal" class="homey-form-input" inputmode="numeric" placeholder="1000"></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-textarea" rows="4" placeholder="323456789012345678"></textarea><div class="hint" data-t="hint"></div></div>
<button id="track" class="homey-button-secondary-full" data-t="track"></button></details><script>const I18N={"en": {"subtitle": "Sign in to My bpost to see all your parcels (incoming and sent) and Mail Ahead letters, or track barcodes with a postal code.", "email": "E-mail address", "password": "Password", "passwordHint": "Used once to sign in; MyParcel keeps bpost login tokens, not your password.", "connect": "Connect My bpost", "manual": "Track barcodes without an account", "postal": "Delivery postal code", "tracking": "Barcodes", "hint": "One per line. Add a postal code after a barcode when it differs.", "track": "Track barcodes", "checking": "Checking…", "emptyLogin": "Enter your e-mail address and password.", "empty": "Enter at least one barcode."}, "nl": {"subtitle": "Log in met My bpost om al je pakketten (inkomend en verzonden) en Mail Ahead-brieven te zien, of volg barcodes met een postcode.", "email": "E-mailadres", "password": "Wachtwoord", "passwordHint": "Wordt één keer gebruikt om in te loggen; MyParcel bewaart bpost-logintokens, niet je wachtwoord.", "connect": "My bpost koppelen", "manual": "Barcodes volgen zonder account", "postal": "Postcode van het bezorgadres", "tracking": "Barcodes", "hint": "Eén per regel. Zet een postcode achter een barcode als die afwijkt.", "track": "Barcodes volgen", "checking": "Controleren…", "emptyLogin": "Vul e-mailadres en wachtwoord in.", "empty": "Vul minstens één barcode in."}, "fr": {"subtitle": "Connectez-vous à My bpost pour voir tous vos colis et les lettres Mail Ahead, ou suivez des codes-barres avec un code postal.", "email": "Adresse e-mail", "password": "Mot de passe", "passwordHint": "Utilisé une seule fois ; MyParcel conserve des jetons bpost, pas votre mot de passe.", "connect": "Connecter My bpost", "manual": "Suivre des codes-barres sans compte", "postal": "Code postal de livraison", "tracking": "Codes-barres", "hint": "Un par ligne.", "track": "Suivre", "checking": "Vérification…", "emptyLogin": "Saisissez votre e-mail et mot de passe.", "empty": "Saisissez au moins un code-barres."}, "de": {"subtitle": "Melde dich bei My bpost an oder verfolge Barcodes mit Postleitzahl.", "email": "E-Mail-Adresse", "password": "Passwort", "connect": "My bpost verbinden", "manual": "Barcodes ohne Konto verfolgen", "postal": "Postleitzahl der Lieferadresse", "tracking": "Barcodes", "track": "Barcodes verfolgen", "checking": "Wird geprüft…"}};function lang(){const l=String(navigator.language||'en').toLowerCase().split('-')[0];return I18N[l]?l:'en'}const L=lang(),T=Object.assign({},I18N.en,I18N[L]);document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=T[el.getAttribute('data-t')]||''});async function run(btn,event,data){btn.disabled=true;status.textContent=T.checking||'';try{const r=await Homey.emit(event,data);await Homey.createDevice(r.device);Homey.done()}catch(e){status.textContent='';Homey.alert(e&&e.message||String(e))}finally{btn.disabled=false}}connect.onclick=()=>{if(!email.value.trim()||!password.value)return Homey.alert(T.emptyLogin);run(connect,'connect',{email:email.value.trim(),password:password.value})};track.onclick=()=>{if(!tracking.value.trim())return Homey.alert(T.empty);run(track,'manual_connect',{trackingCodes:tracking.value,postalCode:postal.value.trim()})};</script></body></html>
