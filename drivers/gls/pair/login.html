<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 28px}.logo{display:flex;align-items:center;justify-content:center;min-height:100px;margin:8px 0 20px}.logo img{display:block;max-width:210px;max-height:86px;object-fit:contain}.note{font-size:12px;line-height:1.45;opacity:.72}.homey-form-group{margin-bottom:14px}</style><style>:dir(rtl){direction:rtl;text-align:right}</style></head><body><div class="logo"><img src="../../../assets/gls-logo.svg" alt="GLS"></div><h1 class="homey-title">GLS / MyGLS</h1><p class="homey-subtitle">Automatic MyGLS account shipment discovery</p><p class="note">No tracking numbers are needed. Use the GLS ShipIT/API credentials and endpoints supplied for your account. MyParcel searches recent account parcels automatically and then retrieves their details.</p><div class="homey-form-group"><label class="homey-form-label">MyGLS username</label><input id="username" class="homey-form-input"></div><div class="homey-form-group"><label class="homey-form-label">MyGLS password</label><input id="password" type="password" class="homey-form-input"></div><div class="homey-form-group"><label class="homey-form-label">API subscription key</label><input id="subscriptionKey" type="password" class="homey-form-input"></div><div class="homey-form-group"><label class="homey-form-label">Parcel-list endpoint</label><input id="parcelListUrl" class="homey-form-input" placeholder="https://…/backend/rs/tracking/parcels"></div><div class="homey-form-group"><label class="homey-form-label">Parcel-details endpoint</label><input id="trackUrlTemplate" class="homey-form-input" placeholder="https://…/{tracking}"></div><button id="go" class="homey-button-primary-full">Connect GLS</button><script>go.onclick=async()=>{go.disabled=true;try{const r=await Homey.emit('login',{username:username.value.trim(),password:password.value,subscriptionKey:subscriptionKey.value.trim(),parcelListUrl:parcelListUrl.value.trim(),trackUrlTemplate:trackUrlTemplate.value.trim()});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));go.disabled=false}}</script></body></html>
