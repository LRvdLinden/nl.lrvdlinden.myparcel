<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{padding:0 4px 28px}.logo{display:flex;align-items:center;justify-content:center;min-height:90px;margin:8px 0 16px}.logo img{display:block;max-width:180px;max-height:76px;object-fit:contain}.note{font-size:12px;line-height:1.45;opacity:.72;margin-top:4px}.homey-form-group{margin-bottom:14px}textarea.homey-form-input{min-height:96px;font-family:inherit}</style>
<style>:dir(rtl){direction:rtl;text-align:right}</style></head><body>
<div class="logo"><img src="../../../assets/gls-logo.svg" alt="GLS"></div>
<h1 class="homey-title" data-t="title"></h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="country" data-t="country"></label><select id="country" class="homey-form-select"></select></div>
<div class="homey-form-group"><label class="homey-form-label" for="postcode" data-t="postcode"></label><input id="postcode" class="homey-form-input" autocomplete="postal-code"><p class="note"><span data-t="postcode_hint"></span> <span id="example"></span></p></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-input" placeholder="12345678901&#10;00L1B3BX"></textarea><p class="note" data-t="tracking_hint"></p></div>
<button id="go" class="homey-button-primary-full" data-t="connect"></button>
<script>
const TXT={"en": {"title": "GLS Track & Trace", "subtitle": "No GLS account needed — just your postal code and tracking numbers.", "country": "Country", "postcode": "Delivery postal code", "postcode_hint": "GLS only shares parcel details with the postal code the parcel is delivered to.", "tracking": "Tracking numbers (optional)", "tracking_hint": "One per line: the long parcel number or the short track ID from the GLS e-mail/SMS. You can add more later in the device settings or with a Flow.", "connect": "Add GLS", "save": "Save", "example": "Example"}, "nl": {"title": "GLS Track & Trace", "subtitle": "Geen GLS-account nodig — alleen je postcode en trackingnummers.", "country": "Land", "postcode": "Bezorgpostcode", "postcode_hint": "GLS deelt pakketgegevens alleen met de postcode waar het pakket bezorgd wordt.", "tracking": "Trackingnummers (optioneel)", "tracking_hint": "Eén per regel: het lange pakketnummer of de korte track-ID uit de GLS-mail/sms. Later toevoegen kan via de apparaatinstellingen of met een Flow.", "connect": "GLS toevoegen", "save": "Opslaan", "example": "Voorbeeld"}, "de": {"title": "GLS Sendungsverfolgung", "subtitle": "Kein GLS-Konto nötig — nur Postleitzahl und Sendungsnummern.", "country": "Land", "postcode": "Zustell-Postleitzahl", "postcode_hint": "GLS gibt Paketdetails nur mit der Postleitzahl der Zustelladresse frei.", "tracking": "Sendungsnummern (optional)", "tracking_hint": "Eine pro Zeile: die lange Paketnummer oder die kurze Track-ID aus der GLS-Mail/SMS. Weitere später in den Geräteeinstellungen oder per Flow hinzufügen.", "connect": "GLS hinzufügen", "save": "Speichern", "example": "Beispiel"}, "fr": {"title": "Suivi GLS", "subtitle": "Aucun compte GLS requis — seulement votre code postal et vos numéros de suivi.", "country": "Pays", "postcode": "Code postal de livraison", "postcode_hint": "GLS ne partage les détails qu’avec le code postal de livraison du colis.", "tracking": "Numéros de suivi (facultatif)", "tracking_hint": "Un par ligne : le long numéro de colis ou le court Track ID de l’e-mail/SMS GLS. Ajoutez-en d’autres plus tard dans les réglages ou via un Flow.", "connect": "Ajouter GLS", "save": "Enregistrer", "example": "Exemple"}};
let T=TXT.en,countries=[];
function apply(){document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=T[el.dataset.t]||TXT.en[el.dataset.t]||''});}
function showExample(){const c=countries.find(x=>x.id===country.value);example.textContent=c?`${T.example}: ${c.example}`:'';}
(async()=>{apply();try{const r=await Homey.emit('countries');T=Object.assign({},TXT.en,TXT[r.language]||{});apply();countries=r.countries||[];
country.innerHTML=countries.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
if(r.current){country.value=r.current.country;postcode.value=r.current.postcode||'';tracking.value=r.current.tracking||'';}
showExample();}catch(e){Homey.alert(e.message||String(e));}})();
country.onchange=showExample;
go.onclick=async()=>{go.disabled=true;try{const payload={country:country.value,postcode:postcode.value.trim(),tracking:tracking.value};const device=await Homey.emit('create',payload);await Homey.createDevice(device);Homey.done();}catch(e){Homey.alert(e.message||String(e));go.disabled=false;}};
</script></body></html>
