<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}textarea.homey-form-input{min-height:96px;font-family:inherit}</style></head><body>
<div class="logo"><img src="../../../assets/gls-logo.svg" alt="GLS"></div>
<h1 class="homey-title" data-t="title"></h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="country" data-t="country"></label><select id="country" class="homey-form-select"></select></div>
<div class="homey-form-group"><label class="homey-form-label" for="postcode" data-t="postcode"></label><input id="postcode" class="homey-form-input" autocomplete="postal-code"><p class="note"><span data-t="postcode_hint"></span> <span id="example"></span></p></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-input" placeholder="12345678901&#10;00L1B3BX" dir="ltr"></textarea><p class="note" data-t="tracking_hint"></p></div>
<button id="go" class="homey-button-primary-full" data-t="save"></button>
<script>

le court Track ID de l’e-mail/SMS GLS. Vous pourrez en ajouter d’autres plus tard dans les réglages de l’appareil ou via un Flow."},"it":{"country":"Paese","example":"Esempio: {value}","postcode":"Codice postale di consegna","postcode_hint":"GLS condivide i dettagli del pacco solo con il codice postale di consegna.","save":"Salva","subtitle":"Nessun account GLS necessario – solo il codice postale e i numeri di tracciamento.","title":"Tracciamento GLS","tracking":"Numeri di tracciamento (facoltativo)","tracking_hint":"Uno per riga: il numero lungo del pacco o il Track ID breve dell’e-mail/SMS di GLS. Puoi aggiungerne altri in seguito nelle impostazioni del dispositivo o con un Flow."},"sv":{"country":"Land","example":"Exempel: {value}","postcode":"Postnummer för leveransen","postcode_hint":"GLS delar bara paketinformation med postnumret som paketet levereras till.","save":"Spara","subtitle":"Inget GLS-konto behövs – bara ditt postnummer och spårningsnummer.","title":"GLS-spårning","tracking":"Spårningsnummer (valfritt)","tracking_hint":"Ett per rad: det långa paketnumret eller det korta spårnings-ID:t från GLS-mejlet/sms:et. Du kan lägga till fler senare i enhetsinställningarna eller med ett Flow."},"no":{"country":"Land","example":"Eksempel: {value}","postcode":"Postnummer for leveringen","postcode_hint":"GLS deler bare pakkedetaljer med postnummeret pakken leveres til.","save":"Lagre","subtitle":"Ingen GLS-konto nødvendig – bare postnummeret og sporingsnumrene dine.","title":"GLS-sporing","tracking":"Sporingsnumre (valgfritt)","tracking_hint":"Ett per linje: det lange pakkenummeret eller den korte sporings-ID-en fra GLS-e-posten/SMS-en. Du kan legge til flere senere i enhetsinnstillingene eller med en Flow."},"es":{"country":"País","example":"Ejemplo: {value}","postcode":"Código postal de entrega","postcode_hint":"GLS solo comparte los datos del paquete con el código postal de entrega.","save":"Guardar","subtitle":"No necesitas cuenta de GLS: solo tu código postal y los números de seguimiento.","title":"Seguimiento GLS","tracking":"Números de seguimiento (opcional)","tracking_hint":"Uno por línea: el número largo del paquete o el Track ID corto del correo/SMS de GLS. Puedes añadir más después en los ajustes del dispositivo o con un Flow."},"da":{"country":"Land","example":"Eksempel: {value}","postcode":"Postnummer for leveringen","postcode_hint":"GLS deler kun pakkeoplysninger med det postnummer, pakken leveres til.","save":"Gem","subtitle":"Ingen GLS-konto nødvendig – kun dit postnummer og sporingsnumre.","title":"GLS-sporing","tracking":"Sporingsnumre (valgfrit)","tracking_hint":"Ét pr. linje: det lange pakkenummer eller det korte sporings-id fra GLS-mailen/sms’en. Du kan tilføje flere senere i enhedsindstillingerne eller med et Flow."},"ru":{"country":"Страна","example":"Пример: {value}","postcode":"Почтовый индекс доставки","postcode_hint":"GLS предоставляет данные о посылке только по почтовому индексу места доставки.","save":"Сохранить","subtitle":"Аккаунт GLS не нужен – только почтовый индекс и номера отслеживания.","title":"Отслеживание GLS","tracking":"Номера отслеживания (необязательно)","tracking_hint":"По одному в строке: длинный номер посылки или короткий Track ID из письма/SMS GLS. Позже можно добавить ещё в настройках устройства или с помощью Flow."},"pl":{"country":"Kraj","example":"Przykład: {value}","postcode":"Kod pocztowy dostawy","postcode_hint":"GLS udostępnia szczegóły paczki tylko z kodem pocztowym miejsca dostawy.","save":"Zapisz","subtitle":"Konto GLS nie jest potrzebne – wystarczy kod pocztowy i numery przesyłek.","title":"Śledzenie GLS","tracking":"Numery przesyłek (opcjonalnie)","tracking_hint":"Jeden w wierszu: długi numer paczki lub krótki Track ID z e-maila/SMS-a GLS. Kolejne możesz dodać później w ustawieniach urządzenia lub za pomocą Flow."},"ko":{"country":"국가","example":"예: {value}","postcode":"배송지 우편번호","postcode_hint":"GLS는 택배가 배송되는 우편번호로만 택배 정보를 제공합니다.","save":"저장","subtitle":"GLS 계정이 필요 없습니다. 우편번호와 운송장 번호만 있으면 됩니다.","title":"GLS 배송 조회","tracking":"운송장 번호 (선택 사항)","tracking_hint":"한 줄에 하나씩: 긴 택배 번호 또는 GLS 이메일/SMS의 짧은 Track ID. 나중에 기기 설정이나 Flow로 더 추가할 수 있습니다."},"ar":{"country":"الدولة","example":"مثال: {value}","postcode":"الرمز البريدي للتسليم","postcode_hint":"لا تشارك GLS تفاصيل الطرد إلا مع الرمز البريدي لعنوان التسليم.","save":"حفظ","subtitle":"لا حاجة إلى حساب GLS – يكفي الرمز البريدي وأرقام التتبع.","title":"تتبّع GLS","tracking":"أرقام التتبع (اختياري)","tracking_hint":"رقم واحد في كل سطر: رقم الطرد الطويل أو معرّف التتبع القصير من رسالة GLS الإلكترونية أو النصية. يمكنك إضافة المزيد لاحقًا من إعدادات الجهاز أو باستخدام Flow."}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
let countries=[];
function showExample(){const c=countries.find(x=>x.id===country.value);example.textContent=c?t('example',{value:c.example}):'';}
(async()=>{try{const r=await Homey.emit('countries');if(r.language)applyLang(r.language);countries=r.countries||[];
country.replaceChildren(...countries.map(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=/^[A-Z]{2}$/.test(c.id)?regionName(c.id,c.name):c.name;return o}));
if(r.current){country.value=r.current.country;postcode.value=r.current.postcode||'';tracking.value=r.current.tracking||'';}
showExample();}catch(e){Homey.alert(e.message||String(e));}})();
country.onchange=showExample;
go.onclick=async()=>{go.disabled=true;try{const payload={country:country.value,postcode:postcode.value.trim(),tracking:tracking.value};await Homey.emit('save',payload);Homey.done();}catch(e){Homey.alert(e.message||String(e));go.disabled=false;}};
</script></body></html>
