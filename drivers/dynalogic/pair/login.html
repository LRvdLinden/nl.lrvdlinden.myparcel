<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/dynalogic-logo.png" alt="Dynalogic"></div><h1 class="homey-title">Dynalogic</h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="country" data-t="country"></label><select id="country" class="homey-form-select"><option value="NL" data-region="NL">Nederland</option><option value="BE" data-region="BE">België</option></select></div>
<div class="homey-form-group"><label class="homey-form-label" for="postcode" data-t="postcode"></label><input id="postcode" class="homey-form-input" autocomplete="postal-code" autocapitalize="characters" dir="ltr"><p class="note"><span data-t="postcodeHint"></span> <span id="example"></span></p></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-textarea" rows="4" dir="ltr"></textarea><p class="note" data-t="trackingHint"></p></div>
<button id="go" class="homey-button-primary-full" data-t="add"></button><div id="status" class="status" role="status"></div>
<script>
const I18N={"en":{"add":"Add Dynalogic","checking":"Checking…","country":"Country","emptyPostcode":"Enter the delivery postcode.","example":"Example: {value}","postcode":"Delivery postcode","postcodeHint":"Required: Dynalogic only shows the delivery together with the postcode it is delivered to.","subtitle":"Follow Dynalogic deliveries with the order number and the delivery postcode – no account needed.","tracking":"Order numbers (optional)","trackingHint":"One per line. For a delivery to another address, add its postcode after the order number. You can also add order numbers later in the device settings or with a Flow."},"nl":{"add":"Dynalogic toevoegen","checking":"Controleren…","country":"Land","emptyPostcode":"Vul de postcode van het bezorgadres in.","example":"Voorbeeld: {value}","postcode":"Postcode van het bezorgadres","postcodeHint":"Verplicht: Dynalogic toont de bezorging alleen samen met de postcode van het bezorgadres.","subtitle":"Volg Dynalogic-bezorgingen met het ordernummer en de postcode van het bezorgadres – geen account nodig.","tracking":"Ordernummers (optioneel)","trackingHint":"Eén per regel. Voor een bezorging op een ander adres zet je de postcode achter het ordernummer. Ordernummers toevoegen kan ook later via de apparaatinstellingen of met een Flow."},"de":{"add":"Dynalogic hinzufügen","checking":"Wird geprüft…","country":"Land","emptyPostcode":"Gib die Postleitzahl der Lieferadresse ein.","example":"Beispiel: {value}","postcode":"Postleitzahl der Lieferadresse","postcodeHint":"Pflichtfeld: Dynalogic zeigt die Lieferung nur zusammen mit der Postleitzahl der Lieferadresse.","subtitle":"Verfolge Dynalogic-Lieferungen mit Auftragsnummer und Postleitzahl der Lieferadresse – ohne Konto.","tracking":"Auftragsnummern (optional)","trackingHint":"Eine pro Zeile. Für eine Lieferung an eine andere Adresse die Postleitzahl hinter die Auftragsnummer setzen. Auftragsnummern kannst du auch später in den Geräteeinstellungen oder per Flow hinzufügen."},"fr":{"add":"Ajouter Dynalogic","checking":"Vérification…","country":"Pays","emptyPostcode":"Saisissez le code postal de livraison.","example":"Exemple : {value}","postcode":"Code postal de livraison","postcodeHint":"Obligatoire : Dynalogic n’affiche la livraison qu’avec le code postal de livraison.","subtitle":"Suivez les livraisons Dynalogic avec le numéro de commande et le code postal de livraison – sans compte.","tracking":"Numéros de commande (facultatif)","trackingHint":"Un par ligne. Pour une livraison à une autre adresse, ajoutez son code postal après le numéro de commande. Vous pourrez aussi en ajouter plus tard dans les réglages de l’appareil ou via un Flow."},"it":{"add":"Aggiungi Dynalogic","checking":"Verifica in corso…","country":"Paese","emptyPostcode":"Inserisci il codice postale di consegna.","example":"Esempio: {value}","postcode":"Codice postale di consegna","postcodeHint":"Obbligatorio: Dynalogic mostra la consegna solo insieme al codice postale di consegna.","subtitle":"Traccia le consegne Dynalogic con il numero d’ordine e il codice postale di consegna – senza account.","tracking":"Numeri d’ordine (facoltativo)","trackingHint":"Uno per riga. Per una consegna a un altro indirizzo, aggiungi il codice postale dopo il numero d’ordine. Puoi aggiungere numeri anche in seguito nelle impostazioni del dispositivo o con un Flow."},"sv":{"add":"Lägg till Dynalogic","checking":"Kontrollerar…","country":"Land","emptyPostcode":"Ange postnumret för leveransen.","example":"Exempel: {value}","postcode":"Postnummer för leveransen","postcodeHint":"Obligatoriskt: Dynalogic visar bara leveransen tillsammans med postnumret den levereras till.","subtitle":"Spåra Dynalogic-leveranser med ordernumret och leveransens postnummer – inget konto behövs.","tracking":"Ordernummer (valfritt)","trackingHint":"Ett per rad. För en leverans till en annan adress, lägg till postnumret efter ordernumret. Du kan också lägga till ordernummer senare i enhetsinställningarna eller med ett Flow."},"no":{"add":"Legg til Dynalogic","checking":"Kontrollerer…","country":"Land","emptyPostcode":"Skriv inn postnummeret for leveringen.","example":"Eksempel: {value}","postcode":"Postnummer for leveringen","postcodeHint":"Påkrevd: Dynalogic viser bare leveransen sammen med postnummeret den leveres til.","subtitle":"Spor Dynalogic-leveranser med ordrenummeret og postnummeret for leveringen – ingen konto nødvendig.","tracking":"Ordrenumre (valgfritt)","trackingHint":"Ett per linje. For en leveranse til en annen adresse legger du postnummeret etter ordrenummeret. Du kan også legge til ordrenumre senere i enhetsinnstillingene eller med en Flow."},"es":{"add":"Añadir Dynalogic","checking":"Comprobando…","country":"País","emptyPostcode":"Introduce el código postal de entrega.","example":"Ejemplo: {value}","postcode":"Código postal de entrega","postcodeHint":"Obligatorio: Dynalogic solo muestra la entrega junto con el código postal de entrega.","subtitle":"Sigue entregas de Dynalogic con el número de pedido y el código postal de entrega, sin cuenta.","tracking":"Números de pedido (opcional)","trackingHint":"Uno por línea. Para una entrega en otra dirección, añade su código postal tras el número de pedido. También puedes añadir números después en los ajustes del dispositivo o con un Flow."},"da":{"add":"Tilføj Dynalogic","checking":"Kontrollerer…","country":"Land","emptyPostcode":"Indtast postnummeret for leveringen.","example":"Eksempel: {value}","postcode":"Postnummer for leveringen","postcodeHint":"Påkrævet: Dynalogic viser kun leveringen sammen med det postnummer, den leveres til.","subtitle":"Spor Dynalogic-leveringer med ordrenummeret og leveringens postnummer – ingen konto nødvendig.","tracking":"Ordrenumre (valgfrit)","trackingHint":"Ét pr. linje. For en levering til en anden adresse tilføjer du postnummeret efter ordrenummeret. Du kan også tilføje ordrenumre senere i enhedsindstillingerne eller med et Flow."},"ru":{"add":"Добавить Dynalogic","checking":"Проверка…","country":"Страна","emptyPostcode":"Введите почтовый индекс доставки.","example":"Пример: {value}","postcode":"Почтовый индекс доставки","postcodeHint":"Обязательно: Dynalogic показывает доставку только вместе с почтовым индексом адреса доставки.","subtitle":"Отслеживайте доставки Dynalogic по номеру заказа и почтовому индексу – без аккаунта.","tracking":"Номера заказов (необязательно)","trackingHint":"По одному в строке. Для доставки на другой адрес укажите индекс после номера заказа. Номера можно добавить и позже в настройках устройства или с помощью Flow."},"pl":{"add":"Dodaj Dynalogic","checking":"Sprawdzanie…","country":"Kraj","emptyPostcode":"Wpisz kod pocztowy dostawy.","example":"Przykład: {value}","postcode":"Kod pocztowy dostawy","postcodeHint":"Wymagane: Dynalogic pokazuje dostawę tylko razem z kodem pocztowym miejsca dostawy.","subtitle":"Śledź dostawy Dynalogic po numerze zamówienia i kodzie pocztowym dostawy – bez konta.","tracking":"Numery zamówień (opcjonalnie)","trackingHint":"Jeden w wierszu. Dla dostawy na inny adres dodaj kod pocztowy po numerze zamówienia. Numery możesz dodać także później w ustawieniach urządzenia lub za pomocą Flow."},"ko":{"add":"Dynalogic 추가","checking":"확인 중…","country":"국가","emptyPostcode":"배송지 우편번호를 입력하세요.","example":"예: {value}","postcode":"배송지 우편번호","postcodeHint":"필수: Dynalogic는 배송지 우편번호가 있어야 배송 정보를 보여 줍니다.","subtitle":"주문 번호와 배송지 우편번호로 Dynalogic 배송을 조회하세요. 계정이 필요 없습니다.","tracking":"주문 번호 (선택 사항)","trackingHint":"한 줄에 하나씩 입력하세요. 다른 주소로 배송되면 주문 번호 뒤에 우편번호를 추가하세요. 나중에 기기 설정이나 Flow로 주문 번호를 추가할 수도 있습니다."},"ar":{"add":"إضافة Dynalogic","checking":"جارٍ التحقق…","country":"الدولة","emptyPostcode":"أدخل الرمز البريدي للتسليم.","example":"مثال: {value}","postcode":"الرمز البريدي للتسليم","postcodeHint":"مطلوب: لا تعرض Dynalogic الشحنة إلا مع الرمز البريدي لعنوان التسليم.","subtitle":"تتبّع شحنات Dynalogic برقم الطلب والرمز البريدي للتسليم – دون حساب.","tracking":"أرقام الطلبات (اختياري)","trackingHint":"رقم واحد في كل سطر. للشحنة المرسلة إلى عنوان آخر، أضف رمزها البريدي بعد رقم الطلب. يمكنك أيضًا إضافة أرقام الطلبات لاحقًا من إعدادات الجهاز أو باستخدام Flow."}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?(L==='ar'?'\u2068'+v[n]+'\u2069':String(v[n])):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
const EXAMPLES={NL:'1012AB',BE:'1000'};
function showExample(){const ex=EXAMPLES[country.value]||'';example.textContent=t('example',{value:ex});postcode.placeholder=ex}
country.onchange=showExample;showExample();
go.onclick=async()=>{const pc=postcode.value.trim();if(!pc)return Homey.alert(t('emptyPostcode'));go.disabled=true;statusEl.textContent=t('checking');try{const r=await Homey.emit('connect',{trackingCodes:tracking.value,country:country.value,postalCode:pc});await Homey.createDevice(r.device);Homey.done();}catch(e){statusEl.textContent='';Homey.alert(e&&e.message||String(e))}finally{go.disabled=false}};
</script></body></html>
