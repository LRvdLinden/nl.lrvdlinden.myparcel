<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:200px;height:auto;max-height:84px;object-fit:contain}.hint{opacity:.72;font-size:12px;line-height:1.45;margin:4px 0 10px}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px}.or{margin:18px 0 6px;font-weight:700}</style></head><body><div class="logo"><img src="../assets/dhl-express-logo.svg" alt="DHL Express"></div><h1 class="homey-title">DHL Express</h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-textarea" rows="4" autocomplete="off" placeholder="1234567890"></textarea><div class="hint" data-t="trackingHint"></div></div>
<button id="track" class="homey-button-primary-full" data-t="track"></button><div id="status" class="status"></div>
<details class="box"><summary data-t="account"></summary><p class="hint" data-t="accountHint"></p>
<div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="username"></div>
<div class="homey-form-group"><label class="homey-form-label" for="password" data-t="password"></label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div>
<div class="homey-form-group"><label class="homey-form-label" for="otp" data-t="otp"></label><input id="otp" class="homey-form-input" type="text" inputmode="numeric" autocomplete="one-time-code"></div>
<button id="connect" class="homey-button-secondary-full" data-t="connect"></button></details>
<details class="box"><summary data-t="helper"></summary><p class="hint" data-t="helperHint"></p>
<div class="homey-form-group"><label class="homey-form-label" for="sessionCode" data-t="code"></label><textarea id="sessionCode" class="homey-form-textarea" rows="5" autocomplete="off"></textarea></div>
<button id="connectHelper" class="homey-button-secondary-full" data-t="connectHelper"></button></details><script>const I18N={"en": {"subtitle": "Track DHL Express shipments with their 10-digit air waybill number – no account needed.", "tracking": "Air waybill numbers", "trackingHint": "One per line, e.g. 1234567890. Add “out” for a shipment you send yourself. DHL Express allows about one lookup per 40 minutes, so several numbers are refreshed in turn.", "track": "Track shipments", "account": "Use a MyDHL+ account (optional)", "accountHint": "Shows the shipments of your MyDHL+ account as well. Air waybill numbers above are added too.", "email": "E-mail address", "password": "Password", "otp": "Verification code (only when DHLPass asks)", "connect": "Connect account", "helper": "Use the browser helper", "helperHint": "If DHLPass blocks the direct login, use the DHL Express Homey Login Helper and paste the DHLEXPRESS1 code here.", "code": "MyDHL+ session code", "connectHelper": "Connect with helper code", "checking": "Checking…", "empty": "Enter at least one air waybill number.", "emptyLogin": "Enter your e-mail address and password.", "emptyCode": "Paste the DHLEXPRESS1 session code first."}, "nl": {"subtitle": "Volg DHL Express-zendingen met hun luchtvrachtbriefnummer van 10 cijfers – geen account nodig.", "tracking": "Luchtvrachtbriefnummers", "trackingHint": "Eén per regel, bijv. 1234567890. Voeg “uit” toe voor een zending die je zelf verstuurt. DHL Express staat ongeveer één opvraging per 40 minuten toe; meerdere nummers worden om de beurt bijgewerkt.", "track": "Zendingen volgen", "account": "MyDHL+-account gebruiken (optioneel)", "accountHint": "Toont ook de zendingen uit je MyDHL+-account. De luchtvrachtbriefnummers hierboven worden ook toegevoegd.", "email": "E-mailadres", "password": "Wachtwoord", "otp": "Verificatiecode (alleen als DHLPass erom vraagt)", "connect": "Account koppelen", "helper": "Browserhelper gebruiken", "helperHint": "Als DHLPass de directe login blokkeert, gebruik dan de DHL Express Homey Login Helper en plak hier de DHLEXPRESS1-code.", "code": "MyDHL+-sessiecode", "connectHelper": "Koppelen met helpercode", "checking": "Controleren…", "empty": "Vul minstens één luchtvrachtbriefnummer in.", "emptyLogin": "Vul e-mailadres en wachtwoord in.", "emptyCode": "Plak eerst de DHLEXPRESS1-sessiecode."}, "de": {"subtitle": "Verfolge DHL-Express-Sendungen mit der 10-stelligen Luftfrachtbriefnummer – ohne Konto.", "tracking": "Luftfrachtbriefnummern", "trackingHint": "Eine pro Zeile, z. B. 1234567890. „out“ für selbst versendete Sendungen. DHL Express erlaubt etwa eine Abfrage pro 40 Minuten.", "track": "Sendungen verfolgen", "account": "MyDHL+-Konto verwenden (optional)", "accountHint": "Zeigt zusätzlich die Sendungen aus deinem MyDHL+-Konto.", "email": "E-Mail-Adresse", "password": "Passwort", "otp": "Bestätigungscode (nur wenn DHLPass danach fragt)", "connect": "Konto verbinden", "helper": "Browser-Helfer verwenden", "helperHint": "Falls DHLPass die direkte Anmeldung blockiert, nutze den DHL Express Homey Login Helper und füge den DHLEXPRESS1-Code ein.", "code": "MyDHL+-Sitzungscode", "connectHelper": "Mit Helfer-Code verbinden", "checking": "Wird geprüft…", "empty": "Gib mindestens eine Luftfrachtbriefnummer ein.", "emptyLogin": "Gib E-Mail-Adresse und Passwort ein.", "emptyCode": "Füge zuerst den DHLEXPRESS1-Code ein."}, "fr": {"subtitle": "Suivez les envois DHL Express avec leur numéro de lettre de transport à 10 chiffres – sans compte.", "tracking": "Numéros de lettre de transport", "track": "Suivre les envois", "account": "Utiliser un compte MyDHL+ (facultatif)", "email": "Adresse e-mail", "password": "Mot de passe", "connect": "Connecter le compte", "empty": "Saisissez au moins un numéro de lettre de transport."}};function lang(){const l=String(navigator.language||'en').toLowerCase().split('-')[0];return I18N[l]?l:'en'}const L=lang(),T=Object.assign({},I18N.en,I18N[L]);document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(el.placeholder!==undefined&&el.tagName!=='BUTTON'&&el.hasAttribute('data-ph'))el.placeholder=T[k];else el.textContent=T[k]});async function run(btn,event,data){btn.disabled=true;status.textContent=T.checking||'';try{const r=await Homey.emit(event,data);await Homey.createDevice(r.device);Homey.done()}catch(e){status.textContent='';Homey.alert(e&&e.message||String(e))}finally{btn.disabled=false}}track.onclick=()=>{if(!tracking.value.trim())return Homey.alert(T.empty);run(track,'track_awb',{tracking:tracking.value})};connect.onclick=()=>{if(!email.value.trim()||!password.value)return Homey.alert(T.emptyLogin);run(connect,'login_dhl_express',{email:email.value.trim(),password:password.value,otp:otp.value.trim(),tracking:tracking.value})};connectHelper.onclick=()=>{const code=sessionCode.value.trim();if(!code)return Homey.alert(T.emptyCode);run(connectHelper,'connect_helper',{sessionCode:code,tracking:tracking.value})};</script></body></html>
