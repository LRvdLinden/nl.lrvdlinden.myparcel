<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:dir(rtl){direction:rtl;text-align:right}.logo{text-align:center;margin:8px 0 22px}.logo img{max-width:220px;max-height:90px}.help{line-height:1.45}</style></head><body><div class="logo"><img src="../assets/dhl-express-logo.svg" alt="DHL Express"></div><h2>DHL Express</h2><p class="help">Sign in normally to DHLPass / MyDHL+ with the <b>DHL Express Homey Login Helper</b>. Open <b>Manage Shipments → All Shipments</b> once, then copy the generated MyDHL+ session code and paste it below. This links your MyDHL+ account to this Homey device.</p><div class="homey-form-group"><label class="homey-form-label">MyDHL+ session code</label><textarea id="sessionCode" class="homey-form-textarea" rows="6" autocomplete="off"></textarea></div><button id="connect" class="homey-button-primary-full">Connect DHL Express</button><script>connect.onclick=async()=>{connect.disabled=true;try{const r=await Homey.emit('connect',{sessionCode:sessionCode.value.trim()});await Homey.done()}catch(e){Homey.alert(e.message||String(e));connect.disabled=false}}</script></body></html>
