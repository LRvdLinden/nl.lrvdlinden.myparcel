<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>

gin":"Introduce tu correo electrónico y contraseña.","helper":"Usar el asistente del navegador","helperHint":"Si DHLPass bloquea el inicio de sesión directo o pide una comprobación interactiva, usa DHL Express Homey Login Helper y pega aquí el código DHLEXPRESS1.","otp":"Código de verificación (solo si DHLPass lo pide)","password":"Contraseña","reconnected":"DHL Express conectado de nuevo.","subtitleRepair":"Inicia sesión directamente con tu cuenta MyDHL+ / DHLPass. Funciona igual que la conexión de DHL Parcel mientras DHLPass no pida una comprobación adicional en el navegador."},"da":{"checkingPass":"Kontrollerer DHLPass-kontoen…","code":"MyDHL+-sessionskode","connectAccount":"Forbind konto","connectHelper":"Forbind med hjælpekode","email":"E-mailadresse","emptyCode":"Indsæt først DHLEXPRESS1-sessionskoden.","emptyLogin":"Indtast din e-mailadresse og adgangskode.","helper":"Brug browserhjælperen","helperHint":"Hvis DHLPass blokerer det direkte login eller kræver en interaktiv kontrol, så brug DHL Express Homey Login Helper, og indsæt DHLEXPRESS1-koden her.","otp":"Bekræftelseskode (kun hvis DHLPass beder om den)","password":"Adgangskode","reconnected":"DHL Express er forbundet igen.","subtitleRepair":"Log ind direkte med din MyDHL+ / DHLPass-konto. Det fungerer som DHL Parcel-forbindelsen, så længe DHLPass ikke kræver en ekstra kontrol i browseren."},"ru":{"checkingPass":"Проверка аккаунта DHLPass…","code":"Код сеанса MyDHL+","connectAccount":"Подключить аккаунт","connectHelper":"Подключить с кодом помощника","email":"Адрес электронной почты","emptyCode":"Сначала вставьте код сеанса DHLEXPRESS1.","emptyLogin":"Введите адрес электронной почты и пароль.","helper":"Использовать помощник для браузера","helperHint":"Если DHLPass блокирует прямой вход или требует интерактивной проверки, используйте DHL Express Homey Login Helper и вставьте сюда код DHLEXPRESS1.","otp":"Код подтверждения (только если DHLPass его запросит)","password":"Пароль","reconnected":"DHL Express сн const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
connect.onclick=async()=>{
 if(!email.value.trim()||!password.value)return Homey.alert(t('emptyLogin'));
 connect.disabled=true;statusEl.textContent=t('checkingPass');
 try{
  await Homey.emit('login_dhl_express',{email:email.value.trim(),password:password.value,otp:otp.value.trim()});
  statusEl.textContent=t('reconnected');Homey.done();
 }catch(e){
  statusEl.textContent='';
  Homey.alert(e?.message||String(e));
 }finally{connect.disabled=false}
};
connectHelper.onclick=async()=>{
 const code=sessionCode.value.trim();if(!code)return Homey.alert(t('emptyCode'));
 connectHelper.disabled=true;
 try{await Homey.emit('connect_helper',{sessionCode:code});Homey.done()}
 catch(e){Homey.alert(e?.message||String(e))}
 finally{connectHelper.disabled=false}
};
