<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>

<div class="homey-form-group"><label class="homey-form-label" for="country" data-t="country"></label><select id="country" class="homey-form-select">

 <option value="ES" data-region="ES">Spain</option><option value="SE" data-region="SE">Sweden</option>
 <option value="NO" data-region="NO">Norway</option><option value="DK" data-region="DK">Denmark</option>
 <option value="PL" data-region="PL">Poland</option>
</select></div>
<div class="homey-form-group"><label class="homey-form-label" for="language" data-t="language"></label><select id="language" class="homey-form-select">

</select></div>
<fieldset class="homey-form-fieldset"><legend class="homey-form-legend">UPS Token Helper 0.1.5</legend><p class="homey-form-description" data-t="callbackIntro"></p>
<div class="homey-form-group"><label class="homey-form-label" for="callback" data-t="callback"></label><textarea id="callback" class="homey-form-textarea" rows="4" autocomplete="off" dir="ltr"></textarea></div><button id="connect" class="homey-button-primary-full" data-t="connectUps"></button></fieldset>
<fieldset class="homey-form-fieldset"><legend class="homey-form-legend" data-t="manualTitle"></legend><div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="trackingNumbers"></label><textarea id="tracking" class="homey-form-textarea" rows="4" dir="ltr"></textarea></div><button id="manual" class="homey-button-secondary-full" data-t="addTracking"></button></fieldset>
<script>
const I18N={"en":{"addTracking":"Add tracking numbers","callback":"UPS login callback","callbackIntro":"Sign in to UPS with UPS Token Helper 0.1.5 and paste the captured UPS login data. Log in to UPS, open the UPS dashboard, wait until the helper reports that the PPC web session is ready, then paste the web_session pairing value here.","connectUps":"Connect UPS","country":"Country","language":"Language","manualTitle":"Manual fallback","missingTracking":"Enter at least one tracking number.","trackingNumbers":"Tracking numbers"},"nl":{"addTracking":"Trackingnummers toevoegen","callback":"UPS-login-callback","callbackIntro":"Log in bij UPS met UPS Token Helper 0.1.5 en plak de vastgelegde UPS-logingegevens. Log in bij UPS, open het UPS-dashboard, wacht tot de helper meldt dat de PPC-websessie klaar is en plak daarna hier de web_session-koppelwaarde.","connectUps":"UPS koppelen","country":"Land","language":"Taal","manualTitle":"Handmatig alternatief","missingTracking":"Vul minstens één trackingnummer in.","trackingNumbers":"Trackingnummers"},"de":{"addTracking":"Sendungsnummern hinzufügen","callback":"UPS-Anmelde-Callback","callbackIntro":"Melde dich mit UPS Token Helper 0.1.5 bei UPS an und füge die erfassten UPS-Anmeldedaten ein. Melde dich bei UPS an, öffne das UPS-Dashboard, warte, bis der Helfer meldet, dass die PPC-Websitzung bereit ist, und füge dann hier den web_session-Kopplungswert ein.","connectUps":"UPS verbinden","country":"Land","language":"Sprache","manualTitle":"Manuelle Alternative","missingTracking":"Gib mindestens eine Sendungsnummer ein.","trackingNumbers":"Sendungsnummern"},"fr":{"addTracking":"Ajouter des numéros de suivi","callback":"Callback de connexion UPS","callbackIntro":"Connectez-vous à UPS avec UPS Token Helper 0.1.5 et collez les données de connexion UPS capturées. Connectez-vous à UPS, ouvrez le tableau de bord UPS, attendez que l’assistant indique que la session web PPC est prête, puis collez ici la valeur d’appairage web_session.","connectUps":"Connecter UPS","country":"Pays","language":"Langue","manualTitle":"Solution manuelle","missingTracking":"Saisissez au moins un numéro de suivi.","trackingNumbers":"Numéros de suivi"},"it":{"addTracking":"Aggiungi numeri di tracciamento","callback":"Callback di accesso UPS","callbackIntro":"Accedi a UPS con UPS Token Helper 0.1.5 e incolla i dati di accesso UPS acquisiti. Accedi a UPS, apri la dashboard UPS, attendi che l’assistente segnali che la sessione web PPC è pronta, quindi incolla qui il valore di associazione web_session.","connectUps":"Collega UPS","country":"Paese","language":"Lingua","manualTitle":"Alternativa manuale","missingTracking":"Inserisci almeno un numero di tracciamento.","trackingNumbers":"Numeri di tracciamento"},"sv":{"addTracking":"Lägg till spårningsnummer","callback":"UPS-inloggningscallback","callbackIntro":"Logga in på UPS med UPS Token Helper 0.1.5 och klistra in de inspelade UPS-inloggningsuppgifterna. Logga in på UPS, öppna UPS-instrumentpanelen, vänta tills hjälpen meddelar att PPC-webbsessionen är klar och klistra sedan in web_session-parkopplingsvärdet här.","connectUps":"Anslut UPS","country":"Land","language":"Språk","manualTitle":"Manuellt alternativ","missingTracking":"Ange minst ett spårningsnummer.","trackingNumbers":"Spårningsnummer"},"no":{"addTracking":"Legg til sporingsnumre","callback":"UPS-påloggingscallback","callbackIntro":"Logg inn hos UPS med UPS Token Helper 0.1.5 og lim inn de registrerte UPS-påloggingsdataene. Logg inn hos UPS, åpne UPS-dashbordet, vent til hjelperen melder at PPC-nettøkten er klar, og lim deretter inn web_session-sammenkoblingsverdien her.","connectUps":"Koble til UPS","country":"Land","language":"Språk","manualTitle":"Manuelt alternativ","missingTracking":"Skriv inn minst ett sporingsnummer.","trackingNumbers":"Sporingsnumre"},"es":{"addTracking":"Añadir números de seguimiento","callback":"Callback de inicio de sesión de UPS","callbackIntro":"Inicia sesión en UPS con UPS Token Helper 0.1.5 y pega los datos de inicio de sesión de UPS capturados. Entra en UPS, abre el panel de UPS, espera a que el asistente indique que la sesión web PPC está lista y pega aquí el valor de emparejamiento web_session.","connectUps":"Conectar UPS","country":"País","language":"Idioma","manualTitle":"Alternativa manual","missingTracking":"Introduce al menos un número de seguimiento.","trackingNumbers":"Números de seguimiento"},"da":{"addTracking":"Tilføj sporingsnumre","callback":"UPS-login-callback","callbackIntro":"Log ind hos UPS med UPS Token Helper 0.1.5, og indsæt de opsamlede UPS-loginoplysninger. Log ind hos UPS, åbn UPS-dashboardet, vent til hjælperen melder, at PPC-websessionen er klar, og indsæt derefter web_session-parringsværdien her.","connectUps":"Forbind UPS","country":"Land","language":"Sprog","manualTitle":"Manuelt alternativ","missingTracking":"Indtast mindst ét sporingsnummer.","trackingNumbers":"Sporingsnumre"},"ru":{"addTracking":"Добавить номера отслеживания","callback":"Данные обратного вызова входа UPS","callbackIntro":"Войдите в UPS с помощью UPS Token Helper 0.1.5 и вставьте полученные данные входа UPS. Войдите в UPS, откройте панель UPS, дождитесь сообщения помощника о готовности веб-сеанса PPC, затем вставьте сюда значение сопряжения web_session.","connectUps":"Подключить UPS","country":"Страна","language":"Язык","manualTitle":"Ручной вариант","missingTracking":"Введите хотя бы один номер отслеживания.","trackingNumbers":"Номера отслеживания"},"pl":{"addTracking":"Dodaj numery przesyłek","callback":"Callback logowania UPS","callbackIntro":"Zaloguj się do UPS za pomocą UPS Token Helper 0.1.5 i wklej przechwycone dane logowania UPS. Zaloguj się do UPS, otwórz panel UPS, poczekaj, aż pomocnik zgłosi gotowość sesji internetowej PPC, a następnie wklej tutaj wartość parowania web_session.","connectUps":"Połącz UPS","country":"Kraj","language":"Język","manualTitle":"Tryb ręczny","missingTracking":"Wpisz co najmniej jeden numer przesyłki.","trackingNumbers":"Numery przesyłek"},"ko":{"addTracking":"운송장 번호 추가","callback":"UPS 로그인 콜백","callbackIntro":"UPS Token Helper 0.1.5로 UPS에 로그인하고 캡처한 UPS 로그인 데이터를 붙여 넣으세요. UPS에 로그인해 UPS 대시보드를 열고, 도우미가 PPC 웹 세션 준비 완료를 알릴 때까지 기다린 다음 web_session 페어링 값을 여기에 붙여 넣으세요.","connectUps":"UPS 연결","country":"국가","language":"언어","manualTitle":"수동 대체 방법","missingTracking":"운송장 번호를 하나 이상 입력하세요.","trackingNumbers":"운송장 번호"},"ar":{"addTracking":"إضافة أرقام التتبع","callback":"بيانات رد الاتصال لتسجيل دخول UPS","callbackIntro":"سجّل الدخول إلى UPS باستخدام UPS Token Helper 0.1.5 والصق بيانات تسجيل الدخول التي تم التقاطها. سجّل الدخول إلى UPS وافتح لوحة UPS وانتظر حتى يبلّغ المساعد بأن جلسة الويب PPC جاهزة، ثم الصق قيمة الإقران web_session هنا.","connectUps":"ربط UPS","country":"الدولة","language":"اللغة","manualTitle":"بديل يدوي","missingTracking":"أدخل رقم تتبع واحدًا على الأقل.","trackingNumbers":"أرقام التتبع"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const defaults={NL:'nl',BE:'nl',DE:'de',FR:'fr',GB:'en',US:'en',CA:'en',IT:'it',ES:'es',SE:'sv',NO:'no',DK:'da',PL:'pl'};country.onchange=()=>language.value=defaults[country.value]||'en';
connect.onclick=async()=>{connect.disabled=true;try{const r=await Homey.emit('connect_callback',{callback:callback.value.trim(),countryCode:country.value,language:language.value});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));connect.disabled=false}};
manual.onclick=async()=>{const numbers=tracking.value.split(/\r?\n|,/).map(v=>v.trim()).filter(Boolean);if(!numbers.length)return Homey.alert(t('missingTracking'));manual.disabled=true;try{const r=await Homey.emit('connect_manual',{trackingNumbers:numbers,countryCode:country.value,language:language.value});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));manual.disabled=false}};
</script></body></html>
