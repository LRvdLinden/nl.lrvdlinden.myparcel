<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 28px}.logo{text-align:center;margin:8px 0 20px}.logo img{max-width:210px;max-height:100px}.note{font-size:13px;line-height:1.45;opacity:.75}.homey-form-group{margin:16px 0}</style><style>:dir(rtl){direction:rtl;text-align:right}</style></head><body><div class="logo"><img src="../../../assets/royal-mail-logo.svg" alt="Royal Mail"></div><h1 class="homey-title">Royal Mail</h1><p class="homey-subtitle">Automatic Click & Drop account integration</p><p class="note">Create a Click & Drop API integration in Royal Mail under Settings → Integrations → Click & Drop API, then paste its authorisation key below. MyParcel automatically retrieves recent orders from the account; you do not enter tracking numbers.</p><div class="homey-form-group"><label class="homey-form-label">Click & Drop API key</label><input id="apiKey" type="password" class="homey-form-input" autocomplete="off"></div><button id="connect" class="homey-button-primary-full">Connect Royal Mail</button><script>connect.onclick=async()=>{connect.disabled=true;try{const r=await Homey.emit('connect',{apiKey:apiKey.value.trim()});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));connect.disabled=false}}</script></body></html>
