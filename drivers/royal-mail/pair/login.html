<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/royal-mail-logo.svg" alt="Royal Mail"></div><h1 class="homey-title">Royal Mail</h1><p class="homey-subtitle" data-t="subtitle"></p><p class="note" data-t="note"></p>
<div class="homey-form-group" style="margin-block:16px"><label class="homey-form-label" for="apiKey" data-t="apiKey"></label><input id="apiKey" type="password" class="homey-form-input" autocomplete="off"></div><button id="connect" class="homey-button-primary-full" data-t="connectRm"></button>
<script>
const I18N={"en":{"apiKey":"Click & Drop API key","connectRm":"Connect Royal Mail","note":"Create a Click & Drop API integration in Royal Mail under Settings → Integrations → Click & Drop API, then paste its authorisation key below. MyParcel automatically retrieves recent orders from the account; you do not enter tracking numbers.","subtitle":"Automatic Click & Drop account integration"},"nl":{"apiKey":"Click & Drop API-sleutel","connectRm":"Royal Mail koppelen","note":"Maak in Royal Mail een Click & Drop API-integratie aan via Settings → Integrations → Click & Drop API en plak de autorisatiesleutel hieronder. MyParcel haalt automatisch recente bestellingen uit het account op; je hoeft geen trackingnummers in te vullen.","subtitle":"Automatische koppeling met je Click & Drop-account"},"de":{"apiKey":"Click-&-Drop-API-Schlüssel","connectRm":"Royal Mail verbinden","note":"Lege in Royal Mail unter Settings → Integrations → Click & Drop API eine Click-&-Drop-API-Integration an und füge den Autorisierungsschlüssel unten ein. MyParcel ruft automatisch die letzten Bestellungen aus dem Konto ab; du gibst keine Sendungsnummern ein.","subtitle":"Automatische Anbindung deines Click-&-Drop-Kontos"},"fr":{"apiKey":"Clé API Click & Drop","connectRm":"Connecter Royal Mail","note":"Créez une intégration Click & Drop API dans Royal Mail via Settings → Integrations → Click & Drop API, puis collez sa clé d’autorisation ci-dessous. MyParcel récupère automatiquement les commandes récentes du compte ; vous n’avez pas à saisir de numéros de suivi.","subtitle":"Intégration automatique du compte Click & Drop"},"it":{"apiKey":"Chiave API Click & Drop","connectRm":"Collega Royal Mail","note":"Crea un’integrazione Click & Drop API in Royal Mail da Settings → Integrations → Click & Drop API, poi incolla qui sotto la chiave di autorizzazione. MyParcel recupera automaticamente gli ordini recenti dall’account; non devi inserire numeri di tracciamento.","subtitle":"Integrazione automatica dell’account Click & Drop"},"sv":{"apiKey":"Click & Drop API-nyckel","connectRm":"Anslut Royal Mail","note":"Skapa en Click & Drop API-integration i Royal Mail under Settings → Integrations → Click & Drop API och klistra in auktoriseringsnyckeln nedan. MyParcel hämtar automatiskt senaste beställningar från kontot; du anger inga spårningsnummer.","subtitle":"Automatisk integration med Click & Drop-kontot"},"no":{"apiKey":"Click & Drop API-nøkkel","connectRm":"Koble til Royal Mail","note":"Opprett en Click & Drop API-integrasjon i Royal Mail under Settings → Integrations → Click & Drop API, og lim inn autorisasjonsnøkkelen nedenfor. MyParcel henter automatisk nylige bestillinger fra kontoen; du trenger ikke å skrive inn sporingsnumre.","subtitle":"Automatisk integrasjon med Click & Drop-kontoen"},"es":{"apiKey":"Clave API de Click & Drop","connectRm":"Conectar Royal Mail","note":"Crea una integración Click & Drop API en Royal Mail en Settings → Integrations → Click & Drop API y pega abajo su clave de autorización. MyParcel obtiene automáticamente los pedidos recientes de la cuenta; no tienes que introducir números de seguimiento.","subtitle":"Integración automática con la cuenta de Click & Drop"},"da":{"apiKey":"Click & Drop API-nøgle","connectRm":"Forbind Royal Mail","note":"Opret en Click & Drop API-integration i Royal Mail under Settings → Integrations → Click & Drop API, og indsæt autorisationsnøglen nedenfor. MyParcel henter automatisk de seneste ordrer fra kontoen; du skal ikke indtaste sporingsnumre.","subtitle":"Automatisk integration med Click & Drop-kontoen"},"ru":{"apiKey":"Ключ API Click & Drop","connectRm":"Подключить Royal Mail","note":"Создайте интеграцию Click & Drop API в Royal Mail в разделе Settings → Integrations → Click & Drop API и вставьте ниже её ключ авторизации. MyParcel автоматически получает последние заказы из аккаунта; вводить номера отслеживания не нужно.","subtitle":"Автоматическая интеграция с аккаунтом Click & Drop"},"pl":{"apiKey":"Klucz API Click & Drop","connectRm":"Połącz Royal Mail","note":"Utwórz integrację Click & Drop API w Royal Mail w Settings → Integrations → Click & Drop API i wklej poniżej jej klucz autoryzacyjny. MyParcel automatycznie pobiera ostatnie zamówienia z konta; nie musisz wpisywać numerów przesyłek.","subtitle":"Automatyczna integracja z kontem Click & Drop"},"ko":{"apiKey":"Click & Drop API 키","connectRm":"Royal Mail 연결","note":"Royal Mail의 Settings → Integrations → Click & Drop API에서 Click & Drop API 연동을 만든 뒤 인증 키를 아래에 붙여 넣으세요. MyParcel이 계정의 최근 주문을 자동으로 가져오므로 운송장 번호를 입력할 필요가 없습니다.","subtitle":"Click & Drop 계정 자동 연동"},"ar":{"apiKey":"مفتاح Click & Drop API","connectRm":"ربط Royal Mail","note":"أنشئ تكامل Click & Drop API في Royal Mail من Settings ← Integrations ← Click & Drop API ثم الصق مفتاح التفويض أدناه. يجلب MyParcel الطلبات الأخيرة من الحساب تلقائيًا؛ ولا حاجة لإدخال أرقام التتبع.","subtitle":"تكامل تلقائي مع حساب Click & Drop"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
connect.onclick=async()=>{connect.disabled=true;try{const r=await Homey.emit('connect',{apiKey:apiKey.value.trim()});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));connect.disabled=false}};
</script></body></html>
