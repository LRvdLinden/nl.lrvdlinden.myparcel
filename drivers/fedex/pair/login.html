<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 28px}.logo{display:flex;align-items:center;justify-content:center;min-height:100px;margin:8px 0 20px}.logo img{display:block;max-width:210px;max-height:86px;object-fit:contain}.note{font-size:12px;line-height:1.45;opacity:.72}.homey-form-group{margin-bottom:14px}.tracks{min-height:90px;resize:vertical}</style><style>:dir(rtl){direction:rtl;text-align:right}</style></head><body>
<div class="logo"><img src="../../../assets/fedex-logo.svg" alt="FedEx"></div><h1 class="homey-title">FedEx</h1><p class="homey-subtitle" id="subtitle">Connect a FedEx Developer API project.</p><p class="note" id="note">FedEx uses developer API credentials for third-party integrations. Enter your Client ID and Client Secret and the tracking numbers this device should follow.</p>
<div class="homey-form-group"><label class="homey-form-label">Client ID</label><input id="clientId" class="homey-form-input"></div><div class="homey-form-group"><label class="homey-form-label">Client Secret</label><input id="clientSecret" type="password" class="homey-form-input"></div><div class="homey-form-group"><label class="homey-form-label" id="trackLabel">Tracking numbers (one per line)</label><textarea id="trackingNumbers" class="homey-form-input tracks"></textarea></div><button id="go" class="homey-button-primary-full">Connect FedEx</button>
<script>const nl=(navigator.language||'en').toLowerCase().startsWith('nl');if(nl){subtitle.textContent='Koppel een FedEx Developer API-project.';note.textContent='FedEx gebruikt developer API-gegevens voor externe integraties. Vul Client ID en Client Secret in en voeg de trackingnummers toe die dit device moet volgen.';trackLabel.textContent='Trackingnummers (één per regel)';go.textContent='FedEx koppelen'}go.onclick=async()=>{go.disabled=true;try{const r=await Homey.emit('login',{clientId:clientId.value.trim(),clientSecret:clientSecret.value,trackingNumbers:trackingNumbers.value});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));go.disabled=false}}</script></body></html>
