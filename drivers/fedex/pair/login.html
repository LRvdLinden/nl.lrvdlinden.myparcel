<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}textarea{min-height:90px}</style></head><body>
<div class="logo"><img src="../../../assets/fedex-logo.svg" alt="FedEx"></div><h1 class="homey-title">FedEx</h1><p class="homey-subtitle" data-t="subtitle"></p><p class="note" data-t="note"></p>
<div class="homey-form-group"><label class="homey-form-label" for="clientId" data-t="clientId"></label><input id="clientId" class="homey-form-input" dir="ltr"></div><div class="homey-form-group"><label class="homey-form-label" for="clientSecret" data-t="clientSecret"></label><input id="clientSecret" type="password" class="homey-form-input"></div><div class="homey-form-group"><label class="homey-form-label" for="trackingNumbers" data-t="trackLabel"></label><textarea id="trackingNumbers" class="homey-form-input" dir="ltr"></textarea></div><button id="go" class="homey-button-primary-full" data-t="connectFedex"></button>
<script>
const I18N={"en":{"clientId":"Client ID","clientSecret":"Client Secret","connectFedex":"Connect FedEx","note":"FedEx uses developer API credentials for third-party integrations. Enter your Client ID and Client Secret and the tracking numbers this device should follow.","subtitle":"Connect a FedEx Developer API project.","trackLabel":"Tracking numbers (one per line)"},"nl":{"clientId":"Client-ID","clientSecret":"Client-secret","connectFedex":"FedEx koppelen","note":"FedEx gebruikt developer-API-gegevens voor externe koppelingen. Vul je Client ID en Client Secret in en de trackingnummers die dit apparaat moet volgen.","subtitle":"Koppel een FedEx Developer API-project.","trackLabel":"Trackingnummers (één per regel)"},"de":{"clientId":"Client-ID","clientSecret":"Client-Secret","connectFedex":"FedEx verbinden","note":"FedEx nutzt Entwickler-API-Zugangsdaten für Drittanbieter-Integrationen. Gib Client-ID und Client-Secret sowie die Sendungsnummern ein, die dieses Gerät verfolgen soll.","subtitle":"Verbinde ein FedEx-Developer-API-Projekt.","trackLabel":"Sendungsnummern (eine pro Zeile)"},"fr":{"clientId":"ID client","clientSecret":"Secret client","connectFedex":"Connecter FedEx","note":"FedEx utilise des identifiants d’API développeur pour les intégrations tierces. Saisissez votre ID client, votre secret client et les numéros de suivi que cet appareil doit suivre.","subtitle":"Connectez un projet FedEx Developer API.","trackLabel":"Numéros de suivi (un par ligne)"},"it":{"clientId":"ID client","clientSecret":"Segreto client","connectFedex":"Collega FedEx","note":"FedEx usa credenziali API per sviluppatori per le integrazioni di terze parti. Inserisci Client ID, Client Secret e i numeri di tracciamento che questo dispositivo deve seguire.","subtitle":"Collega un progetto FedEx Developer API.","trackLabel":"Numeri di tracciamento (uno per riga)"},"sv":{"clientId":"Klient-ID","clientSecret":"Klienthemlighet","connectFedex":"Anslut FedEx","note":"FedEx använder API-uppgifter för utvecklare för tredjepartsintegrationer. Ange klient-ID, klienthemlighet och de spårningsnummer som enheten ska följa.","subtitle":"Anslut ett FedEx Developer API-projekt.","trackLabel":"Spårningsnummer (ett per rad)"},"no":{"clientId":"Klient-ID","clientSecret":"Klienthemmelighet","connectFedex":"Koble til FedEx","note":"FedEx bruker utvikler-API-påloggingsdata for tredjepartsintegrasjoner. Skriv inn klient-ID, klienthemmelighet og sporingsnumrene denne enheten skal følge.","subtitle":"Koble til et FedEx Developer API-prosjekt.","trackLabel":"Sporingsnumre (ett per linje)"},"es":{"clientId":"ID de cliente","clientSecret":"Secreto de cliente","connectFedex":"Conectar FedEx","note":"FedEx usa credenciales de API para desarrolladores en integraciones de terceros. Introduce tu ID de cliente, el secreto de cliente y los números de seguimiento que debe seguir este dispositivo.","subtitle":"Conecta un proyecto de FedEx Developer API.","trackLabel":"Números de seguimiento (uno por línea)"},"da":{"clientId":"Klient-id","clientSecret":"Klienthemmelighed","connectFedex":"Forbind FedEx","note":"FedEx bruger udvikler-API-oplysninger til tredjepartsintegrationer. Indtast klient-id, klienthemmelighed og de sporingsnumre, enheden skal følge.","subtitle":"Forbind et FedEx Developer API-projekt.","trackLabel":"Sporingsnumre (ét pr. linje)"},"ru":{"clientId":"Идентификатор клиента (Client ID)","clientSecret":"Секрет клиента (Client Secret)","connectFedex":"Подключить FedEx","note":"FedEx использует учётные данные API разработчика для сторонних интеграций. Введите Client ID, Client Secret и номера отслеживания, которые должно отслеживать это устройство.","subtitle":"Подключите проект FedEx Developer API.","trackLabel":"Номера отслеживания (по одному в строке)"},"pl":{"clientId":"Identyfikator klienta","clientSecret":"Sekret klienta","connectFedex":"Połącz FedEx","note":"FedEx używa danych API dla deweloperów w integracjach zewnętrznych. Wpisz identyfikator klienta, sekret klienta i numery przesyłek, które to urządzenie ma śledzić.","subtitle":"Połącz projekt FedEx Developer API.","trackLabel":"Numery przesyłek (jeden w wierszu)"},"ko":{"clientId":"클라이언트 ID","clientSecret":"클라이언트 시크릿","connectFedex":"FedEx 연결","note":"FedEx는 타사 연동에 개발자 API 자격 증명을 사용합니다. 클라이언트 ID와 클라이언트 시크릿, 이 기기에서 추적할 운송장 번호를 입력하세요.","subtitle":"FedEx Developer API 프로젝트를 연결하세요.","trackLabel":"운송장 번호 (한 줄에 하나씩)"},"ar":{"clientId":"معرّف العميل","clientSecret":"سر العميل","connectFedex":"ربط FedEx","note":"يستخدم FedEx بيانات اعتماد API للمطورين في عمليات التكامل الخارجية. أدخل معرّف العميل وسر العميل وأرقام التتبع التي يجب أن يتابعها هذا الجهاز.","subtitle":"اربط مشروع FedEx Developer API.","trackLabel":"أرقام التتبع (رقم واحد في كل سطر)"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
go.onclick=async()=>{go.disabled=true;try{const r=await Homey.emit('login',{clientId:clientId.value.trim(),clientSecret:clientSecret.value,trackingNumbers:trackingNumbers.value});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));go.disabled=false}};
</script></body></html>
