<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 28px}.logo{text-align:center;margin:8px 0 22px}.logo img{max-width:190px;max-height:82px}.codes{min-height:130px;resize:vertical}.note{font-size:13px;opacity:.75;line-height:1.45}</style><style>:dir(rtl){direction:rtl;text-align:right}</style></head><body><div class="logo"><img src="../../../assets/inpost-uk-logo.svg"></div><h1 class="homey-title">Connect InPost UK</h1><p class="homey-subtitle">Add the parcel numbers you want Homey to track.</p><p class="note">Enter one InPost UK parcel number per line. MyParcel reads the live tracking information from InPost UK's tracking service.</p><div class="homey-form-group"><label class="homey-form-label">Parcel numbers</label><textarea id="trackingCodes" class="homey-form-input codes" placeholder="One per line"></textarea></div><button id="connect" class="homey-button-primary-full">Add InPost UK device</button><script>connect.onclick=async()=>{connect.disabled=true;try{const r=await Homey.emit('connect',{trackingCodes:trackingCodes.value});await Homey.createDevice(r.device);Homey.done()}catch(e){Homey.alert(e.message||String(e));connect.disabled=false}}</script></body></html>
