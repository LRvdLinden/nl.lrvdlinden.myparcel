<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:200px;height:auto;max-height:84px;object-fit:contain}.hint{opacity:.72;font-size:12px;line-height:1.45;margin:4px 0 10px}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px}</style></head><body><div class="logo"><img src="../../../assets/inpost-uk-logo.svg" alt="InPost"></div><h1 class="homey-title">InPost</h1><p class="homey-subtitle" data-t="subtitle"></p>
<div class="homey-form-group"><label class="homey-form-label" for="country" data-t="country"></label><select id="country" class="homey-form-select"><option value="GB">United Kingdom</option><option value="PL">Polska</option><option value="IT">Italia</option><option value="PT">Portugal</option><option value="ES">España</option></select></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-textarea" rows="4"></textarea><div class="hint" data-t="hint"></div></div>
<button id="track" class="homey-button-primary-full" data-t="track"></button><div id="status" class="status"></div>
<details class="box"><summary data-t="account"></summary><p class="hint" data-t="accountHint"></p>
<div class="homey-form-group"><label class="homey-form-label" for="market" data-t="market"></label><select id="market" class="homey-form-select"><option value="PL">Polska</option><option value="IT">Italia</option></select></div>
<button id="open" class="homey-button-secondary-full" data-t="open"></button>
<div class="homey-form-group"><label class="homey-form-label" for="cb" data-t="callback"></label><input id="cb" class="homey-form-input" placeholder="https://account.inpost-group.com/callback?code=…"></div>
<button id="connect" class="homey-button-primary-full" data-t="connect"></button></details><script>const I18N={"en": {"subtitle": "Track InPost parcels with their number in the UK, Poland, Italy, Portugal or Spain, or sign in to your InPost account (Poland/Italy).", "country": "Country", "tracking": "Parcel numbers", "hint": "One per line.", "track": "Track parcels", "account": "Use an InPost account (Poland / Italy, optional)", "accountHint": "Open the InPost sign-in, log in with your phone number and SMS code, then copy the full https://account.inpost-group.com/callback?… address from the address bar and paste it here.", "market": "Account country", "open": "Open InPost sign-in", "callback": "Callback address", "connect": "Connect account", "checking": "Checking…", "empty": "Enter at least one parcel number.", "emptyCb": "Paste the callback address first."}, "nl": {"subtitle": "Volg InPost-pakketten met hun nummer in het VK, Polen, Italië, Portugal of Spanje, of log in met je InPost-account (Polen/Italië).", "country": "Land", "tracking": "Pakketnummers", "hint": "Eén per regel.", "track": "Pakketten volgen", "account": "InPost-account gebruiken (Polen / Italië, optioneel)", "accountHint": "Open de InPost-login, log in met je telefoonnummer en sms-code en kopieer daarna het volledige https://account.inpost-group.com/callback?…-adres uit de adresbalk en plak het hier.", "market": "Land van het account", "open": "InPost-login openen", "callback": "Callback-adres", "connect": "Account koppelen", "checking": "Controleren…", "empty": "Vul minstens één pakketnummer in.", "emptyCb": "Plak eerst het callback-adres."}, "de": {"subtitle": "Verfolge InPost-Pakete per Nummer (UK, Polen, Italien, Portugal, Spanien) oder melde dich mit deinem InPost-Konto an (Polen/Italien).", "country": "Land", "tracking": "Sendungsnummern", "hint": "Eine pro Zeile.", "track": "Pakete verfolgen", "account": "InPost-Konto verwenden (Polen / Italien, optional)", "market": "Konto-Land", "open": "InPost-Anmeldung öffnen", "callback": "Callback-Adresse", "connect": "Konto verbinden", "checking": "Wird geprüft…", "empty": "Gib mindestens eine Sendungsnummer ein."}, "pl": {"subtitle": "Śledź paczki InPost po numerze albo zaloguj się na konto InPost (Polska/Włochy).", "country": "Kraj", "tracking": "Numery paczek", "hint": "Jeden w wierszu.", "track": "Śledź paczki", "account": "Użyj konta InPost (Polska / Włochy)", "market": "Kraj konta", "open": "Otwórz logowanie InPost", "callback": "Adres zwrotny", "connect": "Połącz konto", "checking": "Sprawdzanie…", "empty": "Wpisz co najmniej jeden numer paczki."}, "it": {"subtitle": "Segui i pacchi InPost con il numero oppure accedi al tuo account InPost (Polonia/Italia).", "country": "Paese", "tracking": "Numeri dei pacchi", "track": "Segui i pacchi", "account": "Usa un account InPost (Polonia / Italia)", "market": "Paese dell'account", "open": "Apri accesso InPost", "connect": "Collega account", "empty": "Inserisci almeno un numero."}};function lang(){const l=String(navigator.language||'en').toLowerCase().split('-')[0];return I18N[l]?l:'en'}const L=lang(),T=Object.assign({},I18N.en,I18N[L]);document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=T[el.getAttribute('data-t')]||''});async function run(btn,event,data){btn.disabled=true;status.textContent=T.checking||'';try{const r=await Homey.emit(event,data);await Homey.createDevice(r.device);Homey.done()}catch(e){status.textContent='';Homey.alert(e&&e.message||String(e))}finally{btn.disabled=false}}track.onclick=()=>{if(!tracking.value.trim())return Homey.alert(T.empty);run(track,'connect',{trackingCodes:tracking.value,country:country.value})};open.onclick=async()=>{try{const r=await Homey.emit('account_url',{market:market.value});Homey.openURL?Homey.openURL(r.url):window.open(r.url,'_blank')}catch(e){Homey.alert(e&&e.message||String(e))}};connect.onclick=()=>{if(!cb.value.trim())return Homey.alert(T.emptyCb);run(connect,'account_login',{callback:cb.value,trackingCodes:tracking.value})};</script></body></html>
