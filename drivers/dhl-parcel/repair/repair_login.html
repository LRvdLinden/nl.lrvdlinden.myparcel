<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/dhl-logo.svg" alt="DHL"></div><h1 class="homey-title" data-t="titleRepair"></h1><p class="homey-subtitle" data-t="subtitleRepair"></p>
<div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="username" dir="ltr"></div>
<div class="homey-form-group"><label class="homey-form-label" for="password" data-t="password"></label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div>
<button id="connect" class="homey-button-primary-full" data-t="connectAccount"></button><div id="status" class="status" role="status"></div>
<script>
const I18N={"en":{"checkingAccount":"Checking your account…","connectAccount":"Connect account","done":"Connected.","email":"E-mail address","emptyLogin":"Enter your e-mail address and password.","failedAccount":"Could not connect your DHL account.","password":"Password","subtitleRepair":"Connect this device to one DHL account.","titleRepair":"Connect My DHL"},"nl":{"checkingAccount":"Account controleren…","connectAccount":"Account koppelen","done":"Gekoppeld.","email":"E-mailadres","emptyLogin":"Vul je e-mailadres en wachtwoord in.","failedAccount":"DHL-account koppelen is mislukt.","password":"Wachtwoord","subtitleRepair":"Koppel dit apparaat aan één DHL-account.","titleRepair":"My DHL koppelen"},"de":{"checkingAccount":"Konto wird geprüft…","connectAccount":"Konto verbinden","done":"Verbunden.","email":"E-Mail-Adresse","emptyLogin":"Gib deine E-Mail-Adresse und dein Passwort ein.","failedAccount":"DHL-Konto konnte nicht verbunden werden.","password":"Passwort","subtitleRepair":"Verbinde dieses Gerät mit einem DHL-Konto.","titleRepair":"My DHL verbinden"},"fr":{"checkingAccount":"Vérification du compte…","connectAccount":"Connecter le compte","done":"Connecté.","email":"Adresse e-mail","emptyLogin":"Saisissez votre adresse e-mail et votre mot de passe.","failedAccount":"Impossible de connecter le compte DHL.","password":"Mot de passe","subtitleRepair":"Connectez cet appareil à un compte DHL.","titleRepair":"Connecter My DHL"},"it":{"checkingAccount":"Verifica dell’account…","connectAccount":"Collega account","done":"Collegato.","email":"Indirizzo e-mail","emptyLogin":"Inserisci indirizzo e-mail e password.","failedAccount":"Impossibile collegare l’account DHL.","password":"Password","subtitleRepair":"Collega questo dispositivo a un account DHL.","titleRepair":"Collega My DHL"},"sv":{"checkingAccount":"Kontrollerar kontot…","connectAccount":"Anslut konto","done":"Ansluten.","email":"E-postadress","emptyLogin":"Ange din e-postadress och ditt lösenord.","failedAccount":"Det gick inte att ansluta DHL-kontot.","password":"Lösenord","subtitleRepair":"Anslut den här enheten till ett DHL-konto.","titleRepair":"Anslut My DHL"},"no":{"checkingAccount":"Kontrollerer kontoen…","connectAccount":"Koble til konto","done":"Tilkoblet.","email":"E-postadresse","emptyLogin":"Skriv inn e-postadressen og passordet ditt.","failedAccount":"Kunne ikke koble til DHL-kontoen.","password":"Passord","subtitleRepair":"Koble denne enheten til én DHL-konto.","titleRepair":"Koble til My DHL"},"es":{"checkingAccount":"Comprobando la cuenta…","connectAccount":"Conectar cuenta","done":"Conectado.","email":"Correo electrónico","emptyLogin":"Introduce tu correo electrónico y contraseña.","failedAccount":"No se pudo conectar la cuenta DHL.","password":"Contraseña","subtitleRepair":"Conecta este dispositivo a una cuenta DHL.","titleRepair":"Conectar My DHL"},"da":{"checkingAccount":"Kontrollerer kontoen…","connectAccount":"Forbind konto","done":"Forbundet.","email":"E-mailadresse","emptyLogin":"Indtast din e-mailadresse og adgangskode.","failedAccount":"DHL-kontoen kunne ikke forbindes.","password":"Adgangskode","subtitleRepair":"Forbind denne enhed med én DHL-konto.","titleRepair":"Forbind My DHL"},"ru":{"checkingAccount":"Проверка аккаунта…","connectAccount":"Подключить аккаунт","done":"Подключено.","email":"Адрес электронной почты","emptyLogin":"Введите адрес электронной почты и пароль.","failedAccount":"Не удалось подключить аккаунт DHL.","password":"Пароль","subtitleRepair":"Подключите это устройство к одному аккаунту DHL.","titleRepair":"Подключить My DHL"},"pl":{"checkingAccount":"Sprawdzanie konta…","connectAccount":"Połącz konto","done":"Połączono.","email":"Adres e-mail","emptyLogin":"Wpisz adres e-mail i hasło.","failedAccount":"Nie udało się połączyć konta DHL.","password":"Hasło","subtitleRepair":"Połącz to urządzenie z jednym kontem DHL.","titleRepair":"Połącz My DHL"},"ko":{"checkingAccount":"계정 확인 중…","connectAccount":"계정 연결","done":"연결되었습니다.","email":"이메일 주소","emptyLogin":"이메일 주소와 비밀번호를 입력하세요.","failedAccount":"DHL 계정을 연결할 수 없습니다.","password":"비밀번호","subtitleRepair":"이 기기를 하나의 DHL 계정에 연결하세요.","titleRepair":"My DHL 연결"},"ar":{"checkingAccount":"جارٍ التحقق من الحساب…","connectAccount":"ربط الحساب","done":"تم الربط.","email":"عنوان البريد الإلكتروني","emptyLogin":"أدخل عنوان بريدك الإلكتروني وكلمة المرور.","failedAccount":"تعذّر ربط حساب DHL.","password":"كلمة المرور","subtitleRepair":"اربط هذا الجهاز بحساب DHL واحد.","titleRepair":"ربط My DHL"}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
connect.onclick=async()=>{if(!email.value.trim()||!password.value)return Homey.alert(t('emptyLogin'));connect.disabled=true;statusEl.textContent=t('checkingAccount');try{const r=await Homey.emit('repair_login',{email:email.value.trim(),password:password.value});statusEl.textContent=t('done');Homey.done()}catch(e){statusEl.textContent='';Homey.alert(e?.message||t('failedAccount'))}finally{connect.disabled=false}};
</script></body></html>
