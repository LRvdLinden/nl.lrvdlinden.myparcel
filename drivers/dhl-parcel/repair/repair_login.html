<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 22px}.logo img{display:block;width:auto;max-width:190px;height:auto;max-height:82px;object-fit:contain;object-position:center}.hint{opacity:.7;font-size:12px;line-height:1.45}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.75}</style></head><body>
