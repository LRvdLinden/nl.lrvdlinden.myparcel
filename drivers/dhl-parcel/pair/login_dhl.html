<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:200px;height:auto;max-height:84px;object-fit:contain}.hint{opacity:.72;font-size:12px;line-height:1.45;margin:4px 0 10px}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px}.or{margin:18px 0 6px;font-weight:700}</style></head><body><div class="logo"><img src="../../../assets/dhl-logo.svg" alt="DHL"></div><h1 class="homey-title" data-t="title"></h1><p class="homey-subtitle" data-t="subtitle"></p>
<p class="or" data-t="account"></p>
<div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="username"></div>
<div class="homey-form-group"><label class="homey-form-label" for="password" data-t="password"></label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-textarea" rows="4" autocomplete="off"></textarea><div class="hint" data-t="trackingHint"></div></div>
<button id="connect" class="homey-button-primary-full" data-t="connect"></button><div id="status" class="status"></div><script>const I18N={"en": {"title": "Connect DHL", "subtitle": "Sign in with My DHL to see all your parcels automatically, or only enter tracking numbers – you can also do both.", "account": "My DHL account (optional)", "email": "E-mail address", "password": "Password", "tracking": "Tracking numbers (optional)", "trackingHint": "One per line, e.g. JJD0000000000000000000 or 3SABC1234567890. Add a postcode for the tracking link and “out” for a parcel you send yourself.", "connect": "Add DHL", "checking": "Checking…", "done": "Connected.", "empty": "Enter your My DHL account, or at least one tracking number.", "failed": "Could not connect DHL."}, "nl": {"title": "DHL koppelen", "subtitle": "Log in met My DHL om al je pakketten automatisch te zien, of vul alleen trackingnummers in – allebei kan ook.", "account": "My DHL-account (optioneel)", "email": "E-mailadres", "password": "Wachtwoord", "tracking": "Trackingnummers (optioneel)", "trackingHint": "Eén per regel, bijv. JJD0000000000000000000 of 3SABC1234567890. Voeg een postcode toe voor de trackinglink en “uit” voor een pakket dat je zelf verstuurt.", "connect": "DHL toevoegen", "checking": "Controleren…", "done": "Gekoppeld.", "empty": "Vul je My DHL-account in, of minstens één trackingnummer.", "failed": "DHL koppelen is mislukt."}, "de": {"title": "DHL verbinden", "subtitle": "Melde dich bei My DHL an, um alle Pakete automatisch zu sehen, oder gib nur Sendungsnummern ein – beides geht auch.", "account": "My-DHL-Konto (optional)", "email": "E-Mail-Adresse", "password": "Passwort", "tracking": "Sendungsnummern (optional)", "trackingHint": "Eine pro Zeile, z. B. JJD0000000000000000000 oder 3SABC1234567890. Optional eine Postleitzahl und „out“ für selbst versendete Pakete.", "connect": "DHL hinzufügen", "checking": "Wird geprüft…", "done": "Verbunden.", "empty": "Gib dein My-DHL-Konto oder mindestens eine Sendungsnummer ein.", "failed": "DHL konnte nicht verbunden werden."}, "fr": {"title": "Connecter DHL", "subtitle": "Connectez-vous à My DHL pour voir tous vos colis, ou saisissez seulement des numéros de suivi – les deux sont possibles.", "account": "Compte My DHL (facultatif)", "email": "Adresse e-mail", "password": "Mot de passe", "tracking": "Numéros de suivi (facultatif)", "trackingHint": "Un par ligne, p. ex. JJD0000000000000000000 ou 3SABC1234567890. Ajoutez un code postal et « out » pour un colis envoyé.", "connect": "Ajouter DHL", "checking": "Vérification…", "done": "Connecté.", "empty": "Saisissez votre compte My DHL ou au moins un numéro de suivi.", "failed": "Impossible de connecter DHL."}, "it": {"title": "Collega DHL", "subtitle": "Accedi con My DHL per vedere tutti i pacchi, oppure inserisci solo i numeri di tracciamento – o entrambi.", "account": "Account My DHL (facoltativo)", "email": "Indirizzo e-mail", "password": "Password", "tracking": "Numeri di tracciamento (facoltativo)", "connect": "Aggiungi DHL", "checking": "Verifica…", "done": "Collegato.", "empty": "Inserisci il tuo account My DHL o almeno un numero di tracciamento.", "failed": "Impossibile collegare DHL."}, "es": {"title": "Conectar DHL", "subtitle": "Inicia sesión en My DHL para ver todos tus paquetes, o introduce solo números de seguimiento; también puedes hacer ambas cosas.", "account": "Cuenta My DHL (opcional)", "email": "Correo electrónico", "password": "Contraseña", "tracking": "Números de seguimiento (opcional)", "connect": "Añadir DHL", "checking": "Comprobando…", "done": "Conectado.", "empty": "Introduce tu cuenta My DHL o al menos un número de seguimiento.", "failed": "No se pudo conectar DHL."}};function lang(){const l=String(navigator.language||'en').toLowerCase().split('-')[0];return I18N[l]?l:'en'}const L=lang(),T=Object.assign({},I18N.en,I18N[L]);document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{const k=el.getAttribute('data-t');if(el.placeholder!==undefined&&el.tagName!=='BUTTON'&&el.hasAttribute('data-ph'))el.placeholder=T[k];else el.textContent=T[k]});connect.onclick=async()=>{const data={email:email.value.trim(),password:password.value,tracking:tracking.value};if(!data.email&&!data.password&&!data.tracking.trim())return Homey.alert(T.empty);connect.disabled=true;status.textContent=T.checking;try{const r=await Homey.emit('login_dhl',data);await Homey.createDevice(r.device);status.textContent=T.done;Homey.done()}catch(e){status.textContent='';Homey.alert(e&&e.message||T.failed)}finally{connect.disabled=false}};</script></body></html>
