<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{padding:0 4px 24px}.logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:92px;margin:8px 0 18px}.logo img{display:block;width:auto;max-width:min(220px,100%);height:auto;max-height:86px;object-fit:contain}.hint,.note{opacity:.72;font-size:12px;line-height:1.45;margin-block:4px 10px;overflow-wrap:anywhere}.status{margin:12px 0;text-align:center;font-size:12px;opacity:.8}.box{margin-top:18px;padding-top:14px;border-top:1px solid rgba(127,127,127,.25)}details summary{cursor:pointer;font-weight:700;margin:6px 0}textarea{min-height:84px;resize:vertical}.or{margin:18px 0 6px;font-weight:700}.homey-form-group{margin-bottom:14px}.hidden{display:none}.homey-form-label,.homey-title,.homey-subtitle,button{overflow-wrap:anywhere;white-space:normal}</style></head><body>
<div class="logo"><img src="../../../assets/dhl-logo.svg" alt="DHL"></div><h1 class="homey-title" data-t="title"></h1><p class="homey-subtitle" data-t="subtitle"></p>
<p class="or" data-t="account"></p>
<div class="homey-form-group"><label class="homey-form-label" for="email" data-t="email"></label><input id="email" class="homey-form-input" type="email" autocomplete="username" dir="ltr"></div>
<div class="homey-form-group"><label class="homey-form-label" for="password" data-t="password"></label><input id="password" class="homey-form-input" type="password" autocomplete="current-password"></div>
<div class="homey-form-group"><label class="homey-form-label" for="tracking" data-t="tracking"></label><textarea id="tracking" class="homey-form-textarea" rows="4" autocomplete="off" dir="ltr"></textarea><div class="hint" data-t="trackingHint"></div></div>
<button id="connect" class="homey-button-primary-full" data-t="addDhl"></button><div id="status" class="status" role="status"></div>
<script>
const I18N={"en":{"account":"My DHL account (optional)","addDhl":"Add DHL","checking":"Checking…","done":"Connected.","email":"E-mail address","empty":"Enter your My DHL account, or at least one tracking number.","failed":"Could not connect DHL.","password":"Password","subtitle":"Sign in with My DHL to see all your parcels automatically, or only enter tracking numbers – you can also do both.","title":"Connect DHL","tracking":"Tracking numbers (optional)","trackingHint":"One per line, e.g. JJD0000000000000000000 or 3SABC1234567890. Add a postal code for the tracking link and “out” for a parcel you send yourself."},"nl":{"account":"My DHL-account (optioneel)","addDhl":"DHL toevoegen","checking":"Controleren…","done":"Gekoppeld.","email":"E-mailadres","empty":"Vul je My DHL-account in, of minstens één trackingnummer.","failed":"DHL koppelen is mislukt.","password":"Wachtwoord","subtitle":"Log in met My DHL om al je pakketten automatisch te zien, of vul alleen trackingnummers in – allebei kan ook.","title":"DHL koppelen","tracking":"Trackingnummers (optioneel)","trackingHint":"Eén per regel, bijv. JJD0000000000000000000 of 3SABC1234567890. Voeg een postcode toe voor de trackinglink en “out” voor een pakket dat je zelf verstuurt."},"de":{"account":"My-DHL-Konto (optional)","addDhl":"DHL hinzufügen","checking":"Wird geprüft…","done":"Verbunden.","email":"E-Mail-Adresse","empty":"Gib dein My-DHL-Konto oder mindestens eine Sendungsnummer ein.","failed":"DHL konnte nicht verbunden werden.","password":"Passwort","subtitle":"Melde dich bei My DHL an, um alle Pakete automatisch zu sehen, oder gib nur Sendungsnummern ein – beides geht auch.","title":"DHL verbinden","tracking":"Sendungsnummern (optional)","trackingHint":"Eine pro Zeile, z. B. JJD0000000000000000000 oder 3SABC1234567890. Füge eine Postleitzahl für den Verfolgungslink und „out“ für ein selbst versendetes Paket hinzu."},"fr":{"account":"Compte My DHL (facultatif)","addDhl":"Ajouter DHL","checking":"Vérification…","done":"Connecté.","email":"Adresse e-mail","empty":"Saisissez votre compte My DHL ou au moins un numéro de suivi.","failed":"Impossible de connecter DHL.","password":"Mot de passe","subtitle":"Connectez-vous à My DHL pour voir automatiquement tous vos colis, ou saisissez seulement des numéros de suivi – les deux sont possibles.","title":"Connecter DHL","tracking":"Numéros de suivi (facultatif)","trackingHint":"Un par ligne, p. ex. JJD0000000000000000000 ou 3SABC1234567890. Ajoutez un code postal pour le lien de suivi et « out » pour un colis que vous envoyez vous-même."},"it":{"account":"Account My DHL (facoltativo)","addDhl":"Aggiungi DHL","checking":"Verifica in corso…","done":"Collegato.","email":"Indirizzo e-mail","empty":"Inserisci il tuo account My DHL o almeno un numero di tracciamento.","failed":"Impossibile collegare DHL.","password":"Password","subtitle":"Accedi con My DHL per vedere automaticamente tutti i pacchi, oppure inserisci solo i numeri di tracciamento – puoi anche fare entrambe le cose.","title":"Collega DHL","tracking":"Numeri di tracciamento (facoltativo)","trackingHint":"Uno per riga, ad es. JJD0000000000000000000 o 3SABC1234567890. Aggiungi un codice postale per il link di tracciamento e “out” per un pacco che invii tu."},"sv":{"account":"My DHL-konto (valfritt)","addDhl":"Lägg till DHL","checking":"Kontrollerar…","done":"Ansluten.","email":"E-postadress","empty":"Ange ditt My DHL-konto eller minst ett spårningsnummer.","failed":"Det gick inte att ansluta DHL.","password":"Lösenord","subtitle":"Logga in med My DHL för att automatiskt se alla dina paket, eller ange bara spårningsnummer – du kan också göra båda.","title":"Anslut DHL","tracking":"Spårningsnummer (valfritt)","trackingHint":"Ett per rad, t.ex. JJD0000000000000000000 eller 3SABC1234567890. Lägg till ett postnummer för spårningslänken och ”out” för ett paket du skickar själv."},"no":{"account":"My DHL-konto (valgfritt)","addDhl":"Legg til DHL","checking":"Kontrollerer…","done":"Tilkoblet.","email":"E-postadresse","empty":"Skriv inn My DHL-kontoen din eller minst ett sporingsnummer.","failed":"Kunne ikke koble til DHL.","password":"Passord","subtitle":"Logg inn med My DHL for å se alle pakkene dine automatisk, eller skriv bare inn sporingsnumre – du kan også gjøre begge deler.","title":"Koble til DHL","tracking":"Sporingsnumre (valgfritt)","trackingHint":"Ett per linje, f.eks. JJD0000000000000000000 eller 3SABC1234567890. Legg til et postnummer for sporingslenken og «out» for en pakke du sender selv."},"es":{"account":"Cuenta My DHL (opcional)","addDhl":"Añadir DHL","checking":"Comprobando…","done":"Conectado.","email":"Correo electrónico","empty":"Introduce tu cuenta My DHL o al menos un número de seguimiento.","failed":"No se pudo conectar DHL.","password":"Contraseña","subtitle":"Inicia sesión en My DHL para ver todos tus paquetes automáticamente, o introduce solo números de seguimiento; también puedes hacer ambas cosas.","title":"Conectar DHL","tracking":"Números de seguimiento (opcional)","trackingHint":"Uno por línea, p. ej. JJD0000000000000000000 o 3SABC1234567890. Añade un código postal para el enlace de seguimiento y «out» para un paquete que envías tú."},"da":{"account":"My DHL-konto (valgfrit)","addDhl":"Tilføj DHL","checking":"Kontrollerer…","done":"Forbundet.","email":"E-mailadresse","empty":"Indtast din My DHL-konto eller mindst ét sporingsnummer.","failed":"DHL kunne ikke forbindes.","password":"Adgangskode","subtitle":"Log ind med My DHL for automatisk at se alle dine pakker, eller indtast kun sporingsnumre – du kan også gøre begge dele.","title":"Forbind DHL","tracking":"Sporingsnumre (valgfrit)","trackingHint":"Ét pr. linje, f.eks. JJD0000000000000000000 eller 3SABC1234567890. Tilføj et postnummer til sporingslinket og “out” for en pakke, du selv sender."},"ru":{"account":"Аккаунт My DHL (необязательно)","addDhl":"Добавить DHL","checking":"Проверка…","done":"Подключено.","email":"Адрес электронной почты","empty":"Укажите аккаунт My DHL или хотя бы один номер отслеживания.","failed":"Не удалось подключить DHL.","password":"Пароль","subtitle":"Войдите в My DHL, чтобы автоматически видеть все посылки, или введите только номера отслеживания – можно и то и другое.","title":"Подключить DHL","tracking":"Номера отслеживания (необязательно)","trackingHint":"По одному в строке, например JJD0000000000000000000 или 3SABC1234567890. Добавьте почтовый индекс для ссылки отслеживания и «out» для посылки, которую отправляете вы."},"pl":{"account":"Konto My DHL (opcjonalnie)","addDhl":"Dodaj DHL","checking":"Sprawdzanie…","done":"Połączono.","email":"Adres e-mail","empty":"Podaj konto My DHL lub co najmniej jeden numer przesyłki.","failed":"Nie udało się połączyć DHL.","password":"Hasło","subtitle":"Zaloguj się do My DHL, aby automatycznie widzieć wszystkie paczki, albo wpisz tylko numery przesyłek – możesz też zrobić jedno i drugie.","title":"Połącz DHL","tracking":"Numery przesyłek (opcjonalnie)","trackingHint":"Jeden w wierszu, np. JJD0000000000000000000 lub 3SABC1234567890. Dodaj kod pocztowy dla linku śledzenia i „out” dla paczki wysyłanej przez Ciebie."},"ko":{"account":"My DHL 계정 (선택 사항)","addDhl":"DHL 추가","checking":"확인 중…","done":"연결되었습니다.","email":"이메일 주소","empty":"My DHL 계정 또는 운송장 번호를 하나 이상 입력하세요.","failed":"DHL을 연결할 수 없습니다.","password":"비밀번호","subtitle":"My DHL에 로그인해 모든 택배를 자동으로 보거나 운송장 번호만 입력하세요. 둘 다 할 수도 있습니다.","title":"DHL 연결","tracking":"운송장 번호 (선택 사항)","trackingHint":"한 줄에 하나씩 입력하세요(예: JJD0000000000000000000 또는 3SABC1234567890). 조회 링크용 우편번호와 직접 보내는 택배에는 “out”을 추가하세요."},"ar":{"account":"حساب My DHL (اختياري)","addDhl":"إضافة DHL","checking":"جارٍ التحقق…","done":"تم الربط.","email":"عنوان البريد الإلكتروني","empty":"أدخل حساب My DHL أو رقم تتبع واحدًا على الأقل.","failed":"تعذّر ربط DHL.","password":"كلمة المرور","subtitle":"سجّل الدخول إلى My DHL لعرض جميع طرودك تلقائيًا، أو أدخل أرقام التتبع فقط – ويمكنك أيضًا القيام بالأمرين.","title":"ربط DHL","tracking":"أرقام التتبع (اختياري)","trackingHint":"رقم واحد في كل سطر، مثل JJD0000000000000000000 أو 3SABC1234567890. أضف رمزًا بريديًا لرابط التتبع و”out“ للطرد الذي ترسله بنفسك."}};
const LANGS=['en','nl','de','fr','it','sv','no','es','da','ru','pl','ko','ar'];
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',ru:'ru-RU',pl:'pl-PL',ko:'ko-KR',ar:'ar'};
function pickLang(v){v=String(v||'').toLowerCase().split(/[-_]/)[0];if(v==='nb'||v==='nn')v='no';return LANGS.includes(v)?v:''}
function homeyLang(){let l='';try{l=pickLang(Homey.getLanguage&&Homey.getLanguage())}catch(_){}if(!l){try{const m=Homey.__&&Homey.__('pair.language_marker');if(m&&m!=='en')l=pickLang(m)}catch(_){}}return l||pickLang(navigator.language)||'en'}
let L='en',T=I18N.en;
function t(k,v){const s=T[k]!=null?T[k]:(I18N.en[k]!=null?I18N.en[k]:'');return String(s).replace(/\{(\w+)\}/g,(m,n)=>v&&v[n]!=null?String(v[n]):m)}
function regionName(code,fallback){try{return new Intl.DisplayNames([LOCALES[L]],{type:'region'}).of(code)||fallback||code}catch(_){return fallback||code}}
function applyLang(l){L=pickLang(l)||L||'en';T=Object.assign({},I18N.en,I18N[L]);const h=document.documentElement;h.lang=LOCALES[L];h.dir=L==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('[data-ph]').forEach(e=>{e.placeholder=t(e.dataset.ph)});document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',t(e.dataset.al))});document.querySelectorAll('[data-region]').forEach(e=>{e.textContent=regionName(e.dataset.region,e.textContent)})}
applyLang(homeyLang());
const statusEl=document.getElementById('status');
connect.onclick=async()=>{const data={email:email.value.trim(),password:password.value,tracking:tracking.value};if(!data.email&&!data.password&&!data.tracking.trim())return Homey.alert(t('empty'));connect.disabled=true;statusEl.textContent=t('checking');try{const r=await Homey.emit('login_dhl',data);await Homey.createDevice(r.device);statusEl.textContent=t('done');Homey.done()}catch(e){statusEl.textContent='';Homey.alert(e&&e.message||t('failed'))}finally{connect.disabled=false}};
</script></body></html>
