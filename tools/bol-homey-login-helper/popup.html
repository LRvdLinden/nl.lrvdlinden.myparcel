<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#101054}.wrap{width:360px;background:#fff}.hero{background:#0800b8;color:#fff;padding:22px 20px 18px;text-align:center}.logo{font-size:48px;font-weight:800;letter-spacing:-4px}.tag{font-size:16px;margin-top:1px}.body{padding:20px 22px 22px;text-align:center}.body h2{margin:0 0 10px;font-size:20px}.body p{font-size:14px;line-height:1.45;color:#31313d}.btn{border:0;border-radius:9px;padding:12px 15px;width:100%;font-weight:700;font-size:14px;cursor:pointer;margin-top:9px}.primary{background:#0800b8;color:#fff}.secondary{background:#e9e9f8;color:#101054}.ampere{font-size:35px;font-weight:800;color:#00b57a;margin:24px 0 4px}.status{padding:10px;border-radius:8px;background:#f4f4f8;font-size:13px;line-height:1.4;text-align:left;margin-top:14px}.ok{background:#e9fff6;color:#075b40}.muted{opacity:.75;font-size:12px;margin-top:12px}.row{display:flex;gap:8px}.row .btn{flex:1}:dir(rtl){direction:rtl;text-align:right}.body:dir(rtl){text-align:right}
</style></head><body><div class="wrap">
<div class="hero"><div class="logo">bol.</div><div class="tag" id="tagline"></div></div>
<div class="body"><h2 id="popupTitle"></h2><p id="introText"></p>
<button class="btn primary" id="loginBtn"></button>
<div class="status" id="statusBox"></div>
<div class="row"><button class="btn secondary" id="resultBtn"></button><button class="btn secondary" id="resetBtn"></button></div>
<div class="ampere" id="ampereTitle">Ampère</div><p id="ampereText"></p><div class="muted" id="privacyText"></div></div></div>
<script src="popup.js"></script></body></html>
