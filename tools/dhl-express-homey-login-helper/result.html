<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:15px system-ui;max-width:760px;margin:40px auto;padding:0 20px;color:#111}
.card{border:1px solid #ddd;border-radius:14px;padding:22px}
h1{margin-top:0}.badge{display:inline-block;background:#0b6;color:#fff;padding:6px 10px;border-radius:999px;font-weight:700}
textarea{width:100%;height:190px;box-sizing:border-box;margin-top:14px;font:12px monospace;padding:10px}
button{padding:11px 18px;border:0;border-radius:9px;background:#ffcc00;color:#d40511;font-weight:800;margin-top:10px;cursor:pointer}
.note{font-size:13px;color:#555}
</style>
</head>
<body>
<div class="card">
<h1>DHL Express → Homey</h1>
<div id="badge" class="badge">Checking MyDHL+ session…</div>
<p id="detail"></p>
<textarea id="code" readonly placeholder="DHLEXPRESS1..."></textarea>
<button id="copy">Copy Homey session code</button>
<p class="note">Treat this session code like a password. Paste it only into your own MyParcel DHL Express device.</p>
</div>
<script src="result.js"></script>
</body>
</html>
