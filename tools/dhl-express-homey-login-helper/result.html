<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHL Express Homey Login Helper</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f6f6f6;color:#171717}.wrap{max-width:760px;margin:35px auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 30px #0002}.hero{background:#ffcc00;color:#d40511;padding:26px 30px;border-bottom:7px solid #d40511}.brand{font-size:48px;font-weight:900;font-style:italic;letter-spacing:-2px}.express{font-size:18px;font-weight:800;letter-spacing:5px;margin-top:-4px}.hero h1{margin:12px 0 0;font-size:24px;color:#111}.body{padding:28px 30px}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#e8fff5;color:#06603f;font-weight:700;margin-bottom:14px}.detail{font-size:14px;line-height:1.55;margin:0 0 16px}textarea{width:100%;height:210px;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;padding:12px;font-family:monospace;font-size:12px;resize:vertical}.btn{margin-top:12px;border:0;border-radius:9px;background:#d40511;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.note{font-size:12px;color:#666;margin-top:16px;line-height:1.45}:dir(rtl){direction:rtl;text-align:right}
